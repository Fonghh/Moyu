<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#217346">
<title>Q3_銷售報表_final_v3.xlsx</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    font-size: 13px; color: #222; background: #fff;
    display: flex; flex-direction: column;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  /* ===== Excel 外框 ===== */
  #titlebar {
    background: #217346; color: #fff; height: 36px; flex: none;
    display: flex; align-items: center; gap: 10px; padding: 0 10px;
  }
  /* 左上角 X 圖示＝隱藏功能（老闆鍵） */
  #logo, #logo2 {
    width: 24px; height: 24px; background: #fff; color: #217346; border-radius: 3px; border: 0;
    font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer;
  }
  #titlebar .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ribbon {
    flex: none; background: #f3f3f3; border-bottom: 1px solid #d4d4d4;
    display: flex; gap: 2px; padding: 0 6px; height: 30px; align-items: flex-end;
    overflow: hidden; white-space: nowrap;
  }
  #ribbon span { padding: 5px 10px; color: #444; }
  #ribbon span.on { background: #fff; border: 1px solid #d4d4d4; border-bottom: 0; color: #217346; font-weight: 600; }
  #fbar { flex: none; display: flex; align-items: stretch; height: 26px; border-bottom: 1px solid #d4d4d4; }
  #namebox { width: 64px; border-right: 1px solid #d4d4d4; padding: 4px 6px; font-size: 12px; }
  #fx { width: 30px; color: #888; font-style: italic; text-align: center; padding-top: 4px; border-right: 1px solid #d4d4d4; }
  #formula { flex: 1; padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  #tabs {
    flex: none; height: 28px; background: #f3f3f3; border-top: 1px solid #d4d4d4;
    display: flex; align-items: stretch; padding-left: 8px; gap: 2px;
  }
  #tabs span { padding: 5px 12px; color: #444; }
  #tabs span.on { background: #fff; color: #217346; font-weight: 600; border-bottom: 2px solid #217346; }
  #status {
    flex: none; min-height: 24px; background: #217346; color: #fff; font-size: 12px;
    display: flex; align-items: center; gap: 16px; padding: 0 10px env(safe-area-inset-bottom);
  }
  #status .sp { flex: 1; }
  @media (max-width: 480px) { #ribbon span:nth-child(n+5) { display: none; } }

  /* ===== 遊戲區 ===== */
  #stage { flex: 1; position: relative; overflow: hidden; touch-action: none; background: #fff; }
  #cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; }

  /* 右側按鈕：下竿／拉竿 */
  #actBtn {
    position: absolute; right: 16px; bottom: 20px; width: 92px; height: 92px; border-radius: 50%;
    border: 3px solid #1a5c38; background: radial-gradient(circle at 35% 30%, #3fa36a, #217346 70%);
    color: #fff; font-size: 20px; font-weight: 700; letter-spacing: 1px; font-family: inherit;
    box-shadow: 0 4px 0 #134a2c, 0 6px 12px rgba(0,0,0,.25); cursor: pointer; touch-action: none;
    text-shadow: 0 1px 0 rgba(0,0,0,.4);
  }
  #actBtn small { display: block; font-size: 11px; font-weight: 400; opacity: .85; letter-spacing: 0; }
  #actBtn.dim { filter: grayscale(.7) brightness(.95); opacity: .75; }
  #actBtn.wait { background: radial-gradient(circle at 35% 30%, #5b9bd5, #2e75b6 70%); border-color: #1f4e78; box-shadow: 0 4px 0 #1f4e78, 0 6px 12px rgba(0,0,0,.25); }
  /* 上鉤時明暗閃爍，提醒準備拉魚 */
  #actBtn.bite {
    background: radial-gradient(circle at 35% 30%, #ffe27a, #f0a500 70%); border-color: #a86f00; color: #5a3500;
    text-shadow: none; animation: biteFlash .28s steps(2, jump-none) infinite;
  }
  @keyframes biteFlash {
    0%   { filter: brightness(1.5); box-shadow: 0 0 0 6px rgba(255,220,80,.9), 0 0 28px 10px #ffd34d; transform: scale(1.08); }
    100% { filter: brightness(.55); box-shadow: 0 4px 0 #a86f00; transform: scale(1); }
  }
  #actBtn.fight { background: radial-gradient(circle at 35% 30%, #f07a5a, #c0392b 70%); border-color: #7b1f16; box-shadow: 0 4px 0 #7b1f16, 0 6px 12px rgba(0,0,0,.25); }
  #actBtn.hold { transform: translateY(3px) scale(.96); box-shadow: 0 1px 0 #7b1f16; }

  /* 回城按鈕（在背包上方） */
  #homeBtn {
    position: absolute; right: max(38px, calc(env(safe-area-inset-right, 0px) + 22px)); bottom: 196px; width: 48px; height: 48px; border-radius: 10px;
    background: #fff; border: 2px solid #8a5a2b; box-shadow: 0 3px 0 #8a5a2b; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #homeBtn canvas { width: 30px; height: 30px; image-rendering: pixelated; }
  #actBtn.charge { background: radial-gradient(circle at 35% 30%, #f8b26a, #ed7d31 70%); border-color: #a8541a; box-shadow: 0 4px 0 #a8541a, 0 6px 12px rgba(0,0,0,.25); }
  /* 背包按鈕（在拉魚按鈕上方） */
  #bagBtn {
    position: absolute; right: 34px; bottom: 128px; width: 56px; height: 56px; border-radius: 10px;
    background: #fff8e8; border: 2px solid #8a5a2b; box-shadow: 0 3px 0 #8a5a2b; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  #bagBtn canvas { width: 36px; height: 36px; image-rendering: pixelated; }
  #bagCount {
    position: absolute; right: -6px; top: -6px; min-width: 20px; height: 20px; border-radius: 10px;
    background: #c00000; color: #fff; font-size: 11px; font-weight: 700; line-height: 20px; padding: 0 5px;
  }
  #bagCount:empty { display: none; }

  /* 搏鬥量表 */
  #fight {
    position: absolute; left: 50%; top: 30px; transform: translateX(-50%); width: min(78%, 320px);
    background: rgba(255,255,255,.94); border: 1px solid #a0a0a0; box-shadow: 2px 2px 6px rgba(0,0,0,.2);
    padding: 6px 8px; font-size: 12px; display: none;
  }
  #fight.on { display: block; }
  #fight .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  #fight .lb { width: 34px; color: #555; }
  #fight .bar { flex: 1; height: 12px; background: #eee; border: 1px solid #bbb; position: relative; overflow: hidden; }
  #fight .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; }
  #tens i { background: #70ad47; }
  #tens::after { content: ""; position: absolute; right: 15%; top: 0; bottom: 0; border-left: 2px dashed #c00000; }
  #prog i { background: #2e75b6; }
  #fight .tip { text-align: center; color: #c00000; font-weight: 600; height: 16px; }

  /* 右上角小地圖（看起來像插入的 Excel 圖表） */
  #miniBox {
    position: absolute; right: max(8px, env(safe-area-inset-right, 0px)); top: 28px; background: #fff; border: 1px solid #bfbfbf;
    box-shadow: 0 1px 3px rgba(0,0,0,.15); padding: 2px 4px 4px; cursor: pointer;
  }
  #miniBox .mt { font-size: 10px; color: #595959; text-align: center; line-height: 14px; }
  #mini { display: block; image-rendering: pixelated; }
  .bigmap { display: block; margin: 0 auto; image-rendering: pixelated; border: 1px solid #bfbfbf; }
  .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 4px 10px; margin-top: 10px; font-size: 12px; }
  .legend i { display: inline-block; width: 16px; height: 11px; border: 1px solid #aaa; vertical-align: -1px; margin-right: 5px; }
  .pos { margin-top: 8px; font-size: 12px; color: #c00000; }

  /* 說明（Excel 註解樣式）與提示訊息 */
  .note {
    position: absolute; background: #ffffe1; border: 1px solid #a0a0a0; box-shadow: 2px 2px 4px rgba(0,0,0,.2);
    padding: 6px 8px; font-size: 12px; line-height: 1.6; color: #333; pointer-events: none;
  }
  #hint { left: 44px; top: 30px; max-width: 220px; }
  #toast { left: 50%; top: 120px; transform: translateX(-50%); white-space: nowrap; opacity: 0; transition: opacity .3s; }
  #toast.on { opacity: 1; }

  /* 對話框（釣到魚／背包） */
  #dlg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  #dlg.on { display: flex; }
  .win { background: #fff; border: 1px solid #217346; box-shadow: 0 8px 30px rgba(0,0,0,.35); width: min(100%, 360px); max-height: 86vh; display: flex; flex-direction: column; }
  .wt { background: #217346; color: #fff; padding: 6px 10px; display: flex; align-items: center; font-weight: 600; }
  .wt span { flex: 1; }
  .wt button { background: none; border: 0; color: #fff; font-size: 18px; width: 30px; cursor: pointer; }
  .wb { padding: 12px; overflow-y: auto; }
  .catch { text-align: center; }
  .catch canvas { width: 224px; height: 112px; image-rendering: pixelated; background: repeating-linear-gradient(0deg, #f7fbff 0 8px, #eef5fc 8px 16px); border: 1px solid #ddd; }
  .catch .fn { font-size: 20px; font-weight: 700; margin-top: 8px; }
  .catch .meta { color: #555; margin-top: 4px; }
  .catch .new { display: inline-block; margin-top: 6px; background: #c00000; color: #fff; padding: 1px 8px; font-size: 12px; }
  .rar { display: inline-block; padding: 0 6px; color: #fff; font-size: 12px; font-weight: 600; vertical-align: middle; border-radius: 2px; }
  .okBtn { display: block; margin: 14px auto 0; background: #217346; color: #fff; border: 0; padding: 8px 22px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .bagGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .card { border: 1px solid #d4d4d4; padding: 6px 4px; text-align: center; font-size: 12px; position: relative; }
  .card canvas { width: 84px; height: 42px; image-rendering: pixelated; }
  .card .n { font-weight: 600; }
  .card .c { position: absolute; right: 4px; top: 2px; font-weight: 700; color: #217346; }
  .card .s { color: #777; }
  .empty { color: #777; text-align: center; padding: 24px 0; }

  .catch .price { margin-top: 6px; color: #217346; font-weight: 600; }
  .catch .meta + .meta { font-size: 12px; color: #777; }
  .lvrow { font-size: 11px; color: #555; text-align: center; }
  .lvrow.warn { color: #c00000; font-weight: 600; }
  /* 商店：店員對話 */
  .npc { display: flex; gap: 10px; align-items: flex-start; }
  .npc canvas { width: 48px; height: 64px; image-rendering: pixelated; flex: none; background: #f3f3f3; border: 1px solid #ddd; }
  .bubble { flex: 1; min-width: 0; background: #ffffe1; border: 1px solid #a0a0a0; padding: 6px 8px; font-size: 13px; line-height: 1.5; }
  .money { margin: 10px 0 2px; font-size: 12px; color: #555; }
  .money b { color: #217346; font-size: 14px; }
  .sect { font-weight: 600; margin: 12px 0 6px; color: #217346; border-bottom: 1px solid #d4d4d4; padding-bottom: 2px; font-size: 12px; }
  table.xl { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.xl td, table.xl th { border: 1px solid #d4d4d4; padding: 3px 5px; }
  table.xl th { background: #ddebf7; font-weight: 600; }
  table.xl td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.xl td.desc { color: #777; font-size: 11px; }
  table.xl td.nowrap { white-space: nowrap; }
  table.xl canvas { width: 42px; height: 21px; image-rendering: pixelated; vertical-align: middle; }
  .sbtn { background: #217346; color: #fff; border: 0; padding: 3px 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .sbtn + .sbtn { margin-left: 3px; }
  .own { color: #777; font-size: 11px; }
  .up { color: #c00000; font-weight: 600; }
  .down { color: #2e75b6; font-weight: 600; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btnrow .okBtn { display: inline-block; margin: 12px 0 0; padding: 7px 14px; font-size: 13px; }
  .okBtn.alt { background: #fff; color: #217346; border: 1px solid #217346; }
  .okBtn:disabled { opacity: .45; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid #bfbfbf; background: #fff; padding: 3px 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .chip.on { border-color: #217346; background: #e2efda; color: #217346; font-weight: 600; }
  .tabs2 { display: flex; gap: 2px; margin: 12px 0 8px; border-bottom: 1px solid #d4d4d4; }
  .tabs2 button { border: 1px solid transparent; background: none; padding: 4px 12px; font-family: inherit; font-size: 12px; cursor: pointer; color: #555; }
  .tabs2 button.on { border-color: #d4d4d4; border-bottom-color: #fff; background: #fff; color: #217346; font-weight: 600; margin-bottom: -1px; }
  .buffs { font-size: 12px; color: #c55a11; margin-top: 4px; }
  .card .sbtn { margin-top: 4px; }
  .reels { display: flex; gap: 8px; justify-content: center; margin: 12px 0 0; }
  .reel { width: 64px; height: 64px; border: 2px solid #217346; background: #fff; font-size: 34px; font-weight: 700; color: #c00000;
    display: flex; align-items: center; justify-content: center; font-family: "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
  .sbtn:disabled { background: #bfbfbf; cursor: default; }
  .card.unk canvas { filter: brightness(0) opacity(.2); }

  /* 隱藏模式：只剩普通的 Excel */
  body.boss #actBtn, body.boss #bagBtn, body.boss #homeBtn, body.boss #miniBox, body.boss #fight, body.boss .note, body.boss #dlg { display: none !important; }
  /* ===== 3D 全螢幕版面 ===== */
  html, body { overscroll-behavior: none; }
  body { display: block; background: #9fd0f5; }
  #stage { position: fixed; inset: 0; flex: none; background: #9fd0f5; }
  #cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; image-rendering: auto; touch-action: none; }
  #hud {
    position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: max(10px, env(safe-area-inset-top, 0px));
    display: flex; align-items: center; gap: 8px; pointer-events: none;
  }
  #hud #logo { pointer-events: auto; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  #info { background: rgba(0,0,0,.4); color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #cross { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: rgba(255,255,255,.75); box-shadow: 0 0 0 1px rgba(0,0,0,.35); pointer-events: none; }
  #bang { position: absolute; left: 50%; top: 28%; transform: translateX(-50%); font-size: 64px; font-weight: 900; color: #ffd400;
    text-shadow: 0 0 0 #000, 0 3px 0 #a00, 0 0 18px rgba(255,200,0,.9); pointer-events: none; display: none; }
  #bang.on { display: block; animation: bangPop .3s steps(2, jump-none) infinite; }
  @keyframes bangPop { 0% { transform: translateX(-50%) scale(1.15); } 100% { transform: translateX(-50%) scale(.9); } }
  #joyBase { position: absolute; width: 96px; height: 96px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6);
    background: rgba(255,255,255,.12); display: none; pointer-events: none; }
  #joyKnob { position: absolute; left: 30px; top: 30px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.55); }
  #miniBox { top: max(10px, env(safe-area-inset-top, 0px)); }
  #fight { top: max(56px, calc(env(safe-area-inset-top, 0px) + 46px)); }
  #hint { left: max(10px, env(safe-area-inset-left, 0px)); top: max(52px, calc(env(safe-area-inset-top, 0px) + 42px)); }
  #toast { top: 40%; white-space: normal; max-width: 86%; text-align: center; }
  /* 搏鬥：只有提示文字和捲線器的出線米數，張力看竿子、釣線顏色和畫面邊緣 */
  #fight { background: rgba(0,0,0,.45); border: 0; box-shadow: none; color: #fff; text-align: center; padding: 6px 12px; border-radius: 10px; width: min(88%, 360px); }
  #fight .cue { font-size: 17px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  #fight .meta { white-space: nowrap; font-size: 12px; opacity: .85; font-variant-numeric: tabular-nums; }
  #fight .meta .warn, #flv.warn { color: #ffb3b3; font-weight: 600; }
  #danger { position: absolute; inset: 0; pointer-events: none; opacity: 0; box-shadow: inset 0 0 90px 30px rgba(220,0,0,.75); transition: opacity .1s; }
  /* 隱藏模式：整個畫面換成 Excel 報表 */
  #bossView { position: fixed; inset: 0; display: none; flex-direction: column; background: #fff; z-index: 20; }
  body.boss #bossView { display: flex; }
  #sheet { flex: 1; width: 100%; min-height: 0; display: block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="cross"></div>
  <div id="bang">！</div>
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="hud"><button id="logo" title="Excel">X</button><span id="info"></span></div>
  <div id="fight">
    <div class="cue" id="fcue"></div>
    <div class="meta"><span id="fline"></span>・<span id="flv"></span></div>
  </div>
  <div id="danger"></div>
  <div id="miniBox" title="區域分布圖"><div class="mt">區域分布</div><canvas id="mini"></canvas></div>
  <button id="homeBtn" title="回城"><canvas id="homeIcon" width="12" height="12"></canvas></button>
  <button id="bagBtn" title="背包"><canvas id="bagIcon" width="12" height="12"></canvas><span id="bagCount"></span></button>
  <button id="actBtn">下竿</button>
  <div class="note" id="hint">
    手機：左半邊拖曳＝走路，右半邊拖曳＝轉頭<br>
    電腦：WASD 走路，滑鼠拖曳或方向鍵轉頭<br>
    面向水面，<b>按住</b>「下竿」蓄力，放開拋竿<br>
    出現「！」快按拉竿；搏鬥時魚往哪衝，竿子往反方向壓（左手拖曳／A、D），魚累了再按住收線<br>
    走去撞店門就能進店；房子按鈕回城
  </div>
  <div class="note" id="toast"></div>
</div>
<div id="bossView">
  <div id="titlebar">
    <button id="logo2" title="Excel" class="xlogo">X</button>
    <div class="name">Q3_銷售報表_final_v3.xlsx - 已儲存</div>
  </div>
  <div id="ribbon">
    <span>檔案</span><span class="on">常用</span><span>插入</span><span>公式</span><span>資料</span><span>校閱</span><span>檢視</span>
  </div>
  <div id="fbar">
    <div id="namebox">C2</div>
    <div id="fx">fx</div>
    <div id="formula"></div>
  </div>
  <canvas id="sheet"></canvas>
  <div id="tabs"><span id="tab1">Q3彙總</span><span class="on" id="tab2">明細</span><span>+</span></div>
  <div id="status"><span id="st">就緒</span><span class="sp"></span><span>平均值: 4,532</span><span>計數: 120</span></div>
</div>
<div id="dlg"><div class="win"><div class="wt"><span id="dlgTitle"></span><button id="dlgX">✕</button></div><div class="wb" id="dlgBody"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ================= 參數 =================
const CFG = {
  cellW: 5, cellH: 2,    // 一格的大小（公尺）：東西 5、南北 2，跟報表格子一樣扁長
  mapW: 60, mapH: 80,    // 地圖格數（東邊是深海、遠洋）
  hdW: 34, hdH: 20,      // 列號寬、欄名高
  speed: 5,              // 走路速度（公尺/秒）
  eye: 1.65,             // 眼睛高度（公尺）
  lookSpeed: .005,       // 拖曳轉頭的靈敏度
  miniW: 64,             // 小地圖寬度（px）
  castTime: 0.45,        // 拋竿動畫秒數（力道越大飛越久）
  chargeTime: 1.6,       // 蓄力從 0 到滿的秒數（之後會往回掉，來回擺盪）
  castMin: 2, castMax: 26,     // 拋竿距離（公尺）：最小力道～最大力道
  waitMin: 1.8, waitMax: 5.5,   // 等魚上鉤秒數
  biteWin: 1.3,          // 上鉤後可以拉竿的秒數
  landTime: 1.3, landFly: .9,   // 釣到後的動畫秒數、魚在空中飛的秒數
  reelUp: 0.45,          // 按住時收線進度（每秒）

function fishLv(f, ratio) {

// ================= 今日行情（每 30 分鐘換一次） =================
const HOT_PERIOD = 30 * 60 * 1000;
function mulberry32(a) {
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
let hotCache = { p: -1, list: [] };
function hotList() {
  const p = Math.floor(Date.now() / HOT_PERIOD);
  if (hotCache.p !== p) {
    const r = mulberry32(p * 7919 + 13), pool = FISH.filter(f => !f.junk && !f.noDex).map(f => f.id), list = [];
    for (let k = 0; k < 4; k++) {   // 3 種漲價、1 種跌價
      const id = pool.splice(Math.floor(r() * pool.length), 1)[0];
      list.push({ id, m: k < 3 ? Math.round((1.3 + r() * .7) * 10) / 10 : .6 });
    }
    hotCache = { p, list };
  }
  return hotCache.list;
}
const hotMult = id => (hotList().find(h => h.id === id) || { m: 1 }).m;
// 售價＝基本價 × 尺寸倍率（0.7～1.6）× 行情
function priceOf(b) {
  const f = FISH_BY[b.id];
  let m = 1;
  if (!f.special && !f.junk) m = .7 + .9 * clamp((b.size - f.size[0]) / (f.size[1] - f.size[0]), 0, 1);
  if (b.dish) m *= METHOD_BY[b.dish].mult;   // 料理比生魚值錢
  return Math.max(1, Math.round(f.price * m * hotMult(b.id)));
}

  toast('回到海邊小鎮：左手邊魚市場、釣具行，右手邊遊藝場、餐廳，前面是碼頭');
}

$('logo2').addEventListener('click', () => setBoss(false));
document.addEventListener('visibilitychange', () => { if (document.hidden && !boss) setBoss(true); });

const pick = a => a[Math.floor(Math.random() * a.length)];
// ================= 水裡的魚影 =================
// 影子越大，上鉤的魚越大尾、越稀有
const SHADOW_N = { pond: 16, river: 26, sea: 36, deep: 40, far: 40 };
const SHADOW_P = { pond: [.5, .4], river: [.45, .4], sea: [.35, .45], deep: [.2, .45], far: [.15, .4] };   // 小、中的機率，其餘是大
const SHADOW_R = [[6, 2.2], [10, 3.6], [16, 5.5], [26, 9]];   // 小／中／大／變種怪影的半徑（px）
const waterCells = { pond: [], river: [], sea: [], deep: [], far: [] };
for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) { const w = TILES[tileAt(i, j)].water; if (w) waterCells[w].push([i, j]); }
const shadows = [];
function spawnShadow(w) {
  const c = waterCells[w][Math.floor(Math.random() * waterCells[w].length)], p = SHADOW_P[w], r = Math.random();
  shadows.push({ x: c[0] + .5, y: c[1] + .5, w, sz: r < p[0] ? 0 : r < p[0] + p[1] ? 1 : 2, a: rand(0, 6.28), sp: rand(.4, .9), turn: rand(1, 3), target: null });
}
for (const w in SHADOW_N) for (let k = 0; k < SHADOW_N[w]; k++) spawnShadow(w);
// 暴風雨時出現的變種怪影（sz 3）
function spawnMutantShadows(n) {
  for (let k = 0; k < n; k++) {
    const m = pick(MUTANTS), w = pick(m.water), c = pick(waterCells[w]);
    shadows.push({ x: c[0] + .5, y: c[1] + .5, w, sz: 3, a: rand(0, 6.28), sp: rand(.5, 1), turn: rand(1, 3), target: null });
  }
}
function clearMutantShadows() { for (let k = shadows.length - 1; k >= 0; k--) if (shadows[k].sz === 3 && !shadows[k].target) shadows.splice(k, 1); }
const waterOf = (x, y) => TILES[tileAt(Math.floor(x), Math.floor(y))].water;
function updateShadows(dt) {
  const k = CFG.cellH / CFG.cellW;   // 橫向一格比較寬，換算成相同的螢幕速度
  for (const s of shadows) {
    if (s.target) {   // 被浮標吸引，游過去
      const dx = (s.target.x - s.x) / k, dy = s.target.y - s.y, l = Math.hypot(dx, dy);
      s.a = Math.atan2(dy, dx);
      if (l > .15) { const v = Math.min(l, 1.2 * dt); s.x += Math.cos(s.a) * v * k; s.y += Math.sin(s.a) * v; }
      continue;
    }
    s.turn -= dt;
    if (s.turn <= 0) { s.a += rand(-1.5, 1.5); s.turn = rand(1, 3); }
    const nx = s.x + Math.cos(s.a) * s.sp * k * dt, ny = s.y + Math.sin(s.a) * s.sp * dt;
    if (waterOf(nx, ny) === s.w) { s.x = nx; s.y = ny; } else s.a += Math.PI * rand(.6, 1.4);
  }
}
function nearestShadow(cx, cy, maxD) {
  let best = null, bd = maxD;
  const k = CFG.cellW / CFG.cellH;
  for (const s of shadows) {
    if (s.target) continue;
    const d = Math.hypot((s.x - cx) * k, s.y - cy);
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}
function removeShadow(s) { const i = shadows.indexOf(s); if (i >= 0) { shadows.splice(i, 1); if (s.sz === 3) { if (weather.severe) spawnMutantShadows(1); } else spawnShadow(s.w); } }

// ================= 釣魚流程 =================
// 蓄力：0→1→0 來回擺盪，放開那一刻的值就是力道
function castPower() { const t = chargeT / CFG.chargeTime; return 1 - Math.abs((t % 2) - 1); }
// 沿著視線方向拋出去（公尺），落點不是水面就往回找最近的水面
function aimSpot(power, yw = yaw) {
  const fx = -Math.sin(yw), fz = -Math.cos(yw);
  const R = CFG.castMin + power * (CFG.castMax - CFG.castMin);
  for (let r = R; r >= CFG.castMin * .6; r -= .5) {
    const x = P.x + fx * r / TX, y = P.y + fz * r / TZ, i = Math.floor(x), j = Math.floor(y), t = tileAt(i, j);
    if (TILES[t].water) return { i, j, t, x, y };
  }
  return null;
}

// 收竿：放掉被吸引過來的魚影
function doCast() {
  const pw = castPower(), s = aimSpot(pw);
  if (!s) { state = 'walk'; toast('沒拋進水裡，力道再大一點'); return; }
  // 每次下竿用掉一個餌（麵包屑免費）
  const lure = LURE_BY[S.bait];
  if (lure && !lure.waters.includes(TILES[s.t].water)) toast(`${lure.name}不適合這片水域，可能只會釣到雜物`);
  if (S.bait !== 'bread' && !lure) {
    if ((S.baits[S.bait] || 0) <= 0) { toast(`${BAIT_BY[S.bait].name}用完了，改用麵包屑`); S.bait = 'bread'; }
    else S.baits[S.bait]--;
    saveAll();
  }
  spot = s; state = 'cast'; castT = 0; castDur = CFG.castTime * (.6 + pw);
}

function stopFishing(msg) {
  if (spot && spot.shadow) { spot.shadow.target = null; spot.shadow = null; }
  state = 'walk';
  if (msg) toast(msg);
}

function press() {
  if (boss) return;
  if (state === 'walk') {
    if (!aimSpot(1)) { toast('前面拋不到水，轉向水面再下竿'); return; }
    state = 'charge'; chargeT = 0;   // 按住蓄力，放開才拋
    hideHint();
  } else if (state === 'cast' || state === 'wait') {
    stopFishing('收竿了');
  } else if (state === 'bite') {
    startFight(); holding = true;
  } else if (state === 'fight') {
    holding = true;
  }
}

// 魚影大小對各稀有度的機率倍率：小影多小魚，大影多稀有大魚
const SZ_MULT = [[2, 1, .2, .1, .05], [1, 1, 1, 1, 1], [.3, 1, 3, 4, 5]];
const SZ_RATIO = [() => Math.pow(Math.random(), 2.5) * .6, () => Math.pow(Math.random(), 1.8), () => .4 + .6 * Math.pow(Math.random(), .8)];
function pickFish(water, sz) {
  const list = FISH.filter(f => f.water.includes(water)), lure = LURE_BY[S.bait];
  const ws = list.map(f => {
    if (f.mutant) return 0;
    if (f.junk || f.special) return f.w;
    if (ONLY_BAIT[f.id] && S.bait !== ONLY_BAIT[f.id]) return 0;
    const base = RAR[f.rar].w * SZ_MULT[sz][f.rar] * (f.rar >= 2 && hasBuff('sashimi') ? 1.5 : 1);   // 生魚片：稀有魚多
    // 誘餌只有掠食魚會咬；鐵板特別吸引旗魚
    if (lure) return f.pred && lure.waters.includes(water) ? base * 3 * (lure.id === 'jig' && f.id === 'marlin' ? 2 : 1) : 0;
    return base * (f.bait.includes(S.bait) ? 3 : .4);
  });
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let k = 0; k < list.length; k++) { r -= ws[k]; if (r <= 0) return list[k]; }
  return list[0];
}

function startFight() {
  const sz = spot.shadow ? spot.shadow.sz : 1;
  if (spot.shadow) removeShadow(spot.shadow);
  spot.shadow = null;
  const water = TILES[spot.t].water;
  // 變種怪影：釣上來的是變種怪魚
  const muts = sz === 3 ? MUTANTS.filter(m => m.water.includes(water)) : [];
  const f = muts.length ? pick(muts) : pickFish(water, Math.min(sz, 2));
  const ratio = f.special ? 0 : f.mutant ? rand(.3, 1) : SZ_RATIO[Math.min(sz, 2)]();
  const size = f.special ? 0 : Math.round((f.size[0] + (f.size[1] - f.size[0]) * ratio) * 10) / 10;
  const lv = fishLv(f, ratio), diff = lv - S.rod;
  splash(spot.x, spot.y, 10);
  // 魚比釣竿強 2 級以上，一上鉤就斷線
  if (diff >= 2) { state = 'walk'; toast(`啪！線斷了…這條魚太強（Lv${lv}），要換更好的釣竿` + loseLure()); return; }
  const str = (f.junk || f.special ? 0.5 : RAR[f.rar].str) * (0.85 + 0.35 * ratio) * (weather.severe ? 1.1 : 1);
  // 魚的位置用「玩家為中心的角度＋距離」記，玩家搏鬥時不會移動
  const px = P.x * TX, pz = P.y * TZ, dx = spot.x * TX - px, dz = spot.y * TZ - pz;
  F = newFight(f, size, str, lv, sz, diff >= 1 ? 1.35 : diff < 0 ? .85 : 1, Math.max(3, Math.hypot(dx, dz)));
  F.px = px; F.pz = pz; F.a0 = Math.atan2(-dx, -dz);
  if (!S.tipFight) { S.tipFight = 1; saveAll(); toast('魚往哪衝，竿子就往反方向壓；魚累了再收線'); }
  state = 'fight';
  $('flv').textContent = `魚力 Lv${lv}・${RODS[S.rod - 1].name} Lv${S.rod}` + (diff >= 1 ? '（竿子太弱！）' : '');
  $('flv').className = diff >= 1 ? 'warn' : '';
  $('fight').classList.add('on');
}

// 線斷掉時 30% 機率弄丟誘餌
function loseLure() {
  const lure = LURE_BY[S.bait];
  if (!lure || Math.random() > .3) return '';
  delete S.lures[lure.id]; S.bait = 'bread'; saveAll();
  return `（${lure.name}也被扯走了…）`;
}

function endFight(ok, msg) {
  $('fight').classList.remove('on');
  holding = false;
  if (!ok) { state = 'walk'; F = null; toast(msg); return; }
  const item = { id: F.f.id, size: F.size, t: Date.now() };
  const isNew = !S.dex[item.id];
  bag.push(item); addDex(item); saveAll();
  // 先播拉竿、魚飛起來甩尾、落到手上的動畫，再跳出結果
  L = { f: F.f, size: F.size, sz: F.sz, isNew, where: TILES[spot.t].name, item, t: 0 };
  state = 'land';
  splash(spot.x, spot.y, 16);
  F = null;
}

const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
function openDlg(title, body) {

}
function closeDlg() {

// ================= 背包、圖鑑 =================
function openBag(tab) {
  if (boss || state === 'fight' || state === 'bite' || state === 'land') return;
  tab = tab || 'bag';
  const dexList = FISH.filter(f => !f.noDex);
  const d = el('div');
  d.appendChild(moneyLine());
  const bl = buffList();
  if (bl.length) d.appendChild(el('div', 'buffs', '目前加成：' + bl.join('、')));
  // 選擇這次下竿要用的餌
  d.appendChild(el('div', 'sect', '使用餌料'));
  const chips = el('div', 'chips');
  for (const b of BAITS) {
    const n = b.id === 'bread' ? null : (S.baits[b.id] || 0);
    if (n === 0) continue;
    const c = el('button', 'chip' + (S.bait === b.id ? ' on' : ''), b.name + (n == null ? '' : ' ×' + n));
    c.onclick = () => { S.bait = b.id; saveAll(); openBag(tab); };
    chips.appendChild(c);
  }
  for (const l of LURES) {
    if (!S.lures[l.id]) continue;
    const c = el('button', 'chip' + (S.bait === l.id ? ' on' : ''), l.name + '（誘餌）');
    c.onclick = () => { S.bait = l.id; saveAll(); openBag(tab); };
    chips.appendChild(c);
  }
  d.appendChild(chips);
  const tabs = el('div', 'tabs2');
  for (const [k, name] of [['bag', `漁獲 ${bag.length}`], ['dex', `圖鑑 ${dexList.filter(f => S.dex[f.id]).length}/${dexList.length}`]]) {
    const b = el('button', tab === k ? 'on' : '', name); b.onclick = () => openBag(k); tabs.appendChild(b);
  }
  d.appendChild(tabs);
  const body = el('div', 'bagGrid');
  if (tab === 'bag') {
    const groups = {};
    for (const b of bag) {
      if (b.dish) continue;
      const g = groups[b.id] || (groups[b.id] = { n: 0, max: 0, v: 0 });
      g.n++; g.max = Math.max(g.max, b.size); g.v += priceOf(b);
    }
    const ids = Object.keys(groups).sort((a, b) => {
      const fa = FISH_BY[a], fb = FISH_BY[b];
      return (fb.junk ? -1 : fb.rar) - (fa.junk ? -1 : fa.rar) || FISH.indexOf(fa) - FISH.indexOf(fb);
    });
    if (!ids.length && !bag.length) { body.className = 'empty'; body.textContent = '還沒有漁獲，去水邊試試吧！'; }
    for (const id of ids) {
      const f = FISH_BY[id], g = groups[id];
      const c = el('div', 'card');
      c.appendChild(fishCanvas(id, 3));
      c.appendChild(el('div', 'n', f.name));
      c.appendChild(rarTag(f));
      if (!f.special && !f.junk) c.appendChild(el('div', 's', `最大 ${g.max} cm`));
      c.appendChild(el('div', 's', `估價 $${fmtN(g.v)}`));
      c.appendChild(el('div', 'c', '×' + g.n));
      body.appendChild(c);
    }
  } else {
    // 圖鑑：沒釣過的顯示剪影和出沒地點
    for (const f of dexList) {
      const known = S.dex[f.id];
      const c = el('div', 'card' + (known ? '' : ' unk'));
      c.appendChild(fishCanvas(f.id, 3));
      c.appendChild(el('div', 'n', known ? f.name : '？？？'));
      if (known) {
        c.appendChild(rarTag(f));
        c.appendChild(el('div', 's', f.special || f.junk ? `撈到 ${known.n} 次` : `最大 ${known.max} cm`));
      } else c.appendChild(el('div', 's', '出沒：' + f.water.map(w => WATER_NAME[w]).join('、') + (f.mutant ? '・暴風雨' : '')));
      body.appendChild(c);
    }
  }
  d.appendChild(body);
  // 料理：可以吃（得到加成），要賣請拿去餐廳
  const dishes = bag.filter(b => b.dish);
  if (tab === 'bag' && dishes.length) {
    d.appendChild(el('div', 'sect', '料理（吃了有加成，也可以拿去餐廳賣）'));
    const g2 = el('div', 'bagGrid');
    for (const b of dishes) {
      const c = el('div', 'card');
      c.appendChild(dishCanvas(b, 3));
      c.appendChild(el('div', 'n', dishName(b)));
      c.appendChild(el('div', 's', METHOD_BY[b.dish].buff));
      const bt = el('button', 'sbtn', '吃'); bt.onclick = () => { eatDish(b); openBag('bag'); };
      c.appendChild(bt);
      g2.appendChild(c);
    }
    d.appendChild(g2);
  }
  openDlg('背包', d);
}

function sellItems(list) {

    const i = bag.indexOf(b); if (i >= 0) bag.splice(i, 1);

  S.money += total; saveAll();
  const f = FISH_BY[best.b.id];
  let line;
  if (list.length > 1) line = `總共 ${list.length} 件，$${fmtN(total)}，點一下錢喔！`;
  else if (total >= 5000) line = `哇！${f.name}！這個好東西我收了，$${fmtN(total)}！`;
  else if (f.junk) line = `${f.name}…好啦，算你 $${total}。`;

// 料理的像素圖：烤、炸用魚的圖加顏色，湯和生魚片另外畫
const DISH_CACHE = {};
function dishImg(fid, m) {
  const key = fid + m;
  if (DISH_CACHE[key]) return DISH_CACHE[key];
  const DW = 28, DH = 14, f = FISH_BY[fid], c = document.createElement('canvas'); c.width = DW; c.height = DH;
  const x = c.getContext('2d'), px = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
  const body = f.body || '#999999', belly = f.belly || '#dddddd';
  if (m === 'soup') {
    px(9, 0, 1, 3, '#cccccc'); px(13, 1, 1, 3, '#cccccc'); px(17, 0, 1, 3, '#cccccc');   // 熱氣
    px(4, 5, 20, 1, '#7f7f7f'); px(5, 6, 18, 1, '#f3d9a4');
    px(8, 6, 3, 1, body); px(15, 6, 3, 1, belly); px(12, 6, 2, 1, '#5aa02c');
    for (let y = 7; y <= 11; y++) px(5 + (y - 7), y, 18 - 2 * (y - 7), 1, y === 8 ? '#2e75b6' : '#ffffff');
    px(4, 6, 1, 2, '#7f7f7f'); px(23, 6, 1, 2, '#7f7f7f'); px(10, 12, 8, 1, '#bfbfbf');
  } else {
    // 盤子
    px(3, 11, 22, 1, '#d9d9d9'); px(2, 12, 24, 1, '#ffffff'); px(4, 13, 20, 1, '#a6a6a6'); px(2, 11, 1, 1, '#a6a6a6'); px(25, 11, 1, 1, '#a6a6a6');
    if (m === 'sashimi') {
      px(3, 7, 3, 4, '#5aa02c'); px(22, 8, 2, 2, '#8fd14f');   // 紫蘇葉、山葵
      for (let k = 0; k < 4; k++) { px(7 + k * 4, 6 + (k % 2), 3, 4, belly); px(7 + k * 4, 6 + (k % 2), 3, 1, body); px(7 + k * 4, 10, 3, 1, '#7f7f7f'); }
    } else {
      const t = document.createElement('canvas'); t.width = DW; t.height = DH;
      const tx = t.getContext('2d'); tx.imageSmoothingEnabled = false;
      tx.drawImage(FISH_IMG[fid], 3, 0, 22, 11);
      tx.globalCompositeOperation = 'source-atop';
      tx.fillStyle = m === 'grill' ? 'rgba(110,55,10,.5)' : 'rgba(230,160,40,.6)';
      tx.fillRect(0, 0, DW, DH);
      tx.fillStyle = m === 'grill' ? '#3a2210' : '#fff3c0';
      for (let k = 0; k < DW; k++) for (let y = 0; y < 11; y++) {
        if (m === 'grill' ? (k + y) % 5 === 0 && k > 8 && k < 22 : hash(k, y) % 5 === 0) tx.fillRect(k, y, 1, 1);
      }
      x.drawImage(t, 0, 0);
    }
  }
  return (DISH_CACHE[key] = c);
}
function dishCanvas(b, scale) {
  const c = document.createElement('canvas'); c.width = 28 * scale; c.height = 14 * scale;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  x.drawImage(dishImg(b.id, b.dish), 0, 0, c.width, c.height);
  return c;
}

    if (t < 700 + 2 * 350 + 100) return;

    if ($('dlg').classList.contains('on') && $('dlgTitle').textContent === NPC.slot.title) openShop('slot', line); else toast(line);
  }, 70);
}

// ================= 搏鬥（擬真手感） =================
// 魚有自己的動作：往左右衝、往外衝、游過來、甩頭、跳水、休息。
// 玩家用竿子左右壓（側壓）跟收線應對；張力太大捲線器會洩線，太鬆魚會脫鉤，甩頭跳水時硬收會斷線。
const JUMPERS = new Set(['zacco', 'ayu', 'salmon', 'scad', 'mahi', 'marlin', 'tuna', 'piranha', 'koi', 'goldkoi', 'glowkoi']);
const FIGHT = {
  reelSpeed: 3.2,   // 收線速度（公尺/秒）
  drag: .8,         // 張力超過這個值，捲線器開始出線
  lineBase: 40,     // 線長（公尺），好竿子多 10 公尺
  slackLose: 1.4,   // 鬆線超過幾秒魚就脫鉤
  landD: 2.2,       // 拉到幾公尺內算拉到腳邊
  stamRate: .9,     // 體力消耗倍率（越大越快拉上來）
};
function newFight(f, size, str, lv, sz, tensMul, d) {
  return { f, size, str, lv, sz, tensMul, d, th: 0, stam: 1, tens: .35, spike: 0, slack: 0, rod: 0, turn: 0,
    act: 'run', dir: 0, actT: rand(1, 1.8), t: 0, jump: 0, drag: false, jumper: JUMPERS.has(f.id) };
}
// 換下一個動作：越有體力越愛衝，越累越常休息
function nextAct(F) {
  const s = F.stam, w = {
    run: .25 + 1.6 * s, charge: .35 + .3 * s, shake: .25 + .4 * s,
    jump: F.jumper && s > .25 ? .35 + .4 * s : 0, rest: .25 + 1.4 * (1 - s),
  };
  let r = Math.random() * Object.values(w).reduce((a, b) => a + b, 0);
  for (const k in w) { r -= w[k]; if (r <= 0) { F.act = k; break; } }
  F.turn = 0; F.turned = false;
  if (F.act === 'run') { F.dir = Math.random() < .3 ? 0 : (Math.random() < .5 ? -1 : 1); F.actT = rand(1.2, 2.8); }
  else if (F.act === 'charge') F.actT = rand(.9, 1.7);
  else if (F.act === 'shake') F.actT = rand(.6, 1);
  else if (F.act === 'jump') { F.actT = 1.1; F.jump = 0; }
  else F.actT = rand(1, 2.2);
}
// 推進一步。inp = { rod: -1～1 竿子左右, reel: 是否收線 }；env = { rodLv, reelBuff, soupBuff, inWater(th, d) }
// 回傳 null（繼續）或 { ok, msg }
function stepFight(F, inp, dt, env) {
  F.t += dt;
  F.rod += (inp.rod - F.rod) * Math.min(1, dt * 6);
  F.actT -= dt;
  if (F.actT <= 0) nextAct(F);
  const power = F.str * (.35 + .65 * F.stam);
  let pull = .25 * power, dd = 0, dth = 0, side = 0;
  const reel = inp.reel ? 1 : 0;
  if (F.act === 'run') {
    pull = power;
    if (F.dir === 0) dd += (1.6 + 1.8 * power) * dt;
    else {
      dd += .5 * dt;
      dth = -F.dir * (1.8 + 1.6 * power) / Math.max(F.d, 4) * dt;   // dir +1 從玩家看是往右
      // 側壓：竿子往魚跑的反方向壓，魚會被扭回來、體力掉得快；順著魚，張力小但魚一直跑
      const k = -F.rod * F.dir;
      if (k > .3) { side = k; F.turn += k * dt / (.6 + .4 * F.str); if (F.turn > 1) { F.act = 'rest'; F.actT = rand(.8, 1.4); F.turned = true; } }
      else if (k < -.3) pull *= .55;
    }
  } else if (F.act === 'charge') { pull = .1 * power; dd -= (2.2 + 1.4 * power) * dt; }
  else if (F.act === 'shake') pull = power * (.6 + Math.abs(Math.sin(F.t * 22)) * .5);
  else if (F.act === 'jump') { pull = .45 * power; F.jump += dt; }
  // 收線：魚在衝的時候收不太動
  const reelSp = FIGHT.reelSpeed * (1 + .15 * (env.rodLv - 1)) * (1 + .3 * env.reelBuff);
  dd -= reel * reelSp * ({ run: .18, charge: 1.2, rest: 1, shake: .4, jump: .3 })[F.act] * dt;
  // 張力：魚拉的力＋收線＋側壓
  let target = pull * .55 + reel * ({ run: .45, charge: .2, rest: .15, shake: .5, jump: .55 })[F.act] + side * .18;
  if (F.act === 'charge') target = reel ? .3 : .03;   // 魚游過來不收線就會鬆線
  target *= F.tensMul * (1 - .25 * env.soupBuff);
  F.tens += (target - F.tens) * Math.min(1, dt * 5);
  // 洩線：超過上限捲線器自動出線，不會馬上斷
  F.drag = F.tens > FIGHT.drag;
  if (F.drag) { dd += (F.tens - FIGHT.drag) * 18 * dt; F.tens = FIGHT.drag + (F.tens - FIGHT.drag) * .3; }
  // 甩頭、跳水時還在硬收：瞬間張力暴增
  if ((F.act === 'shake' || F.act === 'jump') && reel && Math.random() < dt * 2.4 * F.tensMul) F.spike = Math.max(F.spike, .35 + Math.random() * .2);
  F.spike = Math.max(0, F.spike - dt * 1.2);
  // 體力：有張力才會累，側壓累得更快；越強的魚體力越多
  F.stam = Math.max(0, F.stam - dt * FIGHT.stamRate * (.01 + F.tens * .085 + side * .05) / Math.pow(F.str, 1.6));
  // 位置（魚只能在水裡，撞到岸就掉頭）
  const nth = clamp(F.th + dth, -1.3, 1.3), nd = Math.max(.8, F.d + dd);
  if (env.inWater(nth, nd)) { F.th = nth; F.d = nd; }
  else { F.d = Math.max(.8, F.d + Math.min(0, dd)); if (F.act === 'run') F.dir = F.dir === 0 ? (Math.random() < .5 ? -1 : 1) : -F.dir; }
  // 結果
  if (F.tens + F.spike >= 1) return { ok: false, msg: '啪！線斷了…甩頭、跳水的時候別硬收' };
  if (F.d > FIGHT.lineBase + 10 * (env.rodLv - 1)) return { ok: false, msg: '線被拉光了…魚往外衝時要側壓、別讓牠一直跑' };
  F.slack = F.tens < .08 ? F.slack + dt : Math.max(0, F.slack - dt * 2);
  if (F.slack > FIGHT.slackLose) return { ok: false, msg: '線鬆掉了，魚脫鉤…魚游過來時要快收線' };
  if (F.d < FIGHT.landD) {
    if (F.stam < .35) return { ok: true };
    F.act = 'run'; F.dir = 0; F.actT = rand(1.2, 2); F.d = FIGHT.landD + .3;   // 還有力氣，最後再衝一次
  }
  return null;
}
// 給畫面用的提示文字
function fightCue(F) {
  if (F.act === 'jump') return '跳出水面了！先別收線';
  if (F.act === 'shake') return '甩頭！放鬆一下';
  if (F.act === 'charge') return '朝你游過來了，快收線！';
  if (F.act === 'rest') return F.turned ? '扭過來了！趁現在收線' : '魚累了，收線！';
  if (F.dir < 0) return '← 往左衝！竿子往右壓';
  if (F.dir > 0) return '往右衝！→ 竿子往左壓';
  return '往外衝！別硬收，等牠停';
}

// ================= 更新 =================
let lastTile = T.PATH, lastBlockT = -9, shopTouch = false;
// 天氣：依時間決定，大家看到的一樣
let weatherP = Math.floor(Date.now() / WEATHER_PERIOD), weather = weatherAt(weatherP);
if (weather.severe) spawnMutantShadows(8);
function checkWeather() {
  const p = Math.floor(Date.now() / WEATHER_PERIOD);
  if (p === weatherP) return;
  const old = weather; weatherP = p; weather = weatherAt(p);
  if (old === weather) return;
  if (weather.severe) { spawnMutantShadows(8); toast('暴風雨來了！水裡出現暗紅色的巨大怪影…'); }
  else { if (old.severe) clearMutantShadows(); toast(`天氣轉為${weather.name}` + (weather.rain ? '，魚比較容易上鉤' : '')); }
}

function update(dt) {
  gameT += dt;
  if (state !== 'fight') {
    if (keys.has('arrowleft')) yaw += 1.8 * dt;
    if (keys.has('arrowright')) yaw -= 1.8 * dt;
  }
  const v = moveInput();
  const moving = Math.abs(v.f) + Math.abs(v.s) > 0.01;

  if (state === 'walk') {
    if (moving) {
      hideHint();
      // 在船上用船速，暴風雨時船開比較慢（公尺／秒）
      const sp = (onBoat() ? BOATS[S.boat - 1].speed * (weather.severe ? .7 : 1) : CFG.speed) * dt;
      const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
      const wx = (fx * v.f + rx * v.s) * sp, wz = (fz * v.f + rz * v.s) * sp;
      const nx = P.x + wx / TX, ny = P.y + wz / TZ;
      if (free(nx, P.y)) P.x = nx;
      if (free(P.x, ny)) P.y = ny;
      // 看前方一點：撞到店門就進店；船開不進去的水域給提示
      const l = Math.hypot(wx, wz) || 1;
      const ahead = tileAt(Math.floor(P.x + wx / l * .8 / TX), Math.floor(P.y + wz / l * .8 / TZ));
      if (TILES[ahead].shop) {
        if (!shopTouch) { shopTouch = true; keys.clear(); joyRelease(); openShop(TILES[ahead].shop); }
      } else shopTouch = false;
      if (TILES[ahead].water && !canEnter(ahead) && gameT - lastBlockT > 2.5) {
        lastBlockT = gameT;
        toast(`${BOATS[S.boat - 1].name}開不進${WATER_NAME[TILES[ahead].water]}，要漁船才行`);
      }
      P.walkT += dt;
    } else shopTouch = false;
    P.moving = moving;
  } else if (state === 'charge') {
    P.moving = false; chargeT += dt;   // 蓄力中可以轉頭瞄準
  } else {
    P.moving = false;
    if ((state === 'cast' || state === 'wait') && moving) stopFishing();
  }

  if (state === 'cast') {
    castT += dt;
    if (castT >= castDur) {
      state = 'wait';
      splash(spot.x, spot.y, 6);
      // 附近有魚影就會游過來；沒有的話要等比較久
      const s = nearestShadow(spot.x, spot.y, 5);
      if (s) { s.target = { x: spot.x, y: spot.y }; spot.shadow = s; waitT = rand(1, 2.5); }
      else { spot.shadow = null; waitT = rand(CFG.waitMax, CFG.waitMax * 2); }
      // 下雨魚比較快上鉤；誘餌、炸魚也會縮短等待
      waitT *= (weather.wait || 1) * (1 - (LURE_BY[S.bait] ? LURE_BY[S.bait].cut : 0)) * (1 - .35 * hasBuff('fry'));
    }
  } else if (state === 'wait') {
    waitT -= dt;
    const s = spot.shadow;
    const arrived = !s || Math.hypot((s.x - s.target.x) * CFG.cellW / CFG.cellH, s.y - s.target.y) < .3;
    if (waitT <= 0 && arrived) { state = 'bite'; biteT = CFG.biteWin; splash(spot.x, spot.y, 10); }
  } else if (state === 'bite') {
    biteT -= dt;
    if (biteT <= 0) {
      if (spot.shadow) removeShadow(spot.shadow);   // 魚被嚇跑了
      spot.shadow = null;
      stopFishing('魚跑掉了…上鉤時要快按！');
    }
  } else if (state === 'fight') {
    updateFight(dt);
  } else if (state === 'land') {
    L.t += dt;
    if (L.t >= CFG.landTime) {
      state = 'caught'; catchShow = L.f.id;
      showCatch(L.f, L.size, L.isNew, L.where, L.item);
    }
  }

  updateShadows(dt);
  checkWeather();
  updateParts(dt);
}

// 能不能站在這一格：陸地，或是船開得進去的水域（店面是房子，不能走進去）
function canEnter(t) { return TILES[t].walk || (TILES[t].water && S.boat > 0 && BOATS[S.boat - 1].waters.includes(TILES[t].water)); }
const onBoat = () => !!TILES[tileAt(Math.floor(P.x), Math.floor(P.y))].water;
// 人的半徑約 0.3 公尺，換算成格子
function free(x, y) {
  const ox = .3 / TX, oy = .3 / TZ;
  for (const [a, b] of [[-ox, -oy], [ox, -oy], [-ox, oy], [ox, oy]]) {
    if (!canEnter(tileAt(Math.floor(x + a), Math.floor(y + b)))) return false;
  }
  return true;
}

// 魚在世界中的位置（公尺）
function fishWorld(Fi, th = Fi.th, d = Fi.d) { const a = Fi.a0 + th; return [Fi.px - Math.sin(a) * d, Fi.pz - Math.cos(a) * d]; }
function updateFight(dt) {
  const v = moveInput();
  const r = stepFight(F, { rod: clamp(v.s, -1, 1), reel: holding }, dt, {
    rodLv: S.rod, reelBuff: hasBuff('grill'), soupBuff: hasBuff('soup'),
    inWater: (th, d) => { const [x, z] = fishWorld(F, th, d); return !!TILES[tileAt(Math.floor(x / TX), Math.floor(z / TZ))].water; },
  });
  const [fx, fz] = fishWorld(F);
  spot.x = fx / TX; spot.y = fz / TZ;
  // 鏡頭慢慢跟著魚轉，魚一直在視線前方
  let da = F.a0 + F.th - yaw; da = Math.atan2(Math.sin(da), Math.cos(da)); yaw += da * Math.min(1, dt * 1.6);
  // 魚衝刺、甩頭時水面有水花
  if ((F.act === 'run' && Math.random() < dt * 10) || (F.act === 'shake' && Math.random() < dt * 16)) splash(spot.x, spot.y, 2);
  if (F.act === 'jump' && F.jump < .1 && Math.random() < .5) splash(spot.x, spot.y, 8);
  if (F.spike > .3 && navigator.vibrate) navigator.vibrate(30);   // 有支援的手機會震一下
  if (r) { if (r.ok) endFight(true); else endFight(false, r.msg + (r.msg.startsWith('啪') ? loseLure() : '')); }
}

// 水花（公尺座標，畫在 3D 世界裡）
function splash(x, y, n) {
  for (let k = 0; k < n; k++) parts.push({ x: x * TX, y: WATER_Y + .05, z: y * TZ, vx: rand(-1.2, 1.2), vy: rand(1.5, 3.5), vz: rand(-1.2, 1.2), life: rand(.4, .8) });
  if (parts.length > 200) parts.splice(0, parts.length - 200);
}
function updateParts(dt) {
  for (let k = parts.length - 1; k >= 0; k--) {
    const p = parts[k];
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vy -= 9.8 * dt; p.life -= dt;
    if (p.life <= 0 || p.y < WATER_Y - .2) parts.splice(k, 1);
  }
}

const ITEMS = ['筆電', '螢幕', '滑鼠', '鍵盤', '耳機', '喇叭', '印表機', '投影機', '路由器', '硬碟', '隨身碟', '網路卡', '電源', '機殼', '主機板', '顯示卡'];
const HEADS = ['品項', '1月', '2月', '3月', 'Q1', '4月', '5月', '6月', 'Q2', '上半年', '目標', '達成率', '成長率', '單價', '數量', '金額'];

// 店面格顯示店名，其他格顯示假報表資料
function cellLabel(i, j, t = tileAt(i, j)) { return !boss && TILES[t].shop ? TILES[t].name : cellText(i, j); }

  if (j === 0) return HEADS[i % HEADS.length];

  if (k === 9 || k === 15) return fmtN(h % 90000 + 20000);

}

{

// ---- 地形：陸地、水底、岸邊的牆合成一個網格；水面另一個半透明網格 ----
function buildTerrain() {
  const lp = [], lc = [], ln = [], wp = [], wc = [];
  const c = new THREE.Color();
  const quad = (P_, C_, N_, x0, z0, x1, z1, y) => {
    for (const [x, z] of [[x0, z0], [x0, z1], [x1, z0], [x1, z0], [x0, z1], [x1, z1]]) {
      P_.push(x, y, z); C_.push(c.r, c.g, c.b); if (N_) N_.push(0, 1, 0);
    }
  };
  const wall = (xa, za, xb, zb, yt, yb, nx, nz) => {
    for (const [x, y, z] of [[xa, yt, za], [xa, yb, za], [xb, yt, zb], [xb, yt, zb], [xa, yb, za], [xb, yb, zb]]) {
      lp.push(x, y, z); lc.push(c.r, c.g, c.b); ln.push(nx, 0, nz);
    }
  };
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const t = tileAt(i, j), tl = TILES[t], x0 = i * TX, x1 = x0 + TX, z0 = j * TZ, z1 = z0 + TZ;
    const shade = ((hash(i, j) % 100) / 100 - .5) * .07;
    if (tl.water) {
      c.set(WATER_COL[tl.water]); quad(wp, wc, null, x0, z0, x1, z1, WATER_Y);
      c.set('#6f6a4a').offsetHSL(0, 0, shade - (tl.water === 'deep' || tl.water === 'far' ? .15 : 0));
      quad(lp, lc, ln, x0, z0, x1, z1, BED_Y[tl.water]);
      continue;
    }
    const h = t === T.DOCK ? .25 : 0;
    c.set(GROUND_COL[t] || GROUND_COL[T.PATH]).offsetHSL(0, 0, shade);
    quad(lp, lc, ln, x0, z0, x1, z1, h);
    // 跟水相鄰的邊補一面牆，岸邊才不會透空
    c.set(t === T.DOCK ? '#6b4423' : '#7a6a48');
    for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nt = TILES[tileAt(i + di, j + dj)];
      if (!nt.water) continue;
      const yb = BED_Y[nt.water];
      if (di === 1) wall(x1, z0, x1, z1, h, yb, 1, 0);
      if (di === -1) wall(x0, z0, x0, z1, h, yb, -1, 0);
      if (dj === 1) wall(x0, z1, x1, z1, h, yb, 0, 1);
      if (dj === -1) wall(x0, z0, x1, z0, h, yb, 0, -1);
    }
  }
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
  lg.setAttribute('color', new THREE.Float32BufferAttribute(lc, 3));
  lg.setAttribute('normal', new THREE.Float32BufferAttribute(ln, 3));
  scene.add(new THREE.Mesh(lg, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide })));
  const wg = new THREE.BufferGeometry();
  wg.setAttribute('position', new THREE.Float32BufferAttribute(wp, 3));
  wg.setAttribute('color', new THREE.Float32BufferAttribute(wc, 3));
  wg.computeVertexNormals();
  const water = new THREE.Mesh(wg, new THREE.MeshPhongMaterial({ vertexColors: true, transparent: true, opacity: .82, shininess: 90, specular: 0x7799bb, depthWrite: false, side: THREE.DoubleSide }));
  water.renderOrder = 2;
  scene.add(water);
  // 地圖外圍是一片大海（小島的感覺）
  const ocean = new THREE.MeshPhongMaterial({ color: WATER_COL.far, shininess: 60, specular: 0x334466 });
  const MW = W * TX, MH = H * TZ, E = 600;
  for (const [x0, z0, x1, z1] of [[-E, -E, 0, MH + E], [MW, -E, MW + E, MH + E], [0, -E, MW, 0], [0, MH, MW, MH + E]]) {
    const g = new THREE.PlaneGeometry(x1 - x0, z1 - z0); g.rotateX(-Math.PI / 2);
    const m = new THREE.Mesh(g, ocean); m.position.set((x0 + x1) / 2, WATER_Y - .02, (z0 + z1) / 2); scene.add(m);
  }
}

// ---- 樹林：每格一兩棵樹（InstancedMesh，手機也跑得動）----
function buildTrees() {
  const spots = [];
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) if (tileAt(i, j) === T.FOREST) {
    const h = hash(i, j), n = 1 + h % 2;
    for (let k = 0; k < n; k++) spots.push([(i + .15 + ((h >> (4 + k * 3)) % 70) / 100) * TX, (j + .5) * TZ, .8 + ((h >> 9) % 50) / 100, (h >> 12) % 100]);
  }
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(.15, .22, 1.4, 6), new THREE.MeshLambertMaterial({ color: 0x6b4a2b }), spots.length);
  const crown = new THREE.InstancedMesh(new THREE.ConeGeometry(1.2, 3, 7), new THREE.MeshLambertMaterial({ color: 0xffffff }), spots.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), c = new THREE.Color();
  spots.forEach(([x, z, sc, hv], k) => {
    s.set(sc, sc, sc);
    m.compose(p.set(x, .7 * sc, z), q, s); trunk.setMatrixAt(k, m);
    m.compose(p.set(x, (1.4 + 1.5) * sc, z), q, s); crown.setMatrixAt(k, m);
    crown.setColorAt(k, c.setHSL(.27 + hv / 2000, .45, .25 + hv / 900));
  });
  scene.add(trunk, crown);
}

// ---- 四間店：有招牌的小房子，門口朝向小徑 ----
function signTexture(text, bg) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, 256, 64);
  x.strokeStyle = '#3b2414'; x.lineWidth = 6; x.strokeRect(3, 3, 250, 58);
  x.fillStyle = '#3b2414'; x.font = 'bold 36px "PingFang TC", "Microsoft JhengHei", sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, 128, 34);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  return t;
}
function buildShops() {
  const box = {};
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    const t = tileAt(i, j); if (!TILES[t].shop) continue;
    const b = box[t] || (box[t] = { i0: i, i1: i, j0: j, j1: j });
    b.i0 = Math.min(b.i0, i); b.i1 = Math.max(b.i1, i); b.j0 = Math.min(b.j0, j); b.j1 = Math.max(b.j1, j);
  }
  for (const t in box) {
    const b = box[t], tl = TILES[t];
    const w = (b.i1 - b.i0 + 1) * TX, d = (b.j1 - b.j0 + 1) * TZ, cx = b.i0 * TX + w / 2, cz = b.j0 * TZ + d / 2;
    const front = (b.j0 + b.j1) / 2 < SPAWN.y ? 1 : -1;   // 北邊的店門朝南、南邊的店門朝北
    const g = new THREE.Group(); g.position.set(cx, 0, cz);
    const walls = new THREE.Mesh(new THREE.BoxGeometry(w - .3, 3.2, d - .2), new THREE.MeshLambertMaterial({ color: tl.color }));
    walls.position.y = 1.6; g.add(walls);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w + .4, .35, d + .8), new THREE.MeshLambertMaterial({ color: 0x8e3b2e }));
    roof.position.y = 3.35; g.add(roof);
    const door = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 2.2), new THREE.MeshLambertMaterial({ color: 0x5b3a1e }));
    door.position.set(0, 1.1, front * (d / 2 - .09)); if (front < 0) door.rotation.y = Math.PI; g.add(door);
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(w * .7, w * .7 / 4), new THREE.MeshBasicMaterial({ map: signTexture(tl.name, '#fff8e6') }));
    sign.position.set(0, 2.65, front * (d / 2 - .07)); if (front < 0) sign.rotation.y = Math.PI; g.add(sign);
    scene.add(g);
  }
}

const fishShape = new THREE.Shape();

fishShape.lineTo(-.5, -.22); fishShape.lineTo(-.25, -.1); fishShape.quadraticCurveTo(.2, -.22, .5, 0);
const fishShadowGeo = new THREE.ShapeGeometry(fishShape); fishShadowGeo.rotateX(-Math.PI / 2);
const SHADOW_LEN = [.7, 1.3, 2.1, 3.8];   // 小／中／大／變種怪影的長度（公尺）
const shadowMat = {
  normal: new THREE.MeshBasicMaterial({ color: 0x001a33, transparent: true, opacity: .38, depthWrite: false }),
  dark: new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: .5, depthWrite: false }),
  mutant: new THREE.MeshBasicMaterial({ color: 0x6a0018, transparent: true, opacity: .65, depthWrite: false }),
};
const shadowMeshes = new Set();
let frameNo = 0;
function syncShadows() {
  frameNo++;
  const cx = P.x * TX, cz = P.y * TZ;
  for (const s of shadows) {
    if (!s.mesh) {
      s.mesh = new THREE.Mesh(fishShadowGeo, s.sz === 3 ? shadowMat.mutant : s.w === 'deep' || s.w === 'far' ? shadowMat.dark : shadowMat.normal);
      s.mesh.renderOrder = 1; scene.add(s.mesh); shadowMeshes.add(s.mesh);
    }
    const m = s.mesh, x = s.x * TX, z = s.y * TZ;
    m.userData.f = frameNo;
    m.visible = Math.hypot(x - cx, z - cz) < 90;
    if (!m.visible) continue;
    const L_ = SHADOW_LEN[s.sz];
    m.position.set(x, WATER_Y - .3, z);
    m.rotation.y = -s.a + Math.sin(gameT * 7 + s.x * 3) * .12;   // 擺尾
    m.scale.set(L_, 1, L_);
  }
  for (const m of shadowMeshes) if (m.userData.f !== frameNo) { scene.remove(m); shadowMeshes.delete(m); }
}

const boats = [new THREE.Group(), new THREE.Group()];
{

  const mk = (w, len, h, floorCol, sideCol, rim) => {
    const g = new THREE.Group(), fm = new THREE.MeshLambertMaterial({ color: floorCol }), sm = new THREE.MeshLambertMaterial({ color: sideCol });
    const add = (bw, bh, bd, x, y, z, m) => { const b = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, bd), m); b.position.set(x, y, z); g.add(b); return b; };
    add(w, .08, len, 0, -.12, 0, fm);

    add(w, h, .08, 0, -.12 + h / 2, len / 2, sm);
    const bow = add(w * .72, h, .08, 0, -.12 + h / 2, -len / 2 - .25, sm);
    for (const sx of [-1, 1]) { const p = add(.08, h, .62, sx * w * .43, -.12 + h / 2, -len / 2 - .12, sm); p.rotation.y = sx * .45; }
    if (rim) {   // 船舷上緣的紅邊

// ================= 每一幀的 3D 畫面 =================
const V1 = new THREE.Vector3(), V2 = new THREE.Vector3(), V3 = new THREE.Vector3(), skyCol = new THREE.Color();
let flash = 0;
function bobberPos(out) {
  out.set(spot.x * TX, WATER_Y + .05, spot.y * TZ);
  if (state === 'wait') out.y += Math.sin(gameT * 3) * .03;
  if (state === 'bite') out.y -= .1 + Math.abs(Math.sin(gameT * 30)) * .06;
  return out;
}
function render3D(dt) {
  const boat = onBoat();
  // 相機：走路晃動、船上隨浪起伏、搏鬥時抖動
  const walkBob = P.moving && !boat ? Math.sin(P.walkT * 9) * .05 : 0;
  const wave = boat ? Math.sin(gameT * 1.6) * .08 : 0;
  const shake = state === 'fight' && F ? .004 + F.tens * .01 + F.spike * .05 : 0;
  camera.position.set(P.x * TX, (boat ? WATER_Y + 1.35 : CFG.eye) + walkBob + wave, P.y * TZ);
  camera.rotation.set(pitch + (Math.random() - .5) * shake, yaw + (Math.random() - .5) * shake, boat ? Math.sin(gameT * 1.1) * .02 : 0, 'YXZ');
  camera.updateMatrixWorld();

  boats.forEach((b, k) => { b.visible = boat && S.boat - 1 === k; });
  if (boat) {   // 人坐在船的後半段，往前看得到船頭
    const b = boats[S.boat - 1];
    b.position.set(P.x * TX - Math.sin(yaw) * .6, WATER_Y + .3 + wave * .6, P.y * TZ - Math.cos(yaw) * .6); b.rotation.y = yaw;   // 船底浮在水面上
  }

  // 釣竿姿勢：蓄力往後拉、拋出往前甩、搏鬥時彎曲
  let tilt = -.95 + Math.sin(P.walkT * 4.5) * (P.moving ? .04 : 0), bend = .03;
  if (state === 'charge') tilt = -.95 + castPower() * .6;
  else if (state === 'cast') tilt = castT < .15 ? -1.45 : -1.15;
  else if (state === 'wait') tilt = -1.1;
  else if (state === 'bite') { tilt = -1.1; bend = .08 + Math.abs(Math.sin(gameT * 30)) * .05; }
  else if (state === 'fight') { tilt = -.65 - (F.act === 'jump' ? .25 : 0); bend = .04 + F.tens * .32 + F.spike * .4 + Math.sin(gameT * 24) * .015 * (F.act === 'shake' ? 3 : 1); }
  else if (state === 'land') tilt = -.25;
  rodRig.rotation.x += (tilt - rodRig.rotation.x) * Math.min(1, dt * 14);
  rodSegs.forEach(g => { g.rotation.x = -bend; });
  // 竿子左右壓
  const lean = state === 'fight' && F ? -F.rod * .5 : 0;
  rodRig.rotation.z += (lean - rodRig.rotation.z) * Math.min(1, dt * 10);
  rodRig.updateMatrixWorld(true);
  const tip = rodTip.getWorldPosition(V1);

  // 浮標與釣線
  const showBob = spot && (state === 'cast' || state === 'wait' || state === 'bite');   // 搏鬥時浮標被拖進水裡
  bobber.visible = !!showBob; ripple.visible = false;
  let lineEnd = null, sag = 0;
  if (showBob) {
    const target = bobberPos(V2);
    if (state === 'cast') {   // 沿弧線飛出去，越遠飛越高
      const k = clamp(castT / castDur, 0, 1);
      bobber.position.lerpVectors(tip, target, k); bobber.position.y += Math.sin(k * Math.PI) * (2 + castDur * 6);
    } else bobber.position.copy(target);
    lineEnd = bobber.position; sag = state === 'cast' ? .2 : 1.2;
    if (state === 'wait' || state === 'bite') {
      const r = ((gameT * (state === 'bite' ? 2.5 : .9)) % 1);
      ripple.visible = true; ripple.position.set(bobber.position.x, WATER_Y + .02, bobber.position.z);
      ripple.scale.setScalar(.2 + r * 1.3); ripple.material.opacity = .7 * (1 - r);
    }
  }

  // 搏鬥：線拉進水裡、水下的魚影、跳出水面或拉近時看得到整條魚
  fishSprite.visible = false; fightShadow.visible = false;
  if (state === 'fight' && F) {
    const fx = spot.x * TX, fz = spot.y * TZ;
    lineEnd = V2.set(fx, WATER_Y - .05, fz); sag = 0;
    const heading = F.act === 'run' && F.dir ? F.a0 + F.th - F.dir * Math.PI / 2 : F.act === 'charge' ? F.a0 + F.th + Math.PI : F.a0 + F.th;
    const len = [1, 1.5, 2.2, 3.6][F.sz] || 1.5;
    fightShadow.visible = true; fightShadow.position.set(fx, WATER_Y - .25, fz);
    fightShadow.rotation.y = Math.PI / 2 + heading + Math.sin(gameT * 14) * .2;   // 魚頭朝游的方向 fightShadow.scale.set(len, 1, len);
    const jumping = F.act === 'jump' && F.jump < 1;
    if (jumping || F.d < 5) {   // 跳出水面甩動，或拉近到腳邊時露出水面
      const k = jumping ? F.jump : 0, up = jumping ? Math.sin(k * Math.PI) * (1.2 + len * .4) : .05;
      fishSprite.position.set(fx, WATER_Y + up + len * .2, fz);
      fishSprite.scale.set(len, len / 2, 1);
      fishSprite.material.map = fishTex(F.f.id);
      fishSprite.material.rotation = jumping ? Math.sin(F.t * 18) * .8 + (k - .5) * 1.2 : Math.sin(gameT * 20) * .35;
      fishSprite.visible = true;
      if (jumping) lineEnd = fishSprite.position;
    }
    // 張力越大，釣線越紅
    const tt = clamp(F.tens + F.spike, 0, 1);
    fishLine.material.color.setRGB(1, 1 - Math.max(0, tt - .45) * 1.6, 1 - tt * 1.4);
  } else fishLine.material.color.setRGB(.95, .95, .95);
  // 拉上來的魚：從水面飛到眼前、甩尾，然後拿在面前
  const held = state === 'land' || (state === 'caught' && catchShow);
  if (held && L) {
    const front = V3.set(0, .05, -1.6).applyMatrix4(camera.matrixWorld);
    const k = clamp(L.t / CFG.landFly, 0, 1);
    const start = V2.set(spot.x * TX, WATER_Y, spot.y * TZ);
    fishSprite.position.lerpVectors(start, front, k); fishSprite.position.y += Math.sin(k * Math.PI) * 1.6;   // 低低的弧線，飛到眼前
    const len = L.f.special ? .8 : [.7, .9, 1.2, 1.4][L.sz] || .9;
    fishSprite.scale.set(len, len / 2, 1);
    fishSprite.material.map = fishTex(L.f.id);
    fishSprite.material.rotation = state === 'land' && k < 1 ? Math.sin(L.t * 26) * .7 : Math.sin(gameT * 5) * .08;
    fishSprite.visible = true;
    if (state === 'land' && k < 1) { lineEnd = fishSprite.position; sag = 0; }
  }
  fishLine.visible = !!lineEnd;
  if (lineEnd) {
    const a = fishLine.geometry.attributes.position;
    for (let n = 0; n < LINE_N; n++) {
      const u = n / (LINE_N - 1);
      a.setXYZ(n, tip.x + (lineEnd.x - tip.x) * u, tip.y + (lineEnd.y - tip.y) * u - Math.sin(u * Math.PI) * sag, tip.z + (lineEnd.z - tip.z) * u);
    }
    a.needsUpdate = true;
  }

  // 蓄力時的落點
  aimRing.visible = false;
  if (state === 'charge') {
    const a = aimSpot(castPower());
    if (a) { aimRing.visible = true; aimRing.position.set(a.x * TX, WATER_Y + .03, a.y * TZ); aimRing.scale.setScalar(.6 + Math.sin(gameT * 8) * .08); }
  }

  syncShadows();
  // 水花
  const pa = partGeo.attributes.position;
  for (let k = 0; k < 200; k++) {
    const p = parts[k];
    if (p) pa.setXYZ(k, p.x, p.y, p.z); else pa.setXYZ(k, 0, -999, 0);
  }
  pa.needsUpdate = true;

  // 天氣：天空顏色、霧、雨、閃電
  const sk = SKY[weather.id];
  skyCol.setHex(sk.sky);
  scene.background.lerp(skyCol, Math.min(1, dt * 2)); scene.fog.color.copy(scene.background);
  scene.fog.far += (sk.far - scene.fog.far) * Math.min(1, dt * 2);
  if (weather.severe && Math.random() < dt / 5) flash = .35;
  flash = Math.max(0, flash - dt * 1.5);
  hemi.intensity = sk.light + flash * 3; sunLight.intensity = sk.light * .75;
  rain.visible = !!weather.rain;
  if (rain.visible) {
    const n = Math.min(RAIN_N, weather.rain * 2.5), wind = weather.severe ? 5 : 1, len = weather.severe ? .9 : .6;
    for (let k = 0; k < RAIN_N; k++) {
      let x = rainDrop[k * 3], y = rainDrop[k * 3 + 1], z = rainDrop[k * 3 + 2];
      y -= 18 * dt; x += wind * dt;
      if (y < -3) { y = rand(8, 14); x = rand(-25, 25); z = rand(-25, 25); }
      rainDrop[k * 3] = x; rainDrop[k * 3 + 1] = y; rainDrop[k * 3 + 2] = z;
      const X = camera.position.x + x, Y = camera.position.y + y, Z = camera.position.z + z;
      const o = k * 6;
      if (k < n) { rainArr[o] = X; rainArr[o + 1] = Y; rainArr[o + 2] = Z; rainArr[o + 3] = X - wind * .05; rainArr[o + 4] = Y - len; rainArr[o + 5] = Z; }
      else rainArr.fill(-999, o, o + 6);
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  renderer.render(scene, camera);
}

// ================= 畫面上的資訊 =================
let lastHud = '';
function updateHud() {
  let btn = '', label = '';
  if (state === 'charge') { btn = 'charge'; label = '放開拋竿<small>力道 ' + Math.round(castPower() * 100) + '%</small>'; }
  else if (state === 'walk') {
    btn = aimSpot(1) ? '' : 'dim';
    label = '下竿<small>' + (S.bait === 'bread' ? '麵包屑' : LURE_BY[S.bait] ? LURE_BY[S.bait].name + '（誘餌）' : BAIT_BY[S.bait].name + '×' + (S.baits[S.bait] || 0)) + '</small>';
  }
  else if (state === 'cast' || state === 'wait') { btn = 'wait'; label = '收竿<small>等魚上鉤…</small>'; }
  else if (state === 'bite') { btn = 'bite'; label = '拉竿！'; }
  else if (state === 'fight') {
    btn = 'fight' + (holding ? ' hold' : ''); label = '收線<small>按住捲線</small>';
    $('fcue').textContent = F.drag ? '嘶——捲線器在出線！' : fightCue(F);
    $('fline').textContent = `出線 ${F.d.toFixed(1)} m`;
  } else { btn = 'dim'; label = '下竿'; }
  const nb = METHODS.filter(m => hasBuff(m.id)).length;
  const info = `$${fmtN(S.money)}・${weather.name}` + (nb ? `・加成 ${nb}` : '') + (onBoat() ? `・${BOATS[S.boat - 1].name}` : '');
  $('bang').classList.toggle('on', state === 'bite');
  $('danger').style.opacity = state === 'fight' && F ? clamp((F.tens + F.spike - .62) / .3, 0, 1) : 0;   // 快斷線時畫面邊緣泛紅
  const key = [btn, label, info, bag.length].join('|');
  if (key === lastHud) return;
  lastHud = key;
  act.className = btn; act.innerHTML = label;
  $('info').textContent = info;
  $('bagCount').textContent = bag.length || '';
}

// ================= 隱藏模式的報表 =================
function drawSheet() {
  const c = $('sheet'), r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  if (!r.width) return;
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const CW = 60, CH = 24, HW = 34, HH = 20;
  x.fillStyle = '#fff'; x.fillRect(0, 0, r.width, r.height);
  x.textBaseline = 'middle';
  const cols = Math.ceil((r.width - HW) / CW), rows = Math.ceil((r.height - HH) / CH);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const px = HW + i * CW, py = HH + j * CH, head = j === 0;
    if (head) { x.fillStyle = '#ddebf7'; x.fillRect(px, py, CW, CH); }
    x.fillStyle = '#222'; x.font = head ? FONT_B : FONT;
    const t = cellText(i, j);
    if (head) { x.textAlign = 'center'; x.fillText(t, px + CW / 2, py + CH / 2 + .5); }
    else if (i % HEADS.length === 0) { x.textAlign = 'left'; x.fillText(t, px + 4, py + CH / 2 + .5); }
    else { x.textAlign = 'right'; x.fillText(t, px + CW - 4, py + CH / 2 + .5); }
  }
  x.strokeStyle = '#e1e1e1'; x.lineWidth = 1; x.beginPath();
  for (let i = 0; i <= cols; i++) { x.moveTo(HW + i * CW - .5, HH); x.lineTo(HW + i * CW - .5, r.height); }
  for (let j = 0; j <= rows; j++) { x.moveTo(HW, HH + j * CH - .5); x.lineTo(r.width, HH + j * CH - .5); }
  x.stroke();
  x.fillStyle = '#f3f3f3'; x.fillRect(0, 0, r.width, HH); x.fillRect(0, 0, HW, r.height);
  x.fillStyle = '#555'; x.font = FONT; x.textAlign = 'center';
  for (let i = 0; i < cols; i++) x.fillText(colName(i), HW + i * CW + CW / 2, HH / 2 + 1);
  for (let j = 0; j < rows; j++) x.fillText(j + 1, HW / 2, HH + j * CH + CH / 2 + .5);
  // 選取框在 C2
  x.strokeStyle = '#217346'; x.lineWidth = 2; x.strokeRect(HW + 2 * CW, HH + CH, CW, CH);
  x.fillStyle = '#217346'; x.fillRect(HW + 3 * CW - 3, HH + 2 * CH - 3, 6, 6);
  $('formula').textContent = cellText(2, 1);
}

// ================= 主迴圈 =================
resize();
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (!boss) {
    if (!$('dlg').classList.contains('on')) update(dt);
    render3D(dt);
    updateHud();
    mctx.setTransform(2, 0, 0, 2, 0, 0); drawMap(mctx, CFG.miniW, MINI_H);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
