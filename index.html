<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#217346">
<title>Q3_銷售報表_final_v3.xlsx</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    font-size: 13px; color: #222; background: #fff;
    display: flex; flex-direction: column;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  /* ===== Excel 外框 ===== */
  #titlebar {
    background: #217346; color: #fff; height: 36px; flex: none;
    display: flex; align-items: center; gap: 10px; padding: 0 10px;
  }
  /* 左上角 X 圖示＝隱藏功能（老闆鍵） */
  #logo {
    width: 24px; height: 24px; background: #fff; color: #217346; border-radius: 3px; border: 0;
    font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer;
  }
  #titlebar .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ribbon {
    flex: none; background: #f3f3f3; border-bottom: 1px solid #d4d4d4;
    display: flex; gap: 2px; padding: 0 6px; height: 30px; align-items: flex-end;
    overflow: hidden; white-space: nowrap;
  }
  #ribbon span { padding: 5px 10px; color: #444; }
  #ribbon span.on { background: #fff; border: 1px solid #d4d4d4; border-bottom: 0; color: #217346; font-weight: 600; }
  #fbar { flex: none; display: flex; align-items: stretch; height: 26px; border-bottom: 1px solid #d4d4d4; }
  #namebox { width: 64px; border-right: 1px solid #d4d4d4; padding: 4px 6px; font-size: 12px; }
  #fx { width: 30px; color: #888; font-style: italic; text-align: center; padding-top: 4px; border-right: 1px solid #d4d4d4; }
  #formula { flex: 1; padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  #tabs {
    flex: none; height: 28px; background: #f3f3f3; border-top: 1px solid #d4d4d4;
    display: flex; align-items: stretch; padding-left: 8px; gap: 2px;
  }
  #tabs span { padding: 5px 12px; color: #444; }
  #tabs span.on { background: #fff; color: #217346; font-weight: 600; border-bottom: 2px solid #217346; }
  #status {
    flex: none; min-height: 24px; background: #217346; color: #fff; font-size: 12px;
    display: flex; align-items: center; gap: 16px; padding: 0 10px env(safe-area-inset-bottom);
  }
  #status .sp { flex: 1; }
  @media (max-width: 480px) { #ribbon span:nth-child(n+5) { display: none; } }

  /* ===== 遊戲區 ===== */
  #stage { flex: 1; position: relative; overflow: hidden; touch-action: none; background: #fff; }
  #cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; }

  /* 右側按鈕：下竿／拉竿 */
  #actBtn {
    position: absolute; right: 16px; bottom: 20px; width: 92px; height: 92px; border-radius: 50%;
    border: 3px solid #1a5c38; background: radial-gradient(circle at 35% 30%, #3fa36a, #217346 70%);
    color: #fff; font-size: 20px; font-weight: 700; letter-spacing: 1px; font-family: inherit;
    box-shadow: 0 4px 0 #134a2c, 0 6px 12px rgba(0,0,0,.25); cursor: pointer; touch-action: none;
    text-shadow: 0 1px 0 rgba(0,0,0,.4);
  }
  #actBtn small { display: block; font-size: 11px; font-weight: 400; opacity: .85; letter-spacing: 0; }
  #actBtn.dim { filter: grayscale(.7) brightness(.95); opacity: .75; }
  #actBtn.wait { background: radial-gradient(circle at 35% 30%, #5b9bd5, #2e75b6 70%); border-color: #1f4e78; box-shadow: 0 4px 0 #1f4e78, 0 6px 12px rgba(0,0,0,.25); }
  /* 上鉤時明暗閃爍，提醒準備拉魚 */
  #actBtn.bite {
    background: radial-gradient(circle at 35% 30%, #ffe27a, #f0a500 70%); border-color: #a86f00; color: #5a3500;
    text-shadow: none; animation: biteFlash .28s steps(2, jump-none) infinite;
  }
  @keyframes biteFlash {
    0%   { filter: brightness(1.5); box-shadow: 0 0 0 6px rgba(255,220,80,.9), 0 0 28px 10px #ffd34d; transform: scale(1.08); }
    100% { filter: brightness(.55); box-shadow: 0 4px 0 #a86f00; transform: scale(1); }
  }
  #actBtn.fight { background: radial-gradient(circle at 35% 30%, #f07a5a, #c0392b 70%); border-color: #7b1f16; box-shadow: 0 4px 0 #7b1f16, 0 6px 12px rgba(0,0,0,.25); }
  #actBtn.hold { transform: translateY(3px) scale(.96); box-shadow: 0 1px 0 #7b1f16; }

  /* 回城按鈕（在背包上方） */
  #homeBtn {
    position: absolute; right: max(38px, calc(env(safe-area-inset-right, 0px) + 22px)); bottom: 196px; width: 48px; height: 48px; border-radius: 10px;
    background: #fff; border: 2px solid #8a5a2b; box-shadow: 0 3px 0 #8a5a2b; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #homeBtn canvas { width: 30px; height: 30px; image-rendering: pixelated; }
  #actBtn.charge { background: radial-gradient(circle at 35% 30%, #f8b26a, #ed7d31 70%); border-color: #a8541a; box-shadow: 0 4px 0 #a8541a, 0 6px 12px rgba(0,0,0,.25); }
  /* 背包按鈕（在拉魚按鈕上方） */
  #bagBtn {
    position: absolute; right: 34px; bottom: 128px; width: 56px; height: 56px; border-radius: 10px;
    background: #fff8e8; border: 2px solid #8a5a2b; box-shadow: 0 3px 0 #8a5a2b; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  #bagBtn canvas { width: 36px; height: 36px; image-rendering: pixelated; }
  #bagCount {
    position: absolute; right: -6px; top: -6px; min-width: 20px; height: 20px; border-radius: 10px;
    background: #c00000; color: #fff; font-size: 11px; font-weight: 700; line-height: 20px; padding: 0 5px;
  }
  #bagCount:empty { display: none; }

  /* 搏鬥量表 */
  #fight {
    position: absolute; left: 50%; top: 30px; transform: translateX(-50%); width: min(78%, 320px);
    background: rgba(255,255,255,.94); border: 1px solid #a0a0a0; box-shadow: 2px 2px 6px rgba(0,0,0,.2);
    padding: 6px 8px; font-size: 12px; display: none;
  }
  #fight.on { display: block; }
  #fight .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  #fight .lb { width: 34px; color: #555; }
  #fight .bar { flex: 1; height: 12px; background: #eee; border: 1px solid #bbb; position: relative; overflow: hidden; }
  #fight .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; }
  #tens i { background: #70ad47; }
  #tens::after { content: ""; position: absolute; right: 15%; top: 0; bottom: 0; border-left: 2px dashed #c00000; }
  #prog i { background: #2e75b6; }
  #fight .tip { text-align: center; color: #c00000; font-weight: 600; height: 16px; }

  /* 右上角小地圖（看起來像插入的 Excel 圖表） */
  #miniBox {
    position: absolute; right: max(8px, env(safe-area-inset-right, 0px)); top: 28px; background: #fff; border: 1px solid #bfbfbf;
    box-shadow: 0 1px 3px rgba(0,0,0,.15); padding: 2px 4px 4px; cursor: pointer;
  }
  #miniBox .mt { font-size: 10px; color: #595959; text-align: center; line-height: 14px; }
  #mini { display: block; image-rendering: pixelated; }
  .bigmap { display: block; margin: 0 auto; image-rendering: pixelated; border: 1px solid #bfbfbf; }
  .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 4px 10px; margin-top: 10px; font-size: 12px; }
  .legend i { display: inline-block; width: 16px; height: 11px; border: 1px solid #aaa; vertical-align: -1px; margin-right: 5px; }
  .pos { margin-top: 8px; font-size: 12px; color: #c00000; }

  /* 說明（Excel 註解樣式）與提示訊息 */
  .note {
    position: absolute; background: #ffffe1; border: 1px solid #a0a0a0; box-shadow: 2px 2px 4px rgba(0,0,0,.2);
    padding: 6px 8px; font-size: 12px; line-height: 1.6; color: #333; pointer-events: none;
  }
  #hint { left: 44px; top: 30px; max-width: 220px; }
  #toast { left: 50%; top: 120px; transform: translateX(-50%); white-space: nowrap; opacity: 0; transition: opacity .3s; }
  #toast.on { opacity: 1; }

  /* 對話框（釣到魚／背包） */
  #dlg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  #dlg.on { display: flex; }
  .win { background: #fff; border: 1px solid #217346; box-shadow: 0 8px 30px rgba(0,0,0,.35); width: min(100%, 360px); max-height: 86vh; display: flex; flex-direction: column; }
  .wt { background: #217346; color: #fff; padding: 6px 10px; display: flex; align-items: center; font-weight: 600; }
  .wt span { flex: 1; }
  .wt button { background: none; border: 0; color: #fff; font-size: 18px; width: 30px; cursor: pointer; }
  .wb { padding: 12px; overflow-y: auto; }
  .catch { text-align: center; }
  .catch canvas { width: 224px; height: 112px; image-rendering: pixelated; background: repeating-linear-gradient(0deg, #f7fbff 0 8px, #eef5fc 8px 16px); border: 1px solid #ddd; }
  .catch .fn { font-size: 20px; font-weight: 700; margin-top: 8px; }
  .catch .meta { color: #555; margin-top: 4px; }
  .catch .new { display: inline-block; margin-top: 6px; background: #c00000; color: #fff; padding: 1px 8px; font-size: 12px; }
  .rar { display: inline-block; padding: 0 6px; color: #fff; font-size: 12px; font-weight: 600; vertical-align: middle; border-radius: 2px; }
  .okBtn { display: block; margin: 14px auto 0; background: #217346; color: #fff; border: 0; padding: 8px 22px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .bagGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .card { border: 1px solid #d4d4d4; padding: 6px 4px; text-align: center; font-size: 12px; position: relative; }
  .card canvas { width: 84px; height: 42px; image-rendering: pixelated; }
  .card .n { font-weight: 600; }
  .card .c { position: absolute; right: 4px; top: 2px; font-weight: 700; color: #217346; }
  .card .s { color: #777; }
  .empty { color: #777; text-align: center; padding: 24px 0; }

  .catch .price { margin-top: 6px; color: #217346; font-weight: 600; }
  .catch .meta + .meta { font-size: 12px; color: #777; }
  .lvrow { font-size: 11px; color: #555; text-align: center; }
  .lvrow.warn { color: #c00000; font-weight: 600; }
  /* 商店：店員對話 */
  .npc { display: flex; gap: 10px; align-items: flex-start; }
  .npc canvas { width: 48px; height: 64px; image-rendering: pixelated; flex: none; background: #f3f3f3; border: 1px solid #ddd; }
  .bubble { flex: 1; min-width: 0; background: #ffffe1; border: 1px solid #a0a0a0; padding: 6px 8px; font-size: 13px; line-height: 1.5; }
  .money { margin: 10px 0 2px; font-size: 12px; color: #555; }
  .money b { color: #217346; font-size: 14px; }
  .sect { font-weight: 600; margin: 12px 0 6px; color: #217346; border-bottom: 1px solid #d4d4d4; padding-bottom: 2px; font-size: 12px; }
  table.xl { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.xl td, table.xl th { border: 1px solid #d4d4d4; padding: 3px 5px; }
  table.xl th { background: #ddebf7; font-weight: 600; }
  table.xl td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.xl td.desc { color: #777; font-size: 11px; }
  table.xl td.nowrap { white-space: nowrap; }
  table.xl canvas { width: 42px; height: 21px; image-rendering: pixelated; vertical-align: middle; }
  .sbtn { background: #217346; color: #fff; border: 0; padding: 3px 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .sbtn + .sbtn { margin-left: 3px; }
  .own { color: #777; font-size: 11px; }
  .up { color: #c00000; font-weight: 600; }
  .down { color: #2e75b6; font-weight: 600; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btnrow .okBtn { display: inline-block; margin: 12px 0 0; padding: 7px 14px; font-size: 13px; }
  .okBtn.alt { background: #fff; color: #217346; border: 1px solid #217346; }
  .okBtn:disabled { opacity: .45; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid #bfbfbf; background: #fff; padding: 3px 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .chip.on { border-color: #217346; background: #e2efda; color: #217346; font-weight: 600; }
  .tabs2 { display: flex; gap: 2px; margin: 12px 0 8px; border-bottom: 1px solid #d4d4d4; }
  .tabs2 button { border: 1px solid transparent; background: none; padding: 4px 12px; font-family: inherit; font-size: 12px; cursor: pointer; color: #555; }
  .tabs2 button.on { border-color: #d4d4d4; border-bottom-color: #fff; background: #fff; color: #217346; font-weight: 600; margin-bottom: -1px; }
  .card.unk canvas { filter: brightness(0) opacity(.2); }

  /* 隱藏模式：只剩普通的 Excel */
  body.boss #actBtn, body.boss #bagBtn, body.boss #homeBtn, body.boss #miniBox, body.boss #fight, body.boss .note, body.boss #dlg { display: none !important; }
</style>
</head>
<body>
<div id="titlebar">
  <button id="logo" title="Excel">X</button>
  <div class="name">Q3_銷售報表_final_v3.xlsx - 已儲存</div>
</div>
<div id="ribbon">
  <span>檔案</span><span class="on">常用</span><span>插入</span><span>公式</span><span>資料</span><span>校閱</span><span>檢視</span>
</div>
<div id="fbar">
  <div id="namebox">A1</div>
  <div id="fx">fx</div>
  <div id="formula"></div>
</div>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="fight">
    <div class="row"><span class="lb">張力</span><div class="bar" id="tens"><i></i></div></div>
    <div class="row"><span class="lb">收線</span><div class="bar" id="prog"><i></i></div></div>
    <div class="lvrow" id="flv"></div>
    <div class="tip" id="ftip"></div>
  </div>
  <div id="miniBox" title="區域分布圖"><div class="mt">區域分布</div><canvas id="mini"></canvas></div>
  <button id="homeBtn" title="回城"><canvas id="homeIcon" width="12" height="12"></canvas></button>
  <button id="bagBtn" title="背包"><canvas id="bagIcon" width="12" height="12"></canvas><span id="bagCount"></span></button>
  <button id="actBtn">下竿</button>
  <div class="note" id="hint">
    拖曳畫面移動人物<br>（電腦：方向鍵／WASD）<br>
    走到水邊，<b>按住</b>「下竿」蓄力，放開拋竿<br>
    按鈕閃爍時快按，按住收線！<br>
    右邊的房子按鈕可以回城（兩間店就在旁邊）
  </div>
  <div class="note" id="toast"></div>
</div>
<div id="tabs"><span class="on" id="tab1">Q3彙總</span><span id="tab2">明細</span><span>+</span></div>
<div id="status">
  <span id="st">就緒</span><span class="sp"></span>
  <span id="cnt">計數: 0</span><span id="sum">加總: 0</span>
</div>
<div id="dlg"><div class="win"><div class="wt"><span id="dlgTitle"></span><button id="dlgX">✕</button></div><div class="wb" id="dlgBody"></div></div></div>

<script>
// ================= 參數 =================
const CFG = {
  cellW: 60, cellH: 24,  // 儲存格寬高（px），跟手機 Excel 一樣扁長
  mapW: 44, mapH: 80,    // 地圖格數
  hdW: 34, hdH: 20,      // 列號寬、欄名高
  speed: 150,            // 移動速度（px/秒）
  miniW: 64,             // 小地圖寬度（px）
  castTime: 0.45,        // 拋竿動畫秒數（力道越大飛越久）
  chargeTime: 0.8,       // 蓄力從 0 到滿的秒數（之後會往回掉，來回擺盪）
  castMin: 40, castMax: 300,   // 拋竿距離（px）：最小力道～最大力道
  waitMin: 1.8, waitMax: 5.5,   // 等魚上鉤秒數
  biteWin: 1.3,          // 上鉤後可以拉竿的秒數
  landTime: 1.3, landFly: .9,   // 釣到後的動畫秒數、魚在空中飛的秒數
  reelUp: 0.45,          // 按住時收線進度（每秒）
  tensUp: 0.55,          // 按住時張力上升（每秒，乘上魚的力氣）
  tensDown: 0.9,         // 放開時張力下降（每秒）
  slipDown: 0.06,        // 放開時魚把線拉走（每秒，乘上魚的力氣）
  joyR: 42,              // 虛擬搖桿半徑（px）
};

// ================= 地形 =================
const T = { GRASS: 0, FOREST: 1, SAND: 2, PATH: 3, POND: 4, RIVER: 5, SEA: 6, DEEP: 7, DOCK: 8, SHOP_T: 9, SHOP_M: 10 };
const TILES = [
  { name: '草地', color: '#C6E0B4', walk: true },
  { name: '樹林', color: '#70AD47' },
  { name: '沙灘', color: '#FFE699', walk: true },
  { name: '小徑', color: '#D9D9D9', walk: true },
  { name: '淡水・池塘', color: '#DDEBF7', water: 'pond' },
  { name: '淡水・河川', color: '#9BC2E6', water: 'river' },
  { name: '海水・近海', color: '#5B9BD5', water: 'sea' },
  { name: '海水・深海', color: '#1F4E78', water: 'deep' },
  { name: '碼頭', color: '#C9A26B', walk: true },
  { name: '釣具行', color: '#F8CBAD', walk: true, shop: 'tackle' },
  { name: '魚市場', color: '#D9D2E9', walk: true, shop: 'market' },
];

// ================= 魚種 =================
// rar：0 普通 1 少見 2 稀有 3 史詩 4 傳說 5 奇物；lv 是魚的力量等級；price 是魚市場的基本收購價
const RAR = [
  { name: '普通', w: 60, color: '#7f7f7f', str: 0.75, lv: 1 },
  { name: '少見', w: 26, color: '#2e75b6', str: 1.0, lv: 2 },
  { name: '稀有', w: 10, color: '#7030a0', str: 1.2, lv: 3 },
  { name: '史詩', w: 3.5, color: '#c55a11', str: 1.45, lv: 4 },
  { name: '傳說', w: 0.8, color: '#c00000', str: 1.75, lv: 5 },
  { name: '奇物', w: 0, color: '#d63384', str: 0.5, lv: 1 },
];
const FISH = [
  // 淡水・池塘
  { id: 'mosq', name: '大肚魚', water: ['pond'], rar: 0, size: [3, 6], price: 5, shape: 'slim', body: '#9aa59a', belly: '#e3e7da', fin: '#7b867b' },
  { id: 'tilapia', name: '吳郭魚', water: ['pond', 'river'], rar: 0, size: [15, 35], price: 30, shape: 'normal', body: '#6f7f60', belly: '#c9cfb0', fin: '#4f5e42', stripe: '#5d6b50' },
  { id: 'crucian', name: '鯽魚', water: ['pond'], rar: 0, size: [10, 25], price: 25, shape: 'normal', body: '#b49a5c', belly: '#e6d7a8', fin: '#8a7440' },
  { id: 'koi', name: '錦鯉', water: ['pond'], rar: 2, size: [30, 70], price: 400, shape: 'normal', body: '#f7f7f2', belly: '#ffffff', fin: '#ff8a50', patch: '#f05a1a' },
  { id: 'goldkoi', name: '黃金錦鯉', water: ['pond'], rar: 3, size: [40, 80], price: 1500, shape: 'normal', body: '#ffcf33', belly: '#fff0a0', fin: '#e8a000', spots: '#fff6c8' },
  // 淡水・河川
  { id: 'zacco', name: '溪哥', water: ['river'], rar: 0, size: [8, 18], price: 20, shape: 'slim', body: '#93b7cc', belly: '#eef4f7', fin: '#e86a5a', stripe: '#4f86ad' },
  { id: 'ayu', name: '香魚', water: ['river'], rar: 1, size: [15, 30], price: 120, shape: 'slim', body: '#a3a46a', belly: '#e8ebd0', fin: '#d8b84a' },
  { id: 'catfish', name: '鯰魚', water: ['river', 'pond'], rar: 1, size: [30, 90], price: 150, shape: 'slim', body: '#4f4b3c', belly: '#a8a48c', fin: '#3a372c', whisker: true },
  { id: 'salmon', name: '櫻花鉤吻鮭', water: ['river'], rar: 3, size: [20, 45], price: 2000, shape: 'normal', body: '#9c907a', belly: '#f0e6dc', fin: '#7c705c', stripe: '#e8889c', spots: '#3d362c' },

const HOT_PERIOD = 30 * 60 * 1000;
function mulberry32(a) {
  return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
let hotCache = { p: -1, list: [] };
function hotList() {
  const p = Math.floor(Date.now() / HOT_PERIOD);
  if (hotCache.p !== p) {
    const r = mulberry32(p * 7919 + 13), pool = FISH.filter(f => !f.junk).map(f => f.id), list = [];
    for (let k = 0; k < 4; k++) {   // 3 種漲價、1 種跌價
      const id = pool.splice(Math.floor(r() * pool.length), 1)[0];
      list.push({ id, m: k < 3 ? Math.round((1.3 + r() * .7) * 10) / 10 : .6 });
    }
    hotCache = { p, list };

  return hotCache.list;
}

function priceOf(b) {

  if (!f.special && !f.junk) m = .7 + .9 * clamp((b.size - f.size[0]) / (f.size[1] - f.size[0]), 0, 1);
  return Math.max(1, Math.round(f.price * m * hotMult(b.id)));
}

// ================= 產生地圖 =================
const W = CFG.mapW, H = CFG.mapH;
const map = new Uint8Array(W * H);
const tileAt = (i, j) => (i < 0 || j < 0 || i >= W || j >= H) ? T.FOREST : map[j * W + i];
const setT = (i, j, t) => { if (i >= 0 && j >= 0 && i < W && j < H) map[j * W + i] = t; };
const seaEdge = y => 28 + Math.round(1.5 * Math.sin(y / 8) + Math.sin(y / 3.5 + 1));
const SPAWN = { x: 10.5, y: 32.5 };

function genMap() {
  for (let j = 0; j < H; j++) {
    const e = seaEdge(j);
    for (let i = 0; i < W; i++) {
      let t = T.GRASS;
      if (i >= e + 6) t = T.DEEP; else if (i >= e) t = T.SEA; else if (i >= e - 1) t = T.SAND;
      setT(i, j, t);
    }
  }
  // 一條由西往東流進海裡的河
  for (let i = 0; i < W; i++) {
    const ry = 54 + 6 * Math.sin(i / 4) + 2 * Math.sin(i / 1.7);
    for (let j = 0; j < H; j++) {
      const t = tileAt(i, j);
      if (Math.abs(j - ry) < 2.2 && (t === T.GRASS || t === T.SAND)) setT(i, j, T.RIVER);
    }
  }
  // 池塘（格子扁長，所以橢圓直向拉長）
  for (const [cx, cy, rx, ry] of [[6, 14, 3, 6], [18, 12, 2.2, 5], [7, 70, 2.5, 5.5], [21, 72, 2, 4.5]]) {
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
      const dx = (i + .5 - cx) / rx, dy = (j + .5 - cy) / ry;
      if (dx * dx + dy * dy < 1 && tileAt(i, j) === T.GRASS) setT(i, j, T.POND);
    }
  }
  // 樹林（不長在水邊，讓水邊都走得到）
  const nearWater = (i, j) => {
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) if (TILES[tileAt(i + di, j + dj)].water) return true;
    return false;
  };
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    if (tileAt(i, j) !== T.GRASS) continue;
    const far = Math.hypot((i - SPAWN.x) * 2.5, j - SPAWN.y) > 8;
    if ((i === 0 || j === 0 || j === H - 1) || (far && vnoise(i / 3, j / 7) > 0.62 && !nearWater(i, j))) setT(i, j, T.FOREST);
  }
  // 小徑：出生點往東到海邊，接碼頭伸進深海
  const PY = 32, ePY = seaEdge(PY);
  for (let i = 2; i < ePY; i++) setT(i, PY, T.PATH);
  for (let i = ePY; i <= ePY + 9; i++) setT(i, PY, T.DOCK);
  for (let j = PY - 3; j <= PY + 3; j++) setT(ePY + 9, j, T.DOCK);
  // 往南的小徑，過河的地方是木橋
  for (let j = PY; j <= 75; j++) setT(15, j, tileAt(15, j) === T.RIVER ? T.DOCK : T.PATH);
  // 商店（2×2 格，緊鄰小徑）：出生點左邊釣具行、右邊魚市場
  for (const [i0, t] of [[7, T.SHOP_T], [12, T.SHOP_M]]) for (let j = PY - 2; j < PY; j++) for (let i = i0; i < i0 + 2; i++) setT(i, j, t);
}

// 用參數畫出每種魚的像素圖（28×14）
const FW = 28, FH = 14;
function makeFish(f) {

  const set = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < FW && y < FH) g[y][x] = c; };

  }

    return strSprite([
      '............................',
      '..........kkkkkk............',
      '..........kbbbbk............',
      '..........kbBBbk............',
      '..........kbbbbk............',
      '..........kbBBbk............',
      '..........kbbbbk............',
      '..........kbbbbbkkkk........',
      '..........kbbbbbbbbbk.......',
      '.........kbbbbbbbbbbbk......',
      '.........kbbbbbbbbbbbk......',
      '.........kkkkkkkkkkkkk......',
      '.........kgggggggggggk......',
      '..........kkkkkkkkkkk.......',
    ], { k: '#2a1a10', b: '#6b4a2a', B: '#4e341c', g: '#3a3a3a' });
  }
  const P = {
    normal: { cx: 15, rx: 8, ry: 3.6 }, slim: { cx: 15, rx: 9, ry: 2.4 }, round: { cx: 15, rx: 6, ry: 5 },
    long: { cx: 12, rx: 8, ry: 3 }, eel: { cx: 15, rx: 12.5, ry: 1.8 },
  }[f.shape];
  const { cx, rx, ry } = P, cy = 7;
  // 身體
  for (let y = 0; y < FH; y++) for (let x = 0; x < FW; x++) {
    const dx = (x + .5 - cx) / rx, dy = (y + .5 - cy) / ry;
    if (dx * dx + dy * dy > 1) continue;
    let c = (y + .5 - cy) > ry * 0.3 ? f.belly : f.body;
    if (f.stripe && c === f.body && x % 3 === 0 && x < cx + rx - 3) c = f.stripe;
    if (f.spots && (x * 7 + y * 13) % 6 === 0 && x < cx + rx - 3) c = f.spots;
    if (f.patch && vnoise(x / 2.6, y / 2.6) > 0.5) c = f.patch;
    g[y][x] = c;
  }
  // 尾巴
  const tx = Math.round(cx - rx);
  const tl = f.shape === 'eel' ? 2 : 4;
  for (let i = 0; i < tl; i++) for (let y = -(i + 1); y <= i + 1; y++) {
    if (i === tl - 1 && Math.abs(y) < i - 1) continue;   // 魚尾分叉
    set(tx - i, cy - .5 + y, f.fin);
  }
  // 背鰭、腹鰭
  const top = Math.round(cy - ry);

    for (let x = cx - 4; x <= cx + 3; x++) for (let h = 1; h <= 3 - Math.floor(Math.abs(x - cx + 1) / 2.5); h++) set(x, top - h, f.fin);
    for (let x = cx + rx; x < cx + rx + 7; x++) set(x, cy - 1, '#2b2b2b');   // 旗魚的長嘴
  } else if (f.shape === 'eel') {
    for (let x = cx - 10; x <= cx + 9; x++) set(x, top - 1, f.fin);
    for (let h = 1; h <= 4; h++) set(cx + 9 - h % 2, top - 1 - h, f.fin);   // 頭上的紅冠
  } else if (f.shape === 'round') {
    for (let a = 0; a < 12; a++) {   // 河豚的刺
      const ang = a / 12 * Math.PI * 2;
      set(cx - .5 + Math.cos(ang) * (rx + .8), cy - .5 + Math.sin(ang) * (ry + .8), f.fin);
    }

    for (let x = cx - 3; x <= cx + 1; x++) set(x, top - 1, f.fin);
    for (let x = cx - 2; x <= cx - 1; x++) set(x, top - 2, f.fin);
  }
  if (f.shape !== 'round' && f.shape !== 'eel') { set(cx - 1, cy + ry, f.fin); set(cx, cy + ry, f.fin); }
  // 眼睛
  const ex = Math.round(cx + rx - (f.shape === 'round' ? 2.5 : 3));
  set(ex, cy - 2, '#ffffff'); set(ex + 1, cy - 2, '#111111');
  if (f.whisker) { set(cx + rx, cy + 1, '#222'); set(cx + rx + 1, cy + 2, '#222'); set(cx + rx + 1, cy, '#222'); }
  // 外框
  const out = g.map(r => r.slice());
  for (let y = 0; y < FH; y++) for (let x = 0; x < FW; x++) {
    if (g[y][x]) continue;
    const n = [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => g[y + b] && g[y + b][x + a] && g[y + b][x + a] !== '#2b2b2b' && g[y + b][x + a] !== '#222');

}

function inputVec() {
  let x = 0, y = 0;
  if (keys.has('arrowleft') || keys.has('a')) x -= 1;
  if (keys.has('arrowright') || keys.has('d')) x += 1;
  if (keys.has('arrowup') || keys.has('w')) y -= 1;
  if (keys.has('arrowdown') || keys.has('s')) y += 1;
  if (joy.id !== null) {
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy);
    if (l > CFG.joyR * 0.25) { x += dx / Math.max(l, CFG.joyR); y += dy / Math.max(l, CFG.joyR); }
  }
  const l = Math.hypot(x, y);
  return l > 1 ? { x: x / l, y: y / l } : { x, y };
}

// ================= 水裡的魚影 =================
// 影子越大，上鉤的魚越大尾、越稀有
const SHADOW_N = { pond: 16, river: 26, sea: 36, deep: 40 };
const SHADOW_P = { pond: [.5, .4], river: [.45, .4], sea: [.35, .45], deep: [.2, .45] };   // 小、中的機率，其餘是大
const SHADOW_R = [[6, 2.2], [10, 3.6], [16, 5.5]];   // 小／中／大魚影的半徑（px）
const waterCells = { pond: [], river: [], sea: [], deep: [] };
for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) { const w = TILES[tileAt(i, j)].water; if (w) waterCells[w].push([i, j]); }
const shadows = [];
function spawnShadow(w) {
  const c = waterCells[w][Math.floor(Math.random() * waterCells[w].length)], p = SHADOW_P[w], r = Math.random();
  shadows.push({ x: c[0] + .5, y: c[1] + .5, w, sz: r < p[0] ? 0 : r < p[0] + p[1] ? 1 : 2, a: rand(0, 6.28), sp: rand(.4, .9), turn: rand(1, 3), target: null });
}
for (const w in SHADOW_N) for (let k = 0; k < SHADOW_N[w]; k++) spawnShadow(w);
const waterOf = (x, y) => TILES[tileAt(Math.floor(x), Math.floor(y))].water;
function updateShadows(dt) {
  const k = CFG.cellH / CFG.cellW;   // 橫向一格比較寬，換算成相同的螢幕速度
  for (const s of shadows) {
    if (s.target) {   // 被浮標吸引，游過去
      const dx = (s.target.x - s.x) / k, dy = s.target.y - s.y, l = Math.hypot(dx, dy);
      s.a = Math.atan2(dy, dx);
      if (l > .15) { const v = Math.min(l, 1.2 * dt); s.x += Math.cos(s.a) * v * k; s.y += Math.sin(s.a) * v; }
      continue;
    }
    s.turn -= dt;
    if (s.turn <= 0) { s.a += rand(-1.5, 1.5); s.turn = rand(1, 3); }
    const nx = s.x + Math.cos(s.a) * s.sp * k * dt, ny = s.y + Math.sin(s.a) * s.sp * dt;
    if (waterOf(nx, ny) === s.w) { s.x = nx; s.y = ny; } else s.a += Math.PI * rand(.6, 1.4);
  }
}
function nearestShadow(cx, cy, maxD) {
  let best = null, bd = maxD;
  const k = CFG.cellW / CFG.cellH;
  for (const s of shadows) {
    if (s.target) continue;
    const d = Math.hypot((s.x - cx) * k, s.y - cy);
    if (d < bd) { bd = d; best = s; }
  }
  return best;
}
function removeShadow(s) { const i = shadows.indexOf(s); if (i >= 0) { shadows.splice(i, 1); spawnShadow(s.w); } }

// ================= 釣魚流程 =================
// 蓄力：0→1→0 來回擺盪，放開那一刻的值就是力道
function castPower() { const t = chargeT / CFG.chargeTime; return 1 - Math.abs((t % 2) - 1); }
// 沿著面向拋出去，落點不是水面就往回找最近的水面格
function aimSpot(power, dir = P.dir) {
  const [dx, dy] = DIRS[dir];
  const R = CFG.castMin + power * (CFG.castMax - CFG.castMin);
  for (let r = R; r >= CFG.castMin * .6; r -= 6) {
    const i = Math.floor(P.x + dx * r / CFG.cellW), j = Math.floor(P.y + dy * r / CFG.cellH), t = tileAt(i, j);
    if (TILES[t].water) return { i, j, t, dir };
  }
  return null;
}
// 哪個方向拋得到水（優先面向的方向）
function findCastDir() {
  if (TILES[tileAt(Math.floor(P.x), Math.floor(P.y))].water) return null;
  for (const d of [P.dir, 'd', 'r', 'l', 'u']) if (aimSpot(1, d)) return d;
  return null;
}

// 收竿：放掉被吸引過來的魚影
function doCast() {
  const pw = castPower(), s = aimSpot(pw);
  if (!s) { state = 'walk'; toast('沒拋進水裡，力道再大一點'); return; }
  // 每次下竿用掉一個餌（麵包屑免費）
  if (S.bait !== 'bread') {
    if ((S.baits[S.bait] || 0) <= 0) { toast(`${BAIT_BY[S.bait].name}用完了，改用麵包屑`); S.bait = 'bread'; }
    else S.baits[S.bait]--;
    saveAll();
  }
  spot = s; state = 'cast'; castT = 0; castDur = CFG.castTime * (.6 + pw);
}

function stopFishing(msg) {
  if (spot && spot.shadow) { spot.shadow.target = null; spot.shadow = null; }
  state = 'walk';
  if (msg) toast(msg);
}

function press() {
  if (boss) return;
  if (state === 'walk') {
    const d = findCastDir();
    if (!d) { toast('附近沒有水，走近一點再下竿'); return; }
    P.dir = d; state = 'charge'; chargeT = 0;   // 按住蓄力，放開才拋
    hideHint();
  } else if (state === 'cast' || state === 'wait') {
    stopFishing('收竿了');
  } else if (state === 'bite') {
    startFight(); holding = true;
  } else if (state === 'fight') {
    holding = true;
  }
}

// 魚影大小對各稀有度的機率倍率：小影多小魚，大影多稀有大魚
const SZ_MULT = [[2, 1, .2, .1, .05], [1, 1, 1, 1, 1], [.3, 1, 3, 4, 5]];
const SZ_RATIO = [() => Math.pow(Math.random(), 2.5) * .6, () => Math.pow(Math.random(), 1.8), () => .4 + .6 * Math.pow(Math.random(), .8)];
function pickFish(water, sz) {
  const list = FISH.filter(f => f.water.includes(water));
  const ws = list.map(f => {
    if (f.junk || f.special) return f.w;
    if (ONLY_BAIT[f.id] && S.bait !== ONLY_BAIT[f.id]) return 0;
    return RAR[f.rar].w * (f.bait.includes(S.bait) ? 3 : .4) * SZ_MULT[sz][f.rar];
  });
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let k = 0; k < list.length; k++) { r -= ws[k]; if (r <= 0) return list[k]; }
  return list[0];
}

function startFight() {
  const sz = spot.shadow ? spot.shadow.sz : 1;
  if (spot.shadow) removeShadow(spot.shadow);
  spot.shadow = null;
  const f = pickFish(TILES[spot.t].water, sz);
  const ratio = f.special ? 0 : SZ_RATIO[sz]();
  const size = f.special ? 0 : Math.round((f.size[0] + (f.size[1] - f.size[0]) * ratio) * 10) / 10;
  const lv = fishLv(f, ratio), diff = lv - S.rod;
  splash(spot.i + .5, spot.j + .5, 10);
  // 魚比釣竿強 2 級以上，一上鉤就斷線
  if (diff >= 2) { state = 'walk'; toast(`啪！線斷了…這條魚太強（Lv${lv}），要換更好的釣竿`); return; }
  const str = (f.junk || f.special ? 0.5 : RAR[f.rar].str) * (0.85 + 0.35 * ratio);
  F = { f, size, str, lv, sz, tensMul: diff >= 1 ? 1.6 : diff < 0 ? .85 : 1, tens: 0.3, prog: 0.25, surge: 0, nextSurge: rand(1, 2.2), t: 0 };
  state = 'fight';
  $('flv').textContent = `魚力 Lv${lv}・${RODS[S.rod - 1].name} Lv${S.rod}` + (diff >= 1 ? '（竿子太弱，很吃力！）' : '');
  $('flv').className = 'lvrow' + (diff >= 1 ? ' warn' : '');
  $('fight').classList.add('on');
}

function endFight(ok, msg) {
  $('fight').classList.remove('on');
  holding = false;
  if (!ok) { state = 'walk'; F = null; toast(msg); return; }
  const item = { id: F.f.id, size: F.size, t: Date.now() };
  const isNew = !S.dex[item.id];
  bag.push(item); addDex(item); saveAll();
  // 先播拉竿、魚飛起來甩尾、落到手上的動畫，再跳出結果
  L = { f: F.f, size: F.size, sz: F.sz, isNew, where: TILES[spot.t].name, item, t: 0 };
  state = 'land';
  splash(spot.i + .5, spot.j + .5, 16);
  F = null;
}

function splash(x, y, n) {
  for (let k = 0; k < n; k++) parts.push({ x, y, vx: rand(-1.5, 1.5), vy: rand(-3, -1), life: rand(.4, .8) });
}

function openBag(tab) {
  if (boss || state === 'fight' || state === 'bite' || state === 'land') return;
  tab = tab || 'bag';
  const d = el('div');
  d.appendChild(moneyLine());
  // 選擇這次下竿要用的餌
  d.appendChild(el('div', 'sect', '使用餌料'));
  const chips = el('div', 'chips');
  for (const b of BAITS) {
    const n = b.id === 'bread' ? null : (S.baits[b.id] || 0);
    if (n === 0) continue;
    const c = el('button', 'chip' + (S.bait === b.id ? ' on' : ''), b.name + (n == null ? '' : ' ×' + n));
    c.onclick = () => { S.bait = b.id; saveAll(); openBag(tab); };
    chips.appendChild(c);
  }
  d.appendChild(chips);
  const tabs = el('div', 'tabs2');
  for (const [k, name] of [['bag', `漁獲 ${bag.length}`], ['dex', `圖鑑 ${Object.keys(S.dex).length}/${FISH.length}`]]) {
    const b = el('button', tab === k ? 'on' : '', name); b.onclick = () => openBag(k); tabs.appendChild(b);
  }
  d.appendChild(tabs);
  const body = el('div', 'bagGrid');
  if (tab === 'bag') {
    const groups = {};
    for (const b of bag) {
      const g = groups[b.id] || (groups[b.id] = { n: 0, max: 0, v: 0 });
      g.n++; g.max = Math.max(g.max, b.size); g.v += priceOf(b);
    }
    const ids = Object.keys(groups).sort((a, b) => {
      const fa = FISH_BY[a], fb = FISH_BY[b];
      return (fb.junk ? -1 : fb.rar) - (fa.junk ? -1 : fa.rar) || FISH.indexOf(fa) - FISH.indexOf(fb);
    });
    if (!ids.length) { body.className = 'empty'; body.textContent = '還沒有漁獲，去水邊試試吧！'; }
    for (const id of ids) {
      const f = FISH_BY[id], g = groups[id];
      const c = el('div', 'card');
      c.appendChild(fishCanvas(id, 3));
      c.appendChild(el('div', 'n', f.name));
      c.appendChild(rarTag(f));
      if (!f.special && !f.junk) c.appendChild(el('div', 's', `最大 ${g.max} cm`));
      c.appendChild(el('div', 's', `估價 $${fmtN(g.v)}`));
      c.appendChild(el('div', 'c', '×' + g.n));
      body.appendChild(c);
    }
  } else {
    // 圖鑑：沒釣過的顯示剪影和出沒地點
    for (const f of FISH) {
      const known = S.dex[f.id];
      const c = el('div', 'card' + (known ? '' : ' unk'));
      c.appendChild(fishCanvas(f.id, 3));
      c.appendChild(el('div', 'n', known ? f.name : '？？？'));
      if (known) {
        c.appendChild(rarTag(f));
        c.appendChild(el('div', 's', f.special || f.junk ? `撈到 ${known.n} 次` : `最大 ${known.max} cm`));
      } else c.appendChild(el('div', 's', '出沒：' + f.water.map(w => WATER_NAME[w]).join('、')));
      body.appendChild(c);
    }
  }
  d.appendChild(body);
  openDlg('背包', d);
}

function sellItems(list) {
  if (!list.length) return;

  for (const b of list) {

    const i = bag.indexOf(b); if (i >= 0) bag.splice(i, 1);
  }
  S.money += total; saveAll();
  const f = FISH_BY[best.b.id];
  let line;
  if (list.length > 1) line = `總共 ${list.length} 件，$${fmtN(total)}，點一下錢喔！`;
  else if (total >= 5000) line = `哇！${f.name}！這個好東西我收了，$${fmtN(total)}！`;
  else if (f.junk) line = `${f.name}…好啦，算你 $${total}。`;

  openShop('market', line);
}

// ================= 更新 =================
let lastTile = T.PATH;
function update(dt) {
  gameT += dt;
  const v = inputVec();
  const moving = Math.abs(v.x) + Math.abs(v.y) > 0.01;

  if (state === 'walk') {
    if (moving) {
      hideHint();
      if (Math.abs(v.x) > Math.abs(v.y)) P.dir = v.x > 0 ? 'r' : 'l'; else P.dir = v.y > 0 ? 'd' : 'u';
      const nx = P.x + v.x * CFG.speed / CFG.cellW * dt, ny = P.y + v.y * CFG.speed / CFG.cellH * dt;
      if (free(nx, P.y)) P.x = nx;
      if (free(P.x, ny)) P.y = ny;
      P.walkT += dt;
    }
    P.moving = moving;
    // 走進店面格就打開商店
    const here = tileAt(Math.floor(P.x), Math.floor(P.y));
    if (TILES[here].shop && !TILES[lastTile].shop) { keys.clear(); joy.id = null; openShop(TILES[here].shop); }
    lastTile = here;
  } else if (state === 'charge') {
    // 蓄力中可以用搖桿／方向鍵轉向瞄準
    P.moving = false; chargeT += dt;
    if (moving) P.dir = Math.abs(v.x) > Math.abs(v.y) ? (v.x > 0 ? 'r' : 'l') : (v.y > 0 ? 'd' : 'u');
  } else {
    P.moving = false;
    if ((state === 'cast' || state === 'wait') && moving) stopFishing();
  }

  if (state === 'cast') {
    castT += dt;
    if (castT >= castDur) {
      state = 'wait';
      splash(spot.i + .5, spot.j + .5, 4);
      // 附近有魚影就會游過來；沒有的話要等比較久
      const s = nearestShadow(spot.i + .5, spot.j + .5, 5);
      if (s) { s.target = { x: spot.i + .5, y: spot.j + .5 }; spot.shadow = s; waitT = rand(1, 2.5); }
      else { spot.shadow = null; waitT = rand(CFG.waitMax, CFG.waitMax * 2); }
    }
  } else if (state === 'wait') {
    waitT -= dt;
    const s = spot.shadow;
    const arrived = !s || Math.hypot((s.x - s.target.x) * CFG.cellW / CFG.cellH, s.y - s.target.y) < .3;
    if (waitT <= 0 && arrived) { state = 'bite'; biteT = CFG.biteWin; splash(spot.i + .5, spot.j + .5, 8); }
  } else if (state === 'bite') {
    biteT -= dt;
    if (biteT <= 0) {
      if (spot.shadow) removeShadow(spot.shadow);   // 魚被嚇跑了
      spot.shadow = null;
      stopFishing('魚跑掉了…上鉤時要快按！');
    }
  } else if (state === 'fight') {
    updateFight(dt);
  } else if (state === 'land') {
    L.t += dt;
    if (L.t >= CFG.landTime) {
      state = 'caught'; catchShow = L.f.id;
      showCatch(L.f, L.size, L.isNew, L.where, L.item);
    }
  }

  updateShadows(dt);
  for (let k = parts.length - 1; k >= 0; k--) {
    const p = parts[k];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 9 * dt; p.life -= dt;
    if (p.life <= 0) parts.splice(k, 1);
  }
}

function free(x, y) {
  for (const [ox, oy] of [[-.16, 0], [.16, 0], [-.16, .4], [.16, .4]]) {
    if (!TILES[tileAt(Math.floor(x + ox), Math.floor(y + oy))].walk) return false;
  }
  return true;
}

function updateFight(dt) {
  F.t += dt;
  F.nextSurge -= dt;
  if (F.nextSurge <= 0) { F.surge = rand(.5, .9); F.nextSurge = rand(1.2, 3) / F.str; }
  if (F.surge > 0) F.surge -= dt;
  const s = F.str, surging = F.surge > 0;
  if (holding) {
    F.prog += CFG.reelUp * (1 + .15 * (S.rod - 1)) / s * dt * (surging ? 0.3 : 1);   // 好竿子收線比較快
    F.tens += CFG.tensUp * s * F.tensMul * dt * (surging ? 2.2 : 1);
  } else {
    F.tens -= CFG.tensDown * dt;
    F.prog -= CFG.slipDown * s * dt * (surging ? 2.5 : 1);
  }
  F.tens = clamp(F.tens, 0, 1);
  if (Math.random() < dt * 6) splash(spot.i + .5 + rand(-.3, .3), spot.j + .5 + rand(-.3, .3), 2);
  if (F.tens >= 1) return endFight(false, '線斷了！張力太大，記得適時放開');
  if (F.prog <= 0) return endFight(false, '魚掙脫了…');
  if (F.prog >= 1) return endFight(true);
}

const ITEMS = ['筆電', '螢幕', '滑鼠', '鍵盤', '耳機', '喇叭', '印表機', '投影機', '路由器', '硬碟', '隨身碟', '網路卡', '電源', '機殼', '主機板', '顯示卡'];
const HEADS = ['品項', '1月', '2月', '3月', 'Q1', '4月', '5月', '6月', 'Q2', '上半年', '目標', '達成率', '成長率', '單價', '數量', '金額'];
const DARK_FILL = new Set([T.FOREST, T.SEA, T.DEEP]);   // 深色底配白字
const FONT = '11px -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif';
const FONT_B = '600 ' + FONT;
const fmtN = n => n.toLocaleString('en-US');
// 店面格顯示店名，其他格顯示假報表資料
function cellLabel(i, j, t = tileAt(i, j)) { return !boss && TILES[t].shop ? TILES[t].name : cellText(i, j); }
function cellText(i, j) {
  if (j === 0) return HEADS[i % HEADS.length];
  const k = i % HEADS.length;
  if (k === 0) return ITEMS[(j - 1) % ITEMS.length] + (j > ITEMS.length ? Math.ceil(j / ITEMS.length) : '');
  const h = hash(i, j);
  if (k === 11) return (60 + (h % 600) / 10).toFixed(1) + '%';
  if (k === 12) return ((h % 400) / 10 - 12).toFixed(1) + '%';
  if (k === 13) return fmtN(h % 9000 + 500);
  if (k === 14) return String(h % 300 + 5);
  if (k === 4 || k === 8) return fmtN(h % 40000 + 10000);
  if (k === 9 || k === 15) return fmtN(h % 90000 + 20000);
  return fmtN(h % 9000 + 1000);
}

let lastUI = '';
function render() {
  const CW = CFG.cellW, CH = CFG.cellH;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const gw = VW - CFG.hdW, gh = VH - CFG.hdH;
  // 隱藏模式固定顯示左上角的報表
  // 人物永遠在畫面中央；隱藏模式固定顯示左上角的報表
  const camX = boss ? 0 : P.x * CW - gw / 2;
  const camY = boss ? 0 : P.y * CH - gh / 2;
  const ox = CFG.hdW - camX, oy = CFG.hdH - camY;   // 地圖格 (0,0) 在螢幕上的位置
  const i0 = Math.floor(camX / CW), i1 = Math.floor((camX + gw) / CW);
  const j0 = Math.floor(camY / CH), j1 = Math.floor((camY + gh) / CH);

  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, VW, VH);
  ctx.save();
  ctx.beginPath(); ctx.rect(CFG.hdW, CFG.hdH, gw, gh); ctx.clip();
  ctx.textBaseline = 'middle';
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) drawCell(i, j, ox + i * CW, oy + j * CH);
  // 格線
  ctx.strokeStyle = boss ? '#e1e1e1' : 'rgba(0,0,0,.1)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = i0; i <= i1 + 1; i++) { const x = Math.round(ox + i * CW) - .5; ctx.moveTo(x, CFG.hdH); ctx.lineTo(x, VH); }
  for (let j = j0; j <= j1 + 1; j++) { const y = Math.round(oy + j * CH) - .5; ctx.moveTo(CFG.hdW, y); ctx.lineTo(VW, y); }
  ctx.stroke();

  let sel;
  if (!boss) {
    // 選取框：走路時在人物腳下，蓄力時跟著瞄準的落點
    const sp = state === 'walk' ? null : state === 'charge' ? aimSpot(castPower()) : spot;
    drawWorld(ox, oy);
    sel = sp ? [sp.i, sp.j] : [Math.floor(P.x), Math.floor(P.y)];
  } else {
    sel = [2, 1];
  }
  // Excel 選取框
  ctx.strokeStyle = '#217346'; ctx.lineWidth = 2;
  ctx.strokeRect(ox + sel[0] * CW, oy + sel[1] * CH, CW, CH);
  ctx.fillStyle = '#217346'; ctx.fillRect(ox + sel[0] * CW + CW - 3, oy + sel[1] * CH + CH - 3, 6, 6);
  ctx.restore();

  drawHeaders(ox, oy, i0, i1, j0, j1, sel);
  if (!boss && joy.id !== null) drawJoy();
  if (!boss) { mctx.setTransform(2, 0, 0, 2, 0, 0); drawMap(mctx, CFG.miniW, MINI_H, { x: camX / CW, y: camY / CH, w: gw / CW, h: gh / CH }); }
  updateUI(sel);
}

function drawCell(i, j, x, y) {
  const CW = CFG.cellW, CH = CFG.cellH, t = tileAt(i, j), head = j === 0;
  if (i < 0 || j < 0 || i >= W || j >= H) {   // 地圖外：當成樹林，不放文字
    ctx.fillStyle = boss ? '#fff' : TILES[T.FOREST].color; ctx.fillRect(x, y, CW, CH); return;
  }
  let fg = '#222';
  if (boss) ctx.fillStyle = head ? '#ddebf7' : '#fff';
  else { ctx.fillStyle = TILES[t].color; if (DARK_FILL.has(t)) fg = '#fff'; }
  ctx.fillRect(x, y, CW, CH);
  ctx.fillStyle = fg;
  ctx.font = head || (!boss && TILES[t].shop) ? FONT_B : FONT;
  const txt = cellLabel(i, j, t);
  if (head) { ctx.textAlign = 'center'; ctx.fillText(txt, x + CW / 2, y + CH / 2 + .5); }
  else if (i % HEADS.length === 0) { ctx.textAlign = 'left'; ctx.fillText(txt, x + 4, y + CH / 2 + .5); }
  else { ctx.textAlign = 'right'; ctx.fillText(txt, x + CW - 4, y + CH / 2 + .5); }
}

function drawWorld(ox, oy) {
  const CW = CFG.cellW, CH = CFG.cellH, u = 2;
  const px = ox + P.x * CW, py = oy + P.y * CH;   // 人物中心
  const feet = py + .4 * CH;
  // 浮標位置
  let bob = null;
  if (spot && (state === 'cast' || state === 'wait' || state === 'bite' || state === 'fight')) {
    let bx = ox + (spot.i + .5) * CW, by = oy + (spot.j + .5) * CH;
    if (state === 'fight') { bx += Math.sin(gameT * 3.1) * CW * .25 * (F.surge > 0 ? 1.4 : 1); by += Math.cos(gameT * 2.3) * CH * .25; }
    bob = { x: bx, y: by };
  }
  // 水裡游來游去的魚影（大小代表魚的大小）
  for (const s of shadows) {
    const sx = ox + s.x * CW, sy = oy + s.y * CH;
    if (sx < -30 || sy < -30 || sx > VW + 30 || sy > VH + 30) continue;
    const [rx, ry] = SHADOW_R[s.sz], wag = Math.sin(gameT * 8 + s.x * 3) * ry * .6;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(s.a);
    ctx.fillStyle = s.w === 'deep' ? 'rgba(0,0,0,.42)' : 'rgba(0,25,50,.3)';
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-rx * .8, 0); ctx.lineTo(-rx * 1.5, -ry + wag); ctx.lineTo(-rx * 1.5, ry + wag); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // 搏鬥中水下的魚影
  if (state === 'fight' && bob) {
    ctx.fillStyle = 'rgba(0,20,40,.35)';
    const fx = bob.x + Math.sin(gameT * 4) * 6, fy = bob.y + 5;
    ctx.beginPath(); ctx.ellipse(fx, fy, 14, 5, Math.sin(gameT * 2) * .5, 0, Math.PI * 2); ctx.fill();
  }
  // 影子
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(px, feet, 6 * u, 2 * u, 0, 0, Math.PI * 2); ctx.fill();

  // 搏鬥時往後仰、晃動
  let lean = 0, shake = 0;
  const [ddx, ddy] = DIRS[P.dir];
  if (state === 'fight') { lean = holding ? 2 * u : u; shake = Math.sin(gameT * (holding ? 40 : 18)) * u * (F.surge > 0 ? 1.2 : .6); }
  else if (state === 'land' && L.t < CFG.landFly) lean = 3 * u;   // 用力拉竿往後仰
  const bx0 = px - ddx * lean + shake, by0 = feet - ddy * lean;
  drawPlayer(bx0, by0, u);

  // 釣竿與釣線
  let tip = null;
  if (state !== 'walk' || catchShow) {
    const hand = { x: bx0 + (P.dir === 'l' ? -3 : P.dir === 'r' ? 3 : 4) * u, y: by0 - 7 * u };
    let tx, ty;
    if (bob) {
      const dx = bob.x - hand.x, dy = bob.y - hand.y, l = Math.hypot(dx, dy) || 1;
      tx = hand.x + dx / l * 15 * u; ty = hand.y + dy / l * 15 * u - 10 * u;
    } else if (state === 'land') { tx = hand.x - ddx * 4 * u + 3 * u; ty = hand.y - 22 * u; }   // 竿子甩到頭上
    else if (state === 'charge') { const pw = castPower(); tx = hand.x - ddx * (4 + 8 * pw) * u; ty = hand.y - (14 + 6 * pw) * u - ddy * 6 * pw * u; }   // 蓄力時往後拉
    else { tx = hand.x + 4 * u; ty = hand.y - 16 * u; }
    let bend = 0;
    if (state === 'fight') { bend = holding ? 1 : .5; tx += (bob.x - tx) * .18 * bend; ty += (bob.y - ty) * .3 * bend; }
    if (state === 'bite') bend = .4;
    const mx = (hand.x + tx) / 2, my = (hand.y + ty) / 2 - 4 * u * (1 - bend) + 6 * u * bend;
    ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hand.x, hand.y); ctx.quadraticCurveTo(mx, my, tx, ty); ctx.stroke();
    tip = { x: tx, y: ty };
    if (bob) {
      let bx = bob.x, by = bob.y;
      if (state === 'cast') {   // 拋出去的弧線，越遠飛越高
        const k = clamp(castT / castDur, 0, 1);
        bx = tx + (bob.x - tx) * k; by = ty + (bob.y - ty) * k - Math.sin(k * Math.PI) * CH * (1.5 + castDur * 3);
      }
      ctx.strokeStyle = 'rgba(40,40,40,.7)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(tx, ty);
      ctx.quadraticCurveTo((tx + bx) / 2, Math.max(ty, by) + (state === 'fight' ? 0 : CH * .5), bx, by); ctx.stroke();
      if (state !== 'fight') {
        let dip = 0;
        if (state === 'wait') dip = Math.sin(gameT * 3) * u * .6;
        if (state === 'bite') dip = 2 * u + Math.sin(gameT * 30) * u;
        if (state === 'bite' || state === 'wait') {   // 水面波紋
          ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1;
          const rr = ((gameT * (state === 'bite' ? 2.5 : 1)) % 1) * CH * .6 + 3;
          ctx.beginPath(); ctx.ellipse(bx, by + 2 * u, rr * 1.6, rr * .5, 0, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.fillStyle = '#fff'; ctx.fillRect(bx - 2 * u, by - u + dip, 4 * u, 2 * u);
        ctx.fillStyle = '#e03030'; ctx.fillRect(bx - 2 * u, by - 3 * u + dip, 4 * u, 2 * u);
        ctx.fillRect(bx - u * .5, by - 5 * u + dip, u, 2 * u);
      }
    }
  }

  // 蓄力：瞄準點和力道條
  if (state === 'charge') {
    const pw = castPower(), a = aimSpot(pw);
    if (a) {
      const ax = ox + (a.i + .5) * CW, ay = oy + (a.j + .5) * CH;
      ctx.strokeStyle = '#c00000'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.ellipse(ax, ay, 16, 8, 0, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(ax - 5, ay); ctx.lineTo(ax + 5, ay); ctx.moveTo(ax, ay - 4); ctx.lineTo(ax, ay + 4); ctx.stroke();
    }
    const gx = bx0 + 10 * u, gy = by0 - 34, gh2 = 30;
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillRect(gx - 1, gy - 1, 8, gh2 + 2);
    ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.strokeRect(gx - 1.5, gy - 1.5, 9, gh2 + 3);
    ctx.fillStyle = pw > .85 ? '#c00000' : pw > .5 ? '#ed7d31' : '#70ad47';
    ctx.fillRect(gx, gy + gh2 * (1 - pw), 6, gh2 * pw);
  }
  // 拉竿後魚飛到半空中甩尾，再落到手上
  if (state === 'land' && L.t < CFG.landFly && tip) {
    const k = L.t / CFG.landFly;
    const sx0 = ox + (spot.i + .5) * CW, sy0 = oy + (spot.j + .5) * CH, ex = bx0, ey = by0 - 26 * u;
    const fx = sx0 + (ex - sx0) * k, fy = sy0 + (ey - sy0) * k - Math.sin(k * Math.PI) * CH * 3.5;
    ctx.strokeStyle = 'rgba(40,40,40,.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(tip.x, tip.y); ctx.lineTo(fx, fy); ctx.stroke();
    const s = L.f.special ? 2 : [1.5, 2, 2.6][L.sz], flip = ex < sx0 ? -1 : 1;
    ctx.save(); ctx.translate(fx, fy);
    ctx.rotate(Math.sin(L.t * 26) * .6 + (k - .5) * flip * 1.2);   // 甩尾巴
    ctx.scale(flip, 1 + Math.sin(L.t * 40) * .1);
    ctx.drawImage(FISH_IMG[L.f.id], -FW * s / 2, -FH * s / 2, FW * s, FH * s);
    ctx.restore();
    if (Math.random() < .3) parts.push({ x: (fx - ox) / CW, y: (fy - oy) / CH, vx: rand(-.5, .5), vy: 0, life: .4 });   // 甩下來的水滴
  }
  // 上鉤時頭上的「！」
  if (state === 'bite') {
    const ex = bx0, ey = by0 - 22 * u - Math.abs(Math.sin(gameT * 12)) * 2 * u;
    ctx.fillStyle = '#fff'; ctx.fillRect(ex - 4 * u, ey - 6 * u, 8 * u, 9 * u);
    ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.strokeRect(ex - 4 * u, ey - 6 * u, 8 * u, 9 * u);
    ctx.fillStyle = '#e03030'; ctx.fillRect(ex - u, ey - 5 * u, 2 * u, 4 * u); ctx.fillRect(ex - u, ey, 2 * u, 2 * u);
  }
  // 搏鬥時冒汗
  if (state === 'fight' && F && F.tens > .65) {
    ctx.fillStyle = '#7fc8ff';
    const sy = (gameT * 20) % (4 * u);
    ctx.fillRect(bx0 + 6 * u, by0 - 18 * u + sy, u * 1.5, u * 2);
  }
  // 釣到後把魚舉起來
  const held = catchShow || (state === 'land' && L.t >= CFG.landFly ? L.f.id : null);
  if (held) {
    const s = 2, img = FISH_IMG[held];
    const hy = by0 - 32 * u - Math.abs(Math.sin(gameT * 5)) * 2 * u;
    ctx.drawImage(img, bx0 - FW * s / 2, hy, FW * s, FH * s);
  }
  // 水花
  ctx.fillStyle = '#fff';
  for (const p of parts) ctx.fillRect(ox + p.x * CW - u, oy + p.y * CH - u, 2 * u, 2 * u);
}

function drawPlayer(cx, feet, u) {
  const flip = P.dir === 'l';
  const rows = SPR[P.dir === 'l' ? 'r' : P.dir];
  const x0 = cx - 6 * u, y0 = feet - 16 * u;
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < 12; c++) {
    const ch = rows[r][flip ? 11 - c : c];
    if (ch === '.') continue;
    ctx.fillStyle = PAL[ch]; ctx.fillRect(x0 + c * u, y0 + r * u, u + .5, u + .5);
  }
  // 腿：走路時左右輪流抬起
  const step = P.moving ? Math.floor(P.walkT * 8) % 4 : 0;
  LEGS[P.dir].forEach((lx, k) => {
    const lift = (step === 1 && k === 0) || (step === 3 && k === 1) ? 1 : 0;
    const x = x0 + (flip ? 10 - lx : lx) * u;
    ctx.fillStyle = PAL.p; ctx.fillRect(x, y0 + 12 * u, 2 * u, (3 - lift) * u);
    ctx.fillStyle = PAL.b; ctx.fillRect(x, y0 + (15 - lift) * u, 2 * u, u);
  });
}

function drawHeaders(ox, oy, i0, i1, j0, j1, sel) {
  const CW = CFG.cellW, CH = CFG.cellH;
  ctx.fillStyle = '#f3f3f3';
  ctx.fillRect(0, 0, VW, CFG.hdH); ctx.fillRect(0, 0, CFG.hdW, VH);
  ctx.font = FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.save(); ctx.beginPath(); ctx.rect(CFG.hdW, 0, VW, CFG.hdH); ctx.clip();
  for (let i = i0; i <= i1; i++) {
    const x = ox + i * CW;
    if (i === sel[0]) { ctx.fillStyle = '#d2e8da'; ctx.fillRect(x, 0, CW, CFG.hdH); ctx.fillStyle = '#217346'; ctx.fillRect(x, CFG.hdH - 2, CW, 2); }
    ctx.fillStyle = i === sel[0] ? '#217346' : '#555';
    if (i >= 0) ctx.fillText(colName(i), x + CW / 2, CFG.hdH / 2 + 1);
    ctx.fillStyle = '#d4d4d4'; ctx.fillRect(x + CW - 1, 0, 1, CFG.hdH);
  }
  ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(0, CFG.hdH, CFG.hdW, VH); ctx.clip();
  for (let j = j0; j <= j1; j++) {
    const y = oy + j * CH;
    if (j === sel[1]) { ctx.fillStyle = '#d2e8da'; ctx.fillRect(0, y, CFG.hdW, CH); ctx.fillStyle = '#217346'; ctx.fillRect(CFG.hdW - 2, y, 2, CH); }
    ctx.fillStyle = j === sel[1] ? '#217346' : '#555';
    if (j >= 0) ctx.fillText(j + 1, CFG.hdW / 2, y + CH / 2 + .5);
    ctx.fillStyle = '#d4d4d4'; ctx.fillRect(0, y + CH - 1, CFG.hdW, 1);
  }
  ctx.restore();
  ctx.fillStyle = '#d4d4d4'; ctx.fillRect(0, CFG.hdH - 1, VW, 1); ctx.fillRect(CFG.hdW - 1, 0, 1, VH);
}

function drawJoy() {
  const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy), k = l > CFG.joyR ? CFG.joyR / l : 1;
  ctx.fillStyle = 'rgba(33,115,70,.12)'; ctx.strokeStyle = 'rgba(33,115,70,.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(joy.ox, joy.oy, CFG.joyR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(33,115,70,.45)';
  ctx.beginPath(); ctx.arc(joy.ox + dx * k, joy.oy + dy * k, 16, 0, Math.PI * 2); ctx.fill();
}

// 公式列、狀態列、按鈕狀態（公式列只顯示儲存格內容，不露出遊戲字眼）
function updateUI(sel) {
  const formula = cellLabel(sel[0], sel[1]);
  let btn = '', label = '', st = '就緒';
  if (!boss) {
    if (state === 'charge') { btn = 'charge'; label = '放開拋竿<small>力道 ' + Math.round(castPower() * 100) + '%</small>'; }
    else if (state === 'walk') { btn = findCastDir() ? '' : 'dim'; label = '下竿<small>' + (S.bait === 'bread' ? '麵包屑' : BAIT_BY[S.bait].name + '×' + (S.baits[S.bait] || 0)) + '</small>'; }
    else if (state === 'cast' || state === 'wait') { btn = 'wait'; label = '收竿<small>等魚上鉤…</small>'; st = '計算中…'; }
    else if (state === 'bite') { btn = 'bite'; label = '拉竿！'; }
    else if (state === 'fight') {
      btn = 'fight' + (holding ? ' hold' : ''); label = '拉！<small>按住收線</small>'; st = '編輯';
      $('tens').firstChild.style.width = (F.tens * 100) + '%';
      $('tens').firstChild.style.background = F.tens > .85 ? '#c00000' : F.tens > .6 ? '#ed7d31' : '#70ad47';
      $('prog').firstChild.style.width = (F.prog * 100) + '%';
      $('ftip').textContent = F.surge > 0 ? '魚在掙扎！先放開！' : F.tens > .8 ? '張力太高，放開！' : '';
    } else { btn = 'dim'; label = '下竿'; }
  }
  const key = [addr(sel[0], sel[1]), formula, btn, label, st, bag.length, S.money].join('|');
  if (key === lastUI) return;
  lastUI = key;
  $('namebox').textContent = addr(sel[0], sel[1]);
  $('formula').textContent = formula;
  act.className = btn; act.innerHTML = label;
  $('st').textContent = st;
  $('cnt').textContent = '計數: ' + bag.length;
  $('sum').textContent = '加總: ' + fmtN(S.money);   // 加總＝持有金額
  $('bagCount').textContent = bag.length || '';
}

// ================= 主迴圈 =================
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (!boss && !$('dlg').classList.contains('on')) update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
