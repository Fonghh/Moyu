<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#217346">
<title>Q3_銷售報表_final_v3.xlsx</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    font-size: 13px; color: #222; background: #fff;
    display: flex; flex-direction: column;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  /* ===== Excel 外框 ===== */
  #titlebar {
    background: #217346; color: #fff; height: 36px; flex: none;
    display: flex; align-items: center; gap: 10px; padding: 0 10px;
  }
  /* 左上角 X 圖示＝隱藏功能（老闆鍵） */
  #logo, #logo2 {
    width: 24px; height: 24px; background: #fff; color: #217346; border-radius: 3px; border: 0;
    font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer;
  }
  #titlebar .name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #ribbon {
    flex: none; background: #f3f3f3; border-bottom: 1px solid #d4d4d4;
    display: flex; gap: 2px; padding: 0 6px; height: 30px; align-items: flex-end;
    overflow: hidden; white-space: nowrap;
  }
  #ribbon span { padding: 5px 10px; color: #444; }
  #ribbon span.on { background: #fff; border: 1px solid #d4d4d4; border-bottom: 0; color: #217346; font-weight: 600; }
  #fbar { flex: none; display: flex; align-items: stretch; height: 26px; border-bottom: 1px solid #d4d4d4; }
  #namebox { width: 64px; border-right: 1px solid #d4d4d4; padding: 4px 6px; font-size: 12px; }
  #fx { width: 30px; color: #888; font-style: italic; text-align: center; padding-top: 4px; border-right: 1px solid #d4d4d4; }
  #formula { flex: 1; padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  #tabs {
    flex: none; height: 28px; background: #f3f3f3; border-top: 1px solid #d4d4d4;
    display: flex; align-items: stretch; padding-left: 8px; gap: 2px;
  }
  #tabs span { padding: 5px 12px; color: #444; }
  #tabs span.on { background: #fff; color: #217346; font-weight: 600; border-bottom: 2px solid #217346; }
  #status {
    flex: none; min-height: 24px; background: #217346; color: #fff; font-size: 12px;
    display: flex; align-items: center; gap: 16px; padding: 0 10px env(safe-area-inset-bottom);
  }
  #status .sp { flex: 1; }
  @media (max-width: 480px) { #ribbon span:nth-child(n+5) { display: none; } }

  /* ===== 遊戲區 ===== */
  #stage { flex: 1; position: relative; overflow: hidden; touch-action: none; background: #fff; }
  #cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; image-rendering: pixelated; }

  /* 右側按鈕：下竿／拉竿 */
  #actBtn {
    position: absolute; right: 16px; bottom: 20px; width: 92px; height: 92px; border-radius: 50%;
    border: 3px solid #1a5c38; background: radial-gradient(circle at 35% 30%, #3fa36a, #217346 70%);
    color: #fff; font-size: 20px; font-weight: 700; letter-spacing: 1px; font-family: inherit;
    box-shadow: 0 4px 0 #134a2c, 0 6px 12px rgba(0,0,0,.25); cursor: pointer; touch-action: none;
    text-shadow: 0 1px 0 rgba(0,0,0,.4);
  }
  #actBtn small { display: block; font-size: 11px; font-weight: 400; opacity: .85; letter-spacing: 0; }
  #actBtn.dim { filter: grayscale(.7) brightness(.95); opacity: .75; }
  #actBtn.wait { background: radial-gradient(circle at 35% 30%, #5b9bd5, #2e75b6 70%); border-color: #1f4e78; box-shadow: 0 4px 0 #1f4e78, 0 6px 12px rgba(0,0,0,.25); }
  /* 上鉤時明暗閃爍，提醒準備拉魚 */
  #actBtn.bite {
    background: radial-gradient(circle at 35% 30%, #ffe27a, #f0a500 70%); border-color: #a86f00; color: #5a3500;
    text-shadow: none; animation: biteFlash .28s steps(2, jump-none) infinite;
  }
  @keyframes biteFlash {
    0%   { filter: brightness(1.5); box-shadow: 0 0 0 6px rgba(255,220,80,.9), 0 0 28px 10px #ffd34d; transform: scale(1.08); }
    100% { filter: brightness(.55); box-shadow: 0 4px 0 #a86f00; transform: scale(1); }
  }
  #actBtn.fight { background: radial-gradient(circle at 35% 30%, #f07a5a, #c0392b 70%); border-color: #7b1f16; box-shadow: 0 4px 0 #7b1f16, 0 6px 12px rgba(0,0,0,.25); }
  #actBtn.hold { transform: translateY(3px) scale(.96); box-shadow: 0 1px 0 #7b1f16; }

  /* 回城按鈕（在背包上方） */
  #homeBtn {
    position: absolute; right: max(38px, calc(env(safe-area-inset-right, 0px) + 22px)); bottom: 196px; width: 48px; height: 48px; border-radius: 10px;
    background: #fff; border: 2px solid #8a5a2b; box-shadow: 0 3px 0 #8a5a2b; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #homeBtn canvas { width: 30px; height: 30px; }
  /* 釣具箱按鈕（在回城上方） */
  #boxBtn {
    position: absolute; right: max(38px, calc(env(safe-area-inset-right, 0px) + 22px)); bottom: 256px; width: 48px; height: 48px; border-radius: 10px;
    background: #fff; border: 2px solid #8a5a2b; box-shadow: 0 3px 0 #8a5a2b; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #boxBtn canvas { width: 30px; height: 30px; }
  #boxBtn.dot::after { content: "!"; position: absolute; right: -6px; top: -6px; width: 18px; height: 18px; border-radius: 9px; background: #2f8cff; color: #fff; font: 800 12px/18px sans-serif; text-align: center; }
  /* 釣具箱：半透明深藍面板，看得到後面的海 */
  #dlg.clear { background: rgba(0,0,0,.06); }
  #dlg.clear .win { background: rgba(16,26,52,.84); color: #eef3ff; border-color: #6f8cc8; -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  #dlg.clear .wt { background: rgba(38,58,108,.92); }
  .tb button { font-family: inherit; color: inherit; cursor: pointer; }
  .tb-slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tb-slot { position: relative; background: radial-gradient(ellipse at 50% 50%, rgba(220,232,255,.26), rgba(255,255,255,.04) 75%); border: 1px solid rgba(160,190,255,.35); border-radius: 8px; padding: 4px 2px; min-width: 0; }
  .tb-slot.on { border-color: #ffe066; box-shadow: inset 0 0 0 1px #ffe066; background: rgba(255,224,102,.1); }
  .tb-slot canvas, .tb-cell canvas { width: 100%; height: auto; aspect-ratio: 5 / 3; display: block; }
  .tb-sn { font-size: 10px; opacity: .7; }
  .tb-nm { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .tb-cell { position: relative; background: radial-gradient(ellipse at 50% 45%, rgba(220,232,255,.32), rgba(0,0,0,.25) 75%); border: 1px solid rgba(160,190,255,.28); border-radius: 6px; padding: 3px; }
  .tb-cell.sel { border-color: #ffe066; box-shadow: inset 0 0 0 1px #ffe066; }
  .tb-cell.use::before { content: "使用中"; position: absolute; left: 3px; top: 2px; font-size: 10px; background: #2f9a4a; color: #fff; padding: 0 4px; border-radius: 3px; }
  .tb-cnt { position: absolute; right: 5px; bottom: 2px; font-size: 11px; font-weight: 700; text-shadow: 0 1px 2px #000; }
  .tb-new { position: absolute; right: 3px; top: 2px; width: 16px; height: 16px; border-radius: 8px; background: #2f8cff; color: #fff; font: 800 11px/16px sans-serif; text-align: center; font-style: normal; }
  .tb-card { margin-top: 10px; border-top: 1px solid rgba(160,190,255,.35); padding-top: 8px; font-size: 12px; }
  .tb-h { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 14px; }
  .tb-h b { flex: 1; }
  .tb-using { font-size: 11px; background: #2f9a4a; color: #fff; padding: 1px 6px; border-radius: 3px; }
  .tb-eq { background: #ffe066; color: #3a2a00 !important; border: 0; border-radius: 4px; padding: 3px 12px; font-weight: 700; }
  .tb-stat { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  .tb-stat span:first-child { width: 30px; opacity: .8; }
  .tb-bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
  .tb-bar i { display: block; height: 100%; background: #7ee081; border-radius: 3px; }
  .tb-v { width: 54px; text-align: right; font-variant-numeric: tabular-nums; }
  .tb-sub { margin: 8px 0 4px; opacity: .75; font-size: 11px; border-bottom: 1px solid rgba(160,190,255,.25); padding-bottom: 2px; }
  .tb-fish { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; font-size: 10px; }
  .tb-f canvas { width: 100%; height: auto; aspect-ratio: 2 / 1; display: block; }
  .tb-story { margin-top: 8px; line-height: 1.6; opacity: .9; font-style: italic; }
  table.xl canvas.ticon { width: 40px; height: 24px; margin-right: 4px; }
  #actBtn.charge { background: radial-gradient(circle at 35% 30%, #f8b26a, #ed7d31 70%); border-color: #a8541a; box-shadow: 0 4px 0 #a8541a, 0 6px 12px rgba(0,0,0,.25); }
  /* 背包按鈕（在拉魚按鈕上方） */
  #bagBtn {
    position: absolute; right: 34px; bottom: 128px; width: 56px; height: 56px; border-radius: 10px;
    background: #fff8e8; border: 2px solid #8a5a2b; box-shadow: 0 3px 0 #8a5a2b; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  #bagBtn canvas { width: 36px; height: 36px; }
  #bagCount {
    position: absolute; right: -6px; top: -6px; min-width: 20px; height: 20px; border-radius: 10px;
    background: #c00000; color: #fff; font-size: 11px; font-weight: 700; line-height: 20px; padding: 0 5px;
  }
  #bagCount:empty { display: none; }

  /* 搏鬥量表 */
  #fight {
    position: absolute; left: 50%; top: 30px; transform: translateX(-50%); width: min(78%, 320px);
    background: rgba(255,255,255,.94); border: 1px solid #a0a0a0; box-shadow: 2px 2px 6px rgba(0,0,0,.2);
    padding: 6px 8px; font-size: 12px; display: none;
  }
  #fight.on { display: block; }
  #fight .row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  #fight .lb { width: 34px; color: #555; }
  #fight .bar { flex: 1; height: 12px; background: #eee; border: 1px solid #bbb; position: relative; overflow: hidden; }
  #fight .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; }
  #tens i { background: #70ad47; }
  #tens::after { content: ""; position: absolute; right: 15%; top: 0; bottom: 0; border-left: 2px dashed #c00000; }
  #prog i { background: #2e75b6; }
  #fight .tip { text-align: center; color: #c00000; font-weight: 600; height: 16px; }

  /* 右上角小地圖（看起來像插入的 Excel 圖表） */
  #miniBox {
    position: absolute; right: max(8px, env(safe-area-inset-right, 0px)); top: 28px; background: #fff; border: 1px solid #bfbfbf;
    box-shadow: 0 1px 3px rgba(0,0,0,.15); padding: 2px 4px 4px; cursor: pointer;
  }
  #miniBox .mt { font-size: 10px; color: #595959; text-align: center; line-height: 14px; }
  #mini { display: block; image-rendering: pixelated; }
  .bigmap { display: block; margin: 0 auto; image-rendering: pixelated; border: 1px solid #bfbfbf; }
  .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 4px 10px; margin-top: 10px; font-size: 12px; }
  .legend i { display: inline-block; width: 16px; height: 11px; border: 1px solid #aaa; vertical-align: -1px; margin-right: 5px; }
  .pos { margin-top: 8px; font-size: 12px; color: #c00000; }

  /* 說明（Excel 註解樣式）與提示訊息 */
  .note {
    position: absolute; background: #ffffe1; border: 1px solid #a0a0a0; box-shadow: 2px 2px 4px rgba(0,0,0,.2);
    padding: 6px 8px; font-size: 12px; line-height: 1.6; color: #333; pointer-events: none;
  }
  #hint { left: 44px; top: 30px; max-width: 220px; }
  #toast { left: 50%; top: 120px; transform: translateX(-50%); white-space: nowrap; opacity: 0; transition: opacity .3s; }
  #toast.on { opacity: 1; }

  /* 對話框（釣到魚／背包） */
  #dlg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  #dlg.on { display: flex; }
  .win { background: #fff; border: 1px solid #217346; box-shadow: 0 8px 30px rgba(0,0,0,.35); width: min(100%, 360px); max-height: 86vh; display: flex; flex-direction: column; }
  .wt { background: #217346; color: #fff; padding: 6px 10px; display: flex; align-items: center; font-weight: 600; }
  .wt span { flex: 1; }
  .wt button { background: none; border: 0; color: #fff; font-size: 18px; width: 30px; cursor: pointer; }
  .wb { padding: 12px; overflow-y: auto; }
  .catch { text-align: center; }
  .catch canvas { width: 224px; height: 112px; background: repeating-linear-gradient(0deg, #f7fbff 0 8px, #eef5fc 8px 16px); border: 1px solid #ddd; }
  .catch .fn { font-size: 20px; font-weight: 700; margin-top: 8px; }
  .catch .meta { color: #555; margin-top: 4px; }
  .catch .new { display: inline-block; margin-top: 6px; background: #c00000; color: #fff; padding: 1px 8px; font-size: 12px; }
  .rar { display: inline-block; padding: 0 6px; color: #fff; font-size: 12px; font-weight: 600; vertical-align: middle; border-radius: 2px; }
  .okBtn { display: block; margin: 14px auto 0; background: #217346; color: #fff; border: 0; padding: 8px 22px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .bagGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  .card { border: 1px solid #d4d4d4; padding: 6px 4px; text-align: center; font-size: 12px; position: relative; }
  .card canvas { width: 84px; height: 42px; }
  .card .n { font-weight: 600; }
  .card .c { position: absolute; right: 4px; top: 2px; font-weight: 700; color: #217346; }
  .card .s { color: #777; }
  .empty { color: #777; text-align: center; padding: 24px 0; }

  .catch .price { margin-top: 6px; color: #217346; font-weight: 600; }
  .catch .meta + .meta { font-size: 12px; color: #777; }
  .lvrow { font-size: 11px; color: #555; text-align: center; }
  .lvrow.warn { color: #c00000; font-weight: 600; }
  /* 商店：店員對話 */
  .npc { display: flex; gap: 10px; align-items: flex-start; }
  .npc canvas { width: 48px; height: 64px; flex: none; background: #f3f3f3; border: 1px solid #ddd; }
  .bubble { flex: 1; min-width: 0; background: #ffffe1; border: 1px solid #a0a0a0; padding: 6px 8px; font-size: 13px; line-height: 1.5; }
  .money { margin: 10px 0 2px; font-size: 12px; color: #555; }
  .money b { color: #217346; font-size: 14px; }
  .sect { font-weight: 600; margin: 12px 0 6px; color: #217346; border-bottom: 1px solid #d4d4d4; padding-bottom: 2px; font-size: 12px; }
  table.xl { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.xl td, table.xl th { border: 1px solid #d4d4d4; padding: 3px 5px; }
  table.xl th { background: #ddebf7; font-weight: 600; }
  table.xl td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.xl td.desc { color: #777; font-size: 11px; }
  table.xl td.nowrap { white-space: nowrap; }
  table.xl canvas { width: 42px; height: 21px; vertical-align: middle; }
  .sbtn { background: #217346; color: #fff; border: 0; padding: 3px 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .sbtn + .sbtn { margin-left: 3px; }
  .own { color: #777; font-size: 11px; }
  .up { color: #c00000; font-weight: 600; }
  .down { color: #2e75b6; font-weight: 600; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .btnrow .okBtn { display: inline-block; margin: 12px 0 0; padding: 7px 14px; font-size: 13px; }
  .okBtn.alt { background: #fff; color: #217346; border: 1px solid #217346; }
  .okBtn:disabled { opacity: .45; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid #bfbfbf; background: #fff; padding: 3px 8px; font-size: 12px; cursor: pointer; font-family: inherit; }
  .chip.on { border-color: #217346; background: #e2efda; color: #217346; font-weight: 600; }
  .tabs2 { display: flex; gap: 2px; margin: 12px 0 8px; border-bottom: 1px solid #d4d4d4; }
  .tabs2 button { border: 1px solid transparent; background: none; padding: 4px 12px; font-family: inherit; font-size: 12px; cursor: pointer; color: #555; }
  .tabs2 button.on { border-color: #d4d4d4; border-bottom-color: #fff; background: #fff; color: #217346; font-weight: 600; margin-bottom: -1px; }
  .buffs { font-size: 12px; color: #c55a11; margin-top: 4px; }
  .card .sbtn { margin-top: 4px; }
  .reels { display: flex; gap: 8px; justify-content: center; margin: 12px 0 0; }
  .reel { width: 64px; height: 64px; border: 2px solid #217346; background: #fff; font-size: 34px; font-weight: 700; color: #c00000;
    display: flex; align-items: center; justify-content: center; font-family: "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
  .sbtn:disabled { background: #bfbfbf; cursor: default; }
  .card.unk canvas { filter: brightness(0) opacity(.2); }

  /* 隱藏模式：只剩普通的 Excel */
  body.boss #actBtn, body.boss #bagBtn, body.boss #homeBtn, body.boss #boxBtn, body.boss #miniBox, body.boss #fight, body.boss .note, body.boss #dlg { display: none !important; }
  /* ===== 3D 全螢幕版面 ===== */
  html, body { overscroll-behavior: none; }
  body { display: block; background: #9fd0f5; }
  #stage { position: fixed; inset: 0; flex: none; background: #9fd0f5; }
  #cv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; image-rendering: auto; touch-action: none; }
  #hud {
    position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: max(10px, env(safe-area-inset-top, 0px));
    display: flex; align-items: center; gap: 8px; pointer-events: none;
  }
  #hud #logo { pointer-events: auto; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  #setBtn { pointer-events: auto; width: 28px; height: 28px; border-radius: 14px; border: 1px solid rgba(255,224,102,.7); background: rgba(16,26,52,.75); color: #ffe066; font-size: 15px; line-height: 1; padding: 0; cursor: pointer; }
  body.boss #setBtn { display: none; }
  #dlg .tb-eq.off { background: rgba(255,255,255,.15); color: rgba(255,255,255,.7) !important; }
  #info { background: rgba(0,0,0,.4); color: #fff; font-size: 12px; padding: 4px 10px; border-radius: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #cross { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: rgba(255,255,255,.75); box-shadow: 0 0 0 1px rgba(0,0,0,.35); pointer-events: none; }
  #bang { position: absolute; left: 50%; top: 28%; transform: translateX(-50%); font-size: 64px; font-weight: 900; color: #ffd400;
    text-shadow: 0 0 0 #000, 0 3px 0 #a00, 0 0 18px rgba(255,200,0,.9); pointer-events: none; display: none; }
  #bang.on { display: block; animation: bangPop .3s steps(2, jump-none) infinite; }
  @keyframes bangPop { 0% { transform: translateX(-50%) scale(1.15); } 100% { transform: translateX(-50%) scale(.9); } }
  #joyBase { position: absolute; width: 96px; height: 96px; border-radius: 50%; border: 2px solid rgba(255,255,255,.6);
    background: rgba(255,255,255,.12); display: none; pointer-events: none; }
  #joyKnob { position: absolute; left: 30px; top: 30px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.55); }
  #miniBox { top: max(10px, env(safe-area-inset-top, 0px)); }
  #fight { top: max(56px, calc(env(safe-area-inset-top, 0px) + 46px)); }
  #hint { left: max(10px, env(safe-area-inset-left, 0px)); top: max(52px, calc(env(safe-area-inset-top, 0px) + 42px)); }
  #toast { top: 40%; white-space: normal; max-width: 86%; text-align: center; }
  /* 搏鬥：只有提示文字和捲線器的出線米數，張力看竿子、釣線顏色和畫面邊緣 */
  #fight { background: rgba(0,0,0,.45); border: 0; box-shadow: none; color: #fff; text-align: center; padding: 6px 12px; border-radius: 10px; width: min(88%, 360px); }
  #fight .cue { font-size: 17px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  /* 大魚的誇張特效：畫面中間跳出大字、一閃白光 */
  #bigcue { position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; font-size: 34px; font-weight: 900; color: #fff;
    -webkit-text-stroke: 2px #2a2335; text-shadow: 0 4px 0 #2a2335, 0 0 18px rgba(255,200,60,.9); opacity: 0; letter-spacing: 2px; }
  #bigcue.on { animation: cuePop 1.3s ease-out forwards; }

function genMap() {
  if (REAL) {   // 真實地圖：格子是事先算好的（一串「地形字母＋連續幾格」）
    let k = 0;
    for (const [, ch, n] of REAL.tiles.matchAll(/([A-Z])(\d*)/g)) { const t = ch.charCodeAt(0) - 65, c = n ? +n : 1; map.fill(t, k, k + c); k += c; }

    const e = seaEdge(j);

      let t = T.GRASS;

      setT(i, j, t);

  for (let i = 0; i < W; i++) {
    const ry = 54 + 6 * Math.sin(i / 4) + 2 * Math.sin(i / 1.7);
    for (let j = 0; j < H; j++) {
      const t = tileAt(i, j);
      if (Math.abs(j - ry) < 2.2 && (t === T.GRASS || t === T.SAND)) setT(i, j, T.RIVER);
    }
  }
  // 池塘（格子扁長，所以橢圓直向拉長）
  for (const [cx, cy, rx, ry] of [[6, 14, 3, 6], [18, 12, 2.2, 5], [7, 70, 2.5, 5.5], [21, 72, 2, 4.5]]) {
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {

    if ((i === 0 || j === 0 || j === H - 1) || (far && vnoise(i / 3, j / 7) > 0.62 && !nearWater(i, j))) setT(i, j, T.FOREST);

  for (let i = 2; i < ePY; i++) setT(i, PY, T.PATH);
  for (let i = ePY; i <= ePY + 9; i++) setT(i, PY, T.DOCK);
  for (let j = PY - 3; j <= PY + 3; j++) setT(ePY + 9, j, T.DOCK);

  for (let j = PY; j <= 75; j++) setT(15, j, tileAt(15, j) === T.RIVER ? T.DOCK : T.PATH);
  // 商店（2×2 格，隔著三格寬的商店街）：海邊的小鎮，北邊釣具行、魚市場，南邊餐廳、遊藝場
  const sx = Math.floor(SPAWN.x);   // 小鎮中間那一欄，兩旁各兩間店
  for (let i = sx - 3; i <= sx + 3; i++) for (const j of [PY - 1, PY + 1]) setT(i, j, T.PATH);   // 商店街三格寬，不會一離開一家店就撞進對面那家
  for (const [i0, j0, t] of [[sx - 2, PY - 3, T.SHOP_T], [sx + 1, PY - 3, T.SHOP_M], [sx - 2, PY + 2, T.SHOP_R], [sx + 1, PY + 2, T.SHOP_G]])

function bldAt(x, z, pad = 0) {
  const l = BGRID.get(Math.floor(x / BG) + ',' + Math.floor(z / BG));

  for (const k of l) {
    const b = BLD[k];

document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'escape') { setBoss(!boss); e.preventDefault(); return; }
  if (boss) return;
  if ($('dlg').classList.contains('on')) {
    if (k === 'enter' || k === ' ') { closeDlg(); e.preventDefault(); }
    return;
  }
  if (k === ' ' || k === 'j' || k === 'enter') { if (!e.repeat) press(); e.preventDefault(); return; }
  if (k === 'i' || k === 'e') { openBag(); return; }
  if (k === 'm') { openMap(); return; }

  keys.delete(k);

});

    else if (q.k === 'size' && f.id === q.id && size >= q.cm) q.p++;

    else if (q.k === 'kinds' && !q.ids.includes(f.id)) { q.ids.push(f.id); q.p = q.ids.length; }
    if (q.p >= q.n) {
      q.done = true; S.money += q.reward;

    // 誘餌只有掠食魚會咬；鐵板特別吸引旗魚
    if (lure) return f.pred && lure.waters.includes(water) ? base * 3 * (lure.id === 'jig' && f.id === 'marlin' ? 2 : 1) : 0;
    return base * (f.bait.includes(S.bait) ? 3 : .4);
  });
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let k = 0; k < list.length; k++) { r -= ws[k]; if (r <= 0) return list[k]; }
  return list[0];
}

function startFight() {
  const fish = spot.shadow, sz = fish ? fish.sz : 1;
  if (fish) removeShadow(fish);
  spot.shadow = null; nibbleK = 0;
  const water = TILES[spot.t].water;
  // 游過來咬餌的那條魚；沒有魚游過來的話（等太久）是隨機的東西，可能是雜物、奇物
  const f = fish ? fish.f : pickFish(water, 0);   // 等太久沒魚來：多半是雜物、小魚
  const ratio = f.special ? 0 : fish && !f.mutant ? fish.ratio : f.mutant ? rand(.3, 1) : SZ_RATIO[Math.min(sz, 2)]();
  const size = f.special ? 0 : Math.round((f.size[0] + (f.size[1] - f.size[0]) * ratio) * 10) / 10;
  const lv = fishLv(f, ratio), diff = lv - S.rod;
  splash(spot.x, spot.y, 10);
  // 魚比釣竿強 3 級以上，一上鉤就斷線
  if (diff >= 3) { state = 'walk'; toast(`啪！線斷了…這條魚太強（Lv${lv}），要換更好的釣竿` + loseLure()); return; }
  const str = (f.junk || f.special ? 0.5 : RAR[f.rar].str) * (0.85 + 0.35 * ratio) * (weather.severe ? 1.1 : 1);
  // 魚的位置用「玩家為中心的角度＋距離」記，玩家搏鬥時不會移動
  const px = P.x * TX, pz = P.y * TZ, dx = spot.x * TX - px, dz = spot.y * TZ - pz;
  F = newFight(f, size, str, lv, sz, diff >= 2 ? 1.6 : diff >= 1 ? 1.35 : diff < 0 ? .85 : 1, Math.max(3, Math.hypot(dx, dz)));
  F.px = px; F.pz = pz; F.a0 = Math.atan2(-dx, -dz);
  if (!S.tipFight) { S.tipFight = 1; saveAll(); toast('魚往哪衝，竿子就往反方向壓；魚累了再收線'); }
  state = 'fight';
  $('flv').textContent = `魚力 Lv${lv}・${RODS[S.rod - 1].name} Lv${S.rod}` + (diff >= 2 ? '（竿子太弱，很難拉！）' : diff >= 1 ? '（竿子太弱！）' : '');
  $('flv').className = diff >= 1 ? 'warn' : '';
  $('fLineName').textContent = LINES[S.line - 1].name + ' 耐久';
  // 魚的剪影（不先透露是什麼魚）
  const ic = $('fIcon').getContext('2d');
  ic.clearRect(0, 0, 112, 56); ic.globalCompositeOperation = 'source-over'; ic.drawImage(FISH_IMG[f.id], 0, 0, 112, 56);
  ic.globalCompositeOperation = 'source-in'; ic.fillStyle = '#ffe066'; ic.fillRect(0, 0, 112, 56); ic.globalCompositeOperation = 'source-over';
  $('fight').classList.add('on');
}

// 線斷掉時 30% 機率弄丟誘餌
function loseLure() {
  const lure = LURE_BY[S.bait];
  if (!lure || Math.random() > .3) return '';
  delete S.lures[lure.id]; S.bait = 'bread'; saveAll();
  return `（${lure.name}也被扯走了…）`;
}

function endFight(ok, msg) {
  $('fight').classList.remove('on');
  holding = false;
  if (!ok) { state = 'walk'; F = null; toast(msg); if (msg && msg.startsWith('啪')) SFX.snap(); return; }
  SFX.catch();
  const item = { id: F.f.id, size: F.size, t: Date.now() };
  const isNew = !S.dex[item.id];
  bag.push(item); addDex(item); logCatch(F.f); dailyCheck(F.f, F.size, spot.rig || 'float'); saveAll();
  // 先播拉竿、魚飛起來甩尾、落到手上的動畫，再跳出結果
  // 拉上來之後魚怎麼掙扎：在手上亂甩、摔在地上彈跳、差點從手上跳走（隨機）
  const mode = flatItem(F.f) ? 'wobble' : F.lv >= 4 ? pick(['thrash', 'escape', 'flop']) : pick(['thrash', 'flop', 'escape']);
  const hold = { wobble: .5, thrash: 1.6, flop: 2.4, escape: 2.1 }[mode];
  L = { f: F.f, size: F.size, sz: F.sz, lv: F.lv, isNew, where: TILES[spot.t].name, item, t: 0, mode, dur: CFG.landFly + hold, hop: -1,
    f1: rand(.75, 1.35), f2: rand(.75, 1.35), sd: Math.random() < .5 ? -1 : 1 };   // 掙扎的快慢、方向每次隨機
  state = 'land';
  splash(spot.x, spot.y, 16);
  F = null;
}

function sellItems(list) {
  if (!list.length) return;
  let total = 0, best = null;
  for (const b of list) {
    const p = priceOf(b); total += p;
    if (!best || p > best.p) best = { b, p };
    const i = bag.indexOf(b); if (i >= 0) bag.splice(i, 1);
  }
  S.money += total; saveAll(); SFX.coin();
  const f = FISH_BY[best.b.id];
  let line;
  if (list.length > 1) line = `總共 ${list.length} 件，$${fmtN(total)}，點一下錢喔！`;
  else if (total >= 5000) line = `哇！${f.name}！這個好東西我收了，$${fmtN(total)}！`;
  else if (f.junk) line = `${f.name}…好啦，算你 $${total}。`;

}

// ================= 搏鬥（擬真手感） =================
// 魚有自己的動作：往左右衝、往外衝、游過來、甩頭、跳水、休息。
// 玩家用竿子左右壓（側壓）跟收線應對；張力太大捲線器會洩線，太鬆魚會脫鉤；甩頭跳水時硬收會磨損釣線，耐久歸零就斷。
const JUMPERS = new Set(['zacco', 'ayu', 'salmon', 'scad', 'mahi', 'marlin', 'tuna', 'piranha', 'koi', 'goldkoi', 'glowkoi', 'tilapia', 'porgy', 'crucian']);
const FIGHT = {
  reelSpeed: 3.2,   // 收線速度（公尺/秒）
  drag: .74,        // 張力超過這個值，捲線器開始出線
  lineBase: 55,     // 線長（公尺），好竿子多 10 公尺
  slackLose: 2.2,   // 鬆線超過幾秒魚就脫鉤
  landD: 2.2,       // 拉到幾公尺內算拉到腳邊
  stamRate: 1.25,   // 體力消耗倍率（越大越快拉上來）
  react: .55,       // 甩頭、跳水開始後這幾秒內收線不會有瞬間張力（給玩家反應時間）
  wearRate: 1800,   // 釣線磨損速度（每秒，乘上瞬間張力和超出洩線的張力）
};
function newFight(f, size, str, lv, sz, tensMul, d) {
  return { f, size, str, lv, sz, tensMul, d, th: 0, stam: 1, tens: .35, spike: 0, slack: 0, rod: 0, turn: 0,
    act: 'run', dir: 0, actT: rand(1, 1.8), t: 0, vlat: 0, jump: 0, drag: false, jumper: JUMPERS.has(f.id) };
}
// 換下一個動作：越有體力越愛衝，越累越常休息
function nextAct(F) {
  const s = F.stam, w = {
    run: .25 + 1.6 * s, charge: .35 + .3 * s, shake: .25 + .4 * s,
    jump: F.jumper && s > .2 ? .6 + .6 * s : 0, rest: .25 + 1.4 * (1 - s),
  };
  let r = Math.random() * Object.values(w).reduce((a, b) => a + b, 0);
  for (const k in w) { r -= w[k]; if (r <= 0) { F.act = k; break; } }
  F.turn = 0; F.turned = false; F.age = 0;
  if (F.act === 'run') { F.dir = Math.random() < .3 ? 0 : (Math.random() < .5 ? -1 : 1); F.actT = rand(2.5, 4.5); }
  else if (F.act === 'charge') F.actT = rand(.9, 1.7);
  else if (F.act === 'shake') F.actT = rand(.6, 1);
  else if (F.act === 'jump') { F.actT = 1.1; F.jump = 0; F.jOut = F.jIn = F.jSlow = false; }

// 推進一步。inp = { rod: -1～1 竿子左右, reel: 是否收線 }；env = { rodLv, reelBuff, soupBuff, lineHp 釣線耐久, reelSp 捲線器倍率, wearMul 磨損倍率, inWater(th, d) }
// 回傳 null（繼續）或 { ok, msg }
function stepFight(F, inp, dt, env) {
  F.t += dt;
  if (F.hp == null) F.hp = F.hpMax = env.lineHp || 1000;
  F.rod += (inp.rod - F.rod) * Math.min(1, dt * 6);
  F.actT -= dt; F.age = (F.age || 0) + dt;
  if (F.actT <= 0) nextAct(F);
  const power = F.str * (.35 + .65 * F.stam);
  let pull = .25 * power, dd = 0, dth = 0, side = 0;
  const reel = inp.reel ? 1 : 0;
  // 橫向速度有慣性：魚慢慢加速、慢慢轉向，看得到線在水面上劃過去（vlat > 0 從玩家看是往右）
  const vTarget = F.act === 'run' && F.dir ? F.dir * (1.1 + 1.1 * power) : 0;
  F.vlat += (vTarget - F.vlat) * Math.min(1, dt * .9);

  if (F.act === 'run') {
    pull = power;
    if (F.dir === 0) dd += (1.6 + 1.8 * power) * dt;
    else {
      dd += .4 * dt;
      // 側壓：竿子往魚跑的反方向壓，魚會被扭回來、體力掉得快；順著魚，張力小但魚一直跑
      const k = -F.rod * Math.sign(F.vlat) * Math.min(1, Math.abs(F.vlat) / 1.2);
      if (k > .3) { side = k; F.turn += k * dt / (.6 + .4 * F.str); if (F.turn > 1) { F.act = 'rest'; F.actT = rand(.8, 1.4); F.turned = true; } }
      else if (k < -.3) pull *= .55;

  const reelSp = FIGHT.reelSpeed * (1 + .15 * (env.rodLv - 1)) * (1 + .3 * env.reelBuff) * (env.reelSp || 1);

  let target = pull * .55 + reel * ({ run: .45, charge: .2, rest: .15, shake: .5, jump: .55 })[F.act] + side * .18;

  F.drag = F.tens > FIGHT.drag;
  F.over = Math.max(0, F.tens - FIGHT.drag);
  if (F.drag) { dd += (F.tens - FIGHT.drag) * 18 * dt; F.tens = FIGHT.drag + (F.tens - FIGHT.drag) * .3; }
  // 甩頭、跳水時還在硬收：瞬間張力暴增
  if ((F.act === 'shake' || F.act === 'jump') && reel && F.age > FIGHT.react && Math.random() < dt * 1.3 * F.tensMul) F.spike = Math.max(F.spike, .28 + Math.random() * .17);
  F.spike = Math.max(0, F.spike - dt * 1.2);
  // 體力：有張力才會累，側壓累得更快；越強的魚體力越多
  F.stam = Math.max(0, F.stam - dt * FIGHT.stamRate * (.01 + F.tens * .085 + side * .05) / Math.pow(F.str, 1.6));
  // 位置（魚只能在水裡，撞到岸就掉頭）
  const nth = clamp(F.th + dth, -1.3, 1.3), nd = Math.max(.8, F.d + dd);
  if (env.inWater(nth, nd)) { F.th = nth; F.d = nd; }
  else {
    // 撞到岸邊或碼頭：還能往人這邊靠就靠，不然魚累了就直接在岸邊拉上來，還有力氣就掉頭
    if (env.inWater(F.th, nd)) F.d = nd;
    else if (dd < 0 && F.stam < .35) return { ok: true };
    F.vlat *= -.3; if (F.act === 'run') F.dir = F.dir === 0 ? (Math.random() < .5 ? -1 : 1) : -F.dir;
  }
  // 結果
  // 釣線耐久：張力太大（甩頭跳水硬收、竿子太弱）就會磨損，歸零才斷
  F.hp -= (F.spike + F.over * .3) * FIGHT.wearRate * (env.wearMul || 1) * dt;
  if (F.hp <= 0) { F.hp = 0; return { ok: false, msg: '啪！線斷了…甩頭、跳水的時候別硬收' }; }
  if (F.d > FIGHT.lineBase + 10 * (env.rodLv - 1)) return { ok: false, msg: '線被拉光了…魚往外衝時要側壓、別讓牠一直跑' };
  F.slack = F.tens < .08 ? F.slack + dt : Math.max(0, F.slack - dt * 2);
  if (F.slack > FIGHT.slackLose) return { ok: false, msg: '線鬆掉了，魚脫鉤…魚游過來時要快收線' };
  if (F.d < FIGHT.landD) {
    if (F.stam < .35) return { ok: true };
    F.act = 'run'; F.dir = 0; F.actT = rand(1.2, 2); F.d = FIGHT.landD + .3;   // 還有力氣，最後再衝一次
  }
  return null;
}
// 給畫面用的提示文字
function fightCue(F) {

let lastTile = T.PATH, lastBlockT = -9, shopTouch = false;

let weatherP = Math.floor(Date.now() / WEATHER_PERIOD), weather = weatherAt(weatherP);

const mv = { f: 0, s: 0 };   // 平滑過的移動輸入
function update(dt) {
  gameT += dt;
  if (state !== 'fight') {
    if (keys.has('arrowleft')) yaw += 1.8 * dt;
    if (keys.has('arrowright')) yaw -= 1.8 * dt;
  }
  const vi = moveInput();
  const moving = Math.abs(vi.f) + Math.abs(vi.s) > 0.01;
  // 起步、停下有一點加速度，走起來比較滑順
  const ka = Math.min(1, dt * (moving ? 9 : 14)), walk = state === 'walk';
  mv.f += ((walk ? vi.f : 0) - mv.f) * ka; mv.s += ((walk ? vi.s : 0) - mv.s) * ka;
  const v = mv;

  if (state === 'walk') {
    if (moving || Math.abs(mv.f) + Math.abs(mv.s) > .03) {
      hideHint();
      // 在船上用船速，暴風雨時船開比較慢（公尺／秒）
      const sp = (onBoat() ? BOATS[S.boat - 1].speed * (weather.severe ? .7 : 1) : CFG.speed) * dt;
      const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
      const wx = (fx * v.f + rx * v.s) * sp, wz = (fz * v.f + rz * v.s) * sp;
      const nx = P.x + wx / TX, ny = P.y + wz / TZ;
      if (free(nx, P.y)) P.x = nx;
      if (free(P.x, ny)) P.y = ny;
      // 看前方一點：撞到店門就進店；船開不進去的水域給提示
      const l = Math.hypot(wx, wz) || 1;
      const ax = P.x + wx / l * .8 / TX, ay = P.y + wz / l * .8 / TZ, ahead = tileAt(Math.floor(ax), Math.floor(ay));
      const bi = REAL ? bldAt(ax * TX, ay * TZ, .7) : -1, shopHere = TILES[ahead].shop || (bi >= 0 && BLD[bi].shop);
      if (shopHere) {
        if (!shopTouch) { shopTouch = true; keys.clear(); joyRelease(); openShop(shopHere); }
      } else shopTouch = false;
      if (TILES[ahead].water && !canEnter(ahead) && gameT - lastBlockT > 2.5) {
        lastBlockT = gameT;
        toast(`${BOATS[S.boat - 1].name}開不進${WATER_NAME[TILES[ahead].water]}，要漁船才行`);
      }
      P.walkT += dt;
    } else shopTouch = false;
    P.moving = moving;
  } else if (state === 'charge') {
    P.moving = false; chargeT += dt;   // 蓄力中可以轉頭瞄準
    if (S.opt.motion && (motionT += dt) > 6) { state = 'walk'; toast('沒有偵測到揮動，再試一次'); }
  } else {
    P.moving = false;
    if ((state === 'cast' || state === 'wait') && moving) stopFishing();
  }

  if (state === 'cast') {
    castT += dt;
    if (castT >= castDur) {
      state = 'wait';
      splash(spot.x, spot.y, 6); SFX.plop();
      // 附近有魚就會游過來試探；沒有的話要等比較久（可能鉤到雜物）
      spot.shadow = null; nextBiteT = rand(.5, 1.5);
      if (spot.rig !== 'float' && !(S.tipRig || {})[spot.rig]) { S.tipRig = Object.assign(S.tipRig || {}, { [spot.rig]: 1 }); saveAll(); toast(spot.rig === 'bottom' ? '沉底：看竿尖！輕輕抖是在試探，猛彎下去就拉竿' : '路亞：按住收線、放開停一下，「收一收、停一停」最會咬'); }
      waitT = rand(CFG.waitMax * 1.5, CFG.waitMax * 2.5);
      // 下雨魚比較快上鉤；誘餌、炸魚也會縮短等待
      waitT *= (weather.wait || 1) * (1 - (LURE_BY[S.bait] ? LURE_BY[S.bait].cut : 0)) * (1 - .35 * hasBuff('fry'));
    }
  } else if (state === 'wait') {
    waitT -= dt;
    spot.sink = Math.min(1, (spot.sink || 0) + dt / (spot.rig === 'bottom' ? 1.8 : 1));
    if (spot.rig === 'lure') {
      const mv = holding && spot.sink > .3;
      if (mv) {   // 誘餌往人這邊游回來
        const dx = P.x * TX - spot.x * TX, dz = P.y * TZ - spot.y * TZ, d = Math.hypot(dx, dz), sp = CFG.lureSp * REELS[S.reel - 1].sp * dt;
        if (d < 3) { stopFishing(spot.shadow ? '魚跟到腳邊又走了…試試收一收、停一停' : '誘餌收回來了'); return; }
        const nx = spot.x + dx / d * sp / TX, ny = spot.y + dz / d * sp / TZ;
        if (!TILES[tileAt(Math.floor(nx), Math.floor(ny))].water) { stopFishing('誘餌收回來了'); return; }
        spot.x = nx; spot.y = ny; spot.i = Math.floor(nx); spot.j = Math.floor(ny); spot.t = tileAt(spot.i, spot.j);
        lureR.moveT += dt; lureR.stopT = 0; lureR.lastMove = gameT;
      } else { if (lureR.stopT === 0 && lureR.moveT < .5) lureR.moveT = 0; lureR.stopT += dt; if (lureR.stopT > 1.2) lureR.moveT = 0; }
      if (spot.shadow) spot.shadow.target = { x: spot.x, y: spot.y };
      waitT = 99;   // 路亞不會鉤到雜物
    }
    if (!spot.shadow && (spot.rig !== 'lure' || gameT - lureR.lastMove < 2)) {   // 路亞要動過，魚才會注意到
      nextBiteT -= dt * (weather.wait ? 1 / weather.wait : 1) * (1 + (LURE_BY[S.bait] ? LURE_BY[S.bait].cut : 0)) * (1 + .35 * hasBuff('fry'));
      if (nextBiteT <= 0) { const s = findBiter(spot.x, spot.y, 14); if (s) hookFish(s); else nextBiteT = rand(1, 2.5); }
      if (waitT <= 0) { state = 'bite'; biteT = CFG.biteWin; if (spot.rig !== 'bottom') splash(spot.x, spot.y, 10); }   // 沒有魚來：鉤到奇怪的東西
    }
  } else if (state === 'bite') {
    biteT -= dt;
    if (biteT <= 0) {
      stopFishing(spot.rig === 'lure' ? '魚咬了誘餌又吐掉了…一咬就要拉！' : spot.rig === 'bottom' ? '魚把餌吃掉跑了…竿尖猛彎就要快拉！' : '魚把餌吃掉跑了…浮標沉下去就要快拉！');
    }
  } else if (state === 'fight') {
    updateFight(dt);
  } else if (state === 'land') {
    L.t += dt;
    if (L.t >= L.dur) {
      state = 'caught'; catchShow = L.f.id;
      showCatch(L.f, L.size, L.isNew, L.where, L.item);
    }
  }

  updateShadows(dt);
  checkWeather();
  updateParts(dt);
}

// 能不能站在這一格：陸地，或是船開得進去的水域（店面是房子，不能走進去）
function canEnter(t) { return TILES[t].walk || (TILES[t].water && S.boat > 0 && BOATS[S.boat - 1].waters.includes(TILES[t].water)); }
const onBoat = () => !!TILES[tileAt(Math.floor(P.x), Math.floor(P.y))].water;
// 人的半徑約 0.3 公尺，換算成格子
function free(x, y) {
  if (REAL && bldAt(x * TX, y * TZ, .3) >= 0) return false;   // 真實地圖：撞到房子的牆
  const ox = .3 / TX, oy = .3 / TZ;
  for (const [a, b] of [[-ox, -oy], [ox, -oy], [-ox, oy], [ox, oy]]) {
    if (!canEnter(tileAt(Math.floor(x + a), Math.floor(y + b)))) return false;
  }
  return true;
}

// 魚在世界中的位置（公尺）
function fishWorld(Fi, th = Fi.th, d = Fi.d) { const a = Fi.a0 + th; return [Fi.px - Math.sin(a) * d, Fi.pz - Math.cos(a) * d]; }
function updateFight(dt) {
  const v = moveInput();
  const r = stepFight(F, { rod: clamp(v.s, -1, 1), reel: holding }, dt, {
    rodLv: S.rod, reelBuff: hasBuff('grill'), soupBuff: hasBuff('soup'),
    lineHp: LINES[S.line - 1].hp, reelSp: REELS[S.reel - 1].sp, wearMul: REELS[S.reel - 1].wear,
    inWater: (th, d) => {   // 魚有體積：身體四周都要在水裡（不會鑽到岸上、碼頭底下）
      const [x, z] = fishWorld(F, th, d), r = clamp(fishLen(F.f, F.size) * .45, .3, 1.2);
      for (const [a, b] of [[0, 0], [r, 0], [-r, 0], [0, r], [0, -r]]) if (!TILES[tileAt(Math.floor((x + a) / TX), Math.floor((z + b) / TZ))].water) return false;
      return true;
    },
  });
  const [fx, fz] = fishWorld(F);
  spot.x = fx / TX; spot.y = fz / TZ;
  // 鏡頭慢慢跟著魚轉，魚一直在視線前方
  let da = F.a0 + F.th - yaw; da = Math.atan2(Math.sin(da), Math.cos(da)); yaw += da * Math.min(1, dt * 1.6);
  const tp = -Math.atan2(camera.position.y - WATER_Y, F.d) * .9;   // 也往下看向魚
  pitch += (tp - pitch) * Math.min(1, dt * 1.2);
  // 魚衝刺、甩頭時水面有水花
  // 魚跑的時候線入水的地方拖出水痕，跑越快越明顯
  const pw = 1 + (F.lv - 1) * .35;   // 魚越強，水花、震動越誇張
  if ((F.act === 'run' && Math.random() < dt * (5 + Math.abs(F.vlat) * 12)) || (F.act === 'shake' && Math.random() < dt * 16)) splash(spot.x, spot.y, 2, pw);
  // 跳出水面、落回水裡都有大水花；稀有以上的魚跳起來會慢動作
  if (F.act === 'jump' && !F.jOut) { F.jOut = true; splash(spot.x, spot.y, 16, pw); }
  if (F.act === 'jump' && !F.jSlow && F.jump > .3 && F.lv >= 3) {
    F.jSlow = true; slowMo(.35 + .1 * F.lv); fxFlash(.15 + .08 * F.lv);
    bigCue(F.lv >= 5 ? '怪物級大跳躍！！' : F.lv >= 4 ? '大魚跳出水面！' : '跳起來了！', F.lv);
  }
  if (F.act === 'jump' && !F.jIn && F.jump > .98) { F.jIn = true; splash(spot.x, spot.y, 22, pw); }
  // 大魚剛開始甩頭、爆衝：畫面跳出大字
  if (F.age <= dt * 1.01 && F.lv >= 3) {
    if (F.act === 'shake') { bigCue('猛烈甩頭！', F.lv); splash(spot.x, spot.y, 10, pw); }
    else if (F.act === 'run' && F.lv >= 4) { bigCue(F.dir ? '橫向爆衝！' : '往外狂奔！', F.lv); splash(spot.x, spot.y, 8, pw); }
  }
  if (F.spike > .3 && navigator.vibrate) navigator.vibrate(30);   // 有支援的手機會震一下

// 水花（公尺座標，畫在 3D 世界裡）
function splash(x, y, n, pw = 1) {   // pw：力道，越強的魚水花越大
  n = Math.round(n * pw);
  for (let k = 0; k < n; k++) parts.push({ x: x * TX, y: WATER_Y + .05, z: y * TZ, vx: rand(-1.2, 1.2) * Math.sqrt(pw), vy: rand(1.5, 3.5) * pw, vz: rand(-1.2, 1.2) * Math.sqrt(pw), life: rand(.4, .8) * Math.sqrt(pw) });

  addRipple(x * TX, y * TZ, Math.min(1.6, .25 + n * .06));

}
function updateParts(dt) {
  for (let k = parts.length - 1; k >= 0; k--) {
    const p = parts[k];
    p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vy -= 9.8 * dt; p.life -= dt;
    if (p.life <= 0 || p.y < WATER_Y - .2) parts.splice(k, 1);

// ================= 畫面上的資訊 =================
let lastHud = '';
function updateHud() {
  let btn = '', label = '';
  if (state === 'charge') { btn = 'charge'; label = '放開拋竿<small>力道 ' + Math.round(castPower() * 100) + '%</small>'; }
  else if (state === 'walk') {
    btn = aimSpot(1) ? '' : 'dim';
    label = '下竿<small>' + (S.bait === 'bread' ? '麵包屑' : LURE_BY[S.bait] ? LURE_BY[S.bait].name + '（誘餌）' : BAIT_BY[S.bait].name + '×' + (S.baits[S.bait] || 0)) + '</small>';
  }
  else if ((state === 'cast' || state === 'wait') && spot && spot.rig === 'lure') { btn = 'wait' + (holding ? ' hold' : ''); label = '收線<small>收一收、停一停</small>'; }
  else if (state === 'cast' || state === 'wait') { btn = 'wait'; label = '收竿<small>' + (spot && spot.rig === 'bottom' ? '看竿尖…' : '等魚上鉤…') + '</small>'; }
  else if (state === 'bite') { btn = 'bite'; label = '拉竿！'; }
  else if (state === 'fight') {
    btn = 'fight' + (holding ? ' hold' : ''); label = '收線<small>按住捲線</small>';
    $('fcue').textContent = F.drag ? '嘶——捲線器在出線！' : fightCue(F);
    $('fline').textContent = `出線 ${F.d.toFixed(1)} m`;
    $('fHp').style.width = (F.stam * 100).toFixed(1) + '%';   // 魚的體力
    const hp = F.hp == null ? 1 : F.hp / F.hpMax;
    $('fDur').style.width = (hp * 100).toFixed(1) + '%';
    $('fDur').style.background = hp > .5 ? '#7ee081' : hp > .25 ? '#ffc94d' : '#ff6b6b';
    $('fDurN').textContent = `${Math.ceil(F.hp == null ? LINES[S.line - 1].hp : F.hp)}/${LINES[S.line - 1].hp}`;
  } else { btn = 'dim'; label = '下竿'; }
  const nb = METHODS.filter(m => hasBuff(m.id)).length;
  const hh = gameHour(), info = `${String(Math.floor(hh)).padStart(2, '0')}:${String(Math.floor(hh % 1 * 6) * 10).padStart(2, '0')} ${TIDE_NAME[tide().k]}・$${fmtN(S.money)}・${weather.name}` + (nb ? `・加成 ${nb}` : '') + (onBoat() ? `・${BOATS[S.boat - 1].name}` : '');
  $('bang').classList.toggle('on', state === 'bite');
  $('danger').style.opacity = state === 'fight' && F ? clamp((F.tens + F.spike - .62) / .3, 0, 1) : 0;   // 快斷線時畫面邊緣泛紅
  const rg = RIGS[state === 'walk' || !spot ? rigOf() : spot.rig || 'float'], rigTxt = rg.icon + ' ' + rg.name;
  const key = [btn, label, info, bag.length, rigTxt].join('|');
  if (key === lastHud) return;
  lastHud = key;
  act.className = btn; act.innerHTML = label;
  $('info').textContent = info;
  $('bagCount').textContent = bag.length || '';
  $('rigBtn').textContent = rigTxt;
}

// ================= 隱藏模式的報表 =================
function drawSheet() {
  const c = $('sheet'), r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  if (!r.width) return;
  c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr);
  const x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const CW = 60, CH = 24, HW = 34, HH = 20;
  x.fillStyle = '#fff'; x.fillRect(0, 0, r.width, r.height);
  x.textBaseline = 'middle';
  const cols = Math.ceil((r.width - HW) / CW), rows = Math.ceil((r.height - HH) / CH);
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const px = HW + i * CW, py = HH + j * CH, head = j === 0;
    if (head) { x.fillStyle = '#ddebf7'; x.fillRect(px, py, CW, CH); }
    x.fillStyle = '#222'; x.font = head ? FONT_B : FONT;
    const t = cellText(i, j);
    if (head) { x.textAlign = 'center'; x.fillText(t, px + CW / 2, py + CH / 2 + .5); }
    else if (i % HEADS.length === 0) { x.textAlign = 'left'; x.fillText(t, px + 4, py + CH / 2 + .5); }
    else { x.textAlign = 'right'; x.fillText(t, px + CW - 4, py + CH / 2 + .5); }
  }
  x.strokeStyle = '#e1e1e1'; x.lineWidth = 1; x.beginPath();
  for (let i = 0; i <= cols; i++) { x.moveTo(HW + i * CW - .5, HH); x.lineTo(HW + i * CW - .5, r.height); }
  for (let j = 0; j <= rows; j++) { x.moveTo(HW, HH + j * CH - .5); x.lineTo(r.width, HH + j * CH - .5); }
  x.stroke();
  x.fillStyle = '#f3f3f3'; x.fillRect(0, 0, r.width, HH); x.fillRect(0, 0, HW, r.height);
  x.fillStyle = '#555'; x.font = FONT; x.textAlign = 'center';
  for (let i = 0; i < cols; i++) x.fillText(colName(i), HW + i * CW + CW / 2, HH / 2 + 1);
  for (let j = 0; j < rows; j++) x.fillText(j + 1, HW / 2, HH + j * CH + CH / 2 + .5);
  // 選取框在 C2
  x.strokeStyle = '#217346'; x.lineWidth = 2; x.strokeRect(HW + 2 * CW, HH + CH, CW, CH);
  x.fillStyle = '#217346'; x.fillRect(HW + 3 * CW - 3, HH + 2 * CH - 3, 6, 6);
  $('formula').textContent = cellText(2, 1);
}

// 慢動作、白光、大字（大魚搏鬥用）
let slowT = 0;
function slowMo(t) { slowT = Math.max(slowT, t); }

  void e.offsetWidth; e.style.transition = 'opacity .6s ease-out'; e.style.opacity = 0;

}

// ================= 聲音：全部用 Web Audio 即時合成，不用音檔 =================
// 海浪、風、雨、夜晚的蟲鳴、拋竿的咻聲、落水、魚啄、捲線器喀喀聲、洩線、斷線、釣到的音效
const SND = { ctx: null, master: null, noise: null, amb: {}, clickT: 0, last: {} };
function sndInit() {
  if (SND.ctx) { if (SND.ctx.state === 'suspended') SND.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const c = SND.ctx = new AC();
  SND.master = c.createGain(); SND.master.gain.value = S.opt.sound ? .9 : 0; SND.master.connect(c.destination);
  const buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = buf.getChannelData(0);
  let b0 = 0;
  for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; b0 = .97 * b0 + .03 * w; d[i] = w * .6 + b0 * 3; }   // 白噪音＋一點低頻
  SND.noise = buf;
  // 環境音：海浪（低沉）、風（中頻）、雨（高頻）
  for (const [k, type, f, q] of [['wave', 'lowpass', 420, .7], ['wind', 'bandpass', 800, .6], ['rain', 'highpass', 2600, .5]]) {
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true; src.playbackRate.value = .5 + Math.random() * .2;
    const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = c.createGain(); g.gain.value = 0;
    src.connect(fl); fl.connect(g); g.connect(SND.master); src.start();
    SND.amb[k] = g;
  }
}
['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, sndInit, { passive: true }));
function sndSet() { if (SND.master) SND.master.gain.setTargetAtTime(S.opt.sound ? .9 : 0, SND.ctx.currentTime, .05); }
// 一小段濾過的噪音（水花、咻聲）
function noiseHit(type, f0, f1, dur, vol, q = 1) {
  const c = SND.ctx; if (!c || !S.opt.sound) return;
  const t = c.currentTime, src = c.createBufferSource(); src.buffer = SND.noise; src.playbackRate.value = 1;
  const fl = c.createBiquadFilter(); fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  src.connect(fl); fl.connect(g); g.connect(SND.master); src.start(t, Math.random() * 1.5); src.stop(t + dur + .05);
}
// 一聲短音（喀聲、叮聲）
function tone(freq, dur, vol, type = 'sine', when = 0, f1) {
  const c = SND.ctx; if (!c || !S.opt.sound) return;
  const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .004); g.gain.exponentialRampToValueAtTime(.0008, t + dur);
  o.connect(g); g.connect(SND.master); o.start(t); o.stop(t + dur + .02);
}
const SFX = {
  whoosh: pw => noiseHit('bandpass', 500, 2400 + pw * 1500, .3 + pw * .25, .25 + pw * .2, 1.4),
  plop: () => { tone(320, .12, .18, 'sine', 0, 120); noiseHit('lowpass', 1400, 300, .25, .15); },
  splash: n => {   // 太密的水花聲合併
    const now = performance.now(); if (now - (SND.last.splash || 0) < 90) return; SND.last.splash = now;
    noiseHit('lowpass', 900 + n * 120, 200, .2 + n * .03, Math.min(.45, .08 + n * .025));
  },
  nibble: () => tone(190, .06, .14, 'sine', 0, 140),
  bite: () => { tone(140, .25, .3, 'sine', 0, 60); noiseHit('lowpass', 1100, 250, .3, .2); },
  snap: () => { noiseHit('highpass', 5000, 2500, .08, .35); tone(90, .3, .25, 'triangle', .02, 45); },
  catch: () => [523, 659, 784, 1047].forEach((f, k) => tone(f, .35, .16, 'triangle', k * .09)),
  click: () => tone(1400, .03, .06, 'square'),
  coin: () => { tone(988, .08, .12, 'square'); tone(1319, .25, .12, 'square', .07); },
};
// 每幀：環境音的大小、捲線器聲、洩線聲、蟲鳴
function updateSound(dt) {
  const c = SND.ctx; if (!c) return;
  const t = c.currentTime, nearWater = state !== 'walk' || onBoat() || TILES[tileAt(Math.floor(P.x + 2), Math.floor(P.y))].water || TILES[tileAt(Math.floor(P.x - 2), Math.floor(P.y))].water;
  const swell = .7 + .3 * Math.sin(waveT * .5) * Math.sin(waveT * .23 + 1);
  SND.amb.wave.gain.setTargetAtTime((.05 + waveAmp * .35) * (nearWater ? 1 : .35) * swell, t, .3);
  SND.amb.wind.gain.setTargetAtTime(weather.severe ? .16 : weather.id === 'cloud' ? .035 : .015, t, .5);
  SND.amb.rain.gain.setTargetAtTime(weather.rain ? weather.rain / 170 * .16 : 0, t, .5);
  // 捲線器：收線時喀喀喀，魚把線拉出去（洩線）時快速尖銳的聲音
  if (state === 'wait' && holding && spot && spot.rig === 'lure') {
    SND.clickT -= dt;
    while (SND.clickT <= 0) { SND.clickT += 1 / (10 + 6 * REELS[S.reel - 1].sp); tone(1700, .015, .03, 'square'); }
  }
  if (state === 'fight' && F) {
    const rate = F.drag ? 38 + F.tens * 20 : holding ? 12 + 8 * REELS[S.reel - 1].sp : 0;
    if (rate) {
      SND.clickT -= dt;
      while (SND.clickT <= 0) { SND.clickT += 1 / rate; F.drag ? tone(3200 + Math.random() * 400, .012, .05, 'square') : tone(1700, .015, .035, 'square'); }
    }
  }
  // 夜晚在陸地上：蟲鳴
  if (envDay < .3 && !nearWater && Math.random() < dt * .8) for (let k = 0; k < 3; k++) tone(4300 + Math.random() * 300, .04, .02, 'sine', k * .07);
}

// ---- 設定：音效、體感拋竿、操作說明 ----
function openSettings() {
  if (boss || state === 'fight' || state === 'bite' || state === 'land') return;
  const d = el('div');
  const row = (name, desc, on, toggle) => {
    const c = el('div', 'tb-quest'), mid = el('div', 'tb-qm');
    mid.appendChild(el('b', null, name)); mid.appendChild(el('div', 'tb-qline', desc)); c.appendChild(mid);
    const b = el('button', 'tb-eq', on ? '開' : '關'); if (!on) b.classList.add('off');
    b.onclick = toggle; c.appendChild(b); d.appendChild(c);
  };
  row('音效', '海浪、風雨、捲線器、水花，全部即時合成', S.opt.sound, () => { S.opt.sound = !S.opt.sound; saveAll(); sndInit(); sndSet(); openSettings(); });
  row('體感拋竿', '按一下下竿鍵，再真的揮動手機拋出去（iPhone 會先問要不要允許）', S.opt.motion, async () => {
    if (!S.opt.motion) { const ok = await askMotion(); if (!ok) { toast('沒有允許動作感應，沒辦法用體感拋竿'); return; } }
    S.opt.motion = !S.opt.motion; saveAll(); openSettings();
  });
  d.appendChild(el('div', 'sect', '怎麼釣'));
  for (const t of ['拋竿：按住下竿鍵往下拉（竿子往後），再往上甩出去，甩越快拋越遠，往左右甩可以偏一點', '只按住不動也可以：力道會來回擺，放開時拋出', '等魚：魚會游過來繞圈、輕啄，浮標「整個沉下去」才拉竿', '搏鬥：看線往哪邊跑，竿子往反方向壓；魚累了按住收線', '釣法（下竿鍵左邊）：浮釣看浮標、沉底看竿尖；裝誘餌就是路亞，收一收、停一停', '點上面的時間：看潮汐、現在好釣的魚、今日挑戰']) d.appendChild(el('div', 'tb-story', '・' + t));
  if (REAL) d.appendChild(el('div', 'tb-story', '地圖：桃園竹圍漁港（試作）。地圖資料 © OpenStreetMap 貢獻者（ODbL）；沒畫到的房子是程式補的。'));
  openDlg('設定', d);
}

// ================= 主迴圈 =================
applyQuality();
let lastT = performance.now();
function frame(now) {
  const raw = (now - lastT) / 1000; lastT = now;
  const dt = Math.min(0.05, raw) * (slowT > 0 ? .3 : 1); slowT -= Math.min(raw, .1);   // 慢動作時時間變慢
  if (!boss) {
    watchFps(raw);
    if (!$('dlg').classList.contains('on')) update(dt);
    render3D(dt);
    updateSound(dt);
    updateHud();
    mctx.setTransform(2, 0, 0, 2, 0, 0); drawMap(mctx, CFG.miniW, MINI_H);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
